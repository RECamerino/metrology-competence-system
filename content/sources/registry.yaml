# Source Licence Register
# ============================================================================
# Every source cited anywhere in the corpus MUST appear here. This file — not
# the schema, not the author — decides what may be quoted from a given
# document. The validator reads these limits and enforces them mechanically.
#
# TIERS
#   1  Verbatim quotation permitted, within the recorded limits.
#   2  Fully referenceable; bounded quotation only. Quote text is removed by
#      the --strip-tier2 redistributable build; citations always survive.
#   3  Reference only. No quotation. The reader consults their own licensed
#      copy; organizations may inject licensed text via a local overlay.
#
# DEFAULT POSTURE IS CONSERVATIVE. When a publisher's terms are unclear, the
# source is Tier 3. Promoting a source to a higher tier requires a documented
# basis in `termsBasis` and steward approval (GOVERNANCE.md).
#
# ---------------------------------------------------------------------------
# STATUS OF THIS FILE: PRELIMINARY — PENDING LEGAL REVIEW
# ---------------------------------------------------------------------------
# Tier assignments below are a good-faith first classification made by reading
# each publisher's stated terms. They are NOT legal advice and have NOT been
# reviewed by counsel. Entries whose classification rests on an interpretation
# rather than an explicit licence grant are flagged in `notes` with
# CONFIRM-WITH-COUNSEL. No Tier 1 or Tier 2 quotation should be authored
# against a flagged entry until that review is complete. Citations are
# unaffected — referencing a document by clause is always safe.
# ============================================================================

