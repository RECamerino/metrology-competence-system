# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.
#
# ONE EC PACK PER DP. DP-18 is the discipline this pack serves. The parity is a
# test rather than a tidiness rule: a discipline with no equipment pack is a
# discipline whose instruments nobody can be assessed on.

schemaVersion: 1
domains:
  - id: EC-18
    title: Nanometrology and Surface Science Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating instruments that measure at the nanometre scale, where
      the probe is comparable in size to the feature, the artefact is
      itself a national-scale challenge, and drift over a single scan is a
      real error source.

    competencyAreas:

      - id: EC-18-A01
        title: Scanning Probe Microscope Calibration
        status: draft
        summary: >-
          AFM and STM instruments calibrated in all three axes against
          transfer standards, where the tip and the scanner nonlinearity
          dominate.
        elements:
          - { id: EC-18-001, title: "Receiving inspection and functional check of a scanning probe microscope", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-18-002, title: "Calibration configuration and stabilization for a scanning probe microscope", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-18-003, title: "Selecting the standards and fixturing for a scanning probe microscope calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-18-004, title: "Lateral X and Y scale calibration against a grating standard", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-18-005, title: "Z scale calibration against step height standards", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-18-006, title: "Scanner nonlinearity, hysteresis and creep correction", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-18-007, title: "Tip geometry, radius and its convolution with the feature", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-18-008, title: "Thermal drift over a scan and its correction", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-18-009, title: "Force calibration and cantilever spring constant determination", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-18-010, title: "Orthogonality and crosstalk between axes", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-18-011, title: "Noise floor and vertical resolution determination", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-18-012, title: "Adjustment of a scanning probe microscope, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-18-013, title: "Uncertainty budget for a scanning probe microscope calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-18-014, title: "Conformity statement for a scanning probe microscope against its specification", kind: judgment, levelCeiling: 4, status: draft }

