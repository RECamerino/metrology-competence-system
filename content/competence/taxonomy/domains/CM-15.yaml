schemaVersion: 1
domains:
  - id: CM-15
    title: Technical Communication and Documentation
    kind: core
    status: draft
    summary: >-
      Writing and speaking about measurement so that the right people act
      correctly on it. One of the most commonly missed competencies: a
      metrologist whose analysis is right and whose report is unreadable has not
      finished the job. Includes adapting technical content to an audience,
      which is a distinct and teachable skill. Boundary: visual presentation is
      CM-16; teaching is CM-17.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: CM-15-A07
        title: Foundational Knowledge — Recording and Reporting a Result
        status: draft
        summary: >-
          Writing down what happened so that somebody who was not there
          can rely on it, which is a skill and not a formality.
        elements:
          - { id: CM-15-046, title: "What a measurement record must contain", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-15-047, title: "Writing legibly, unambiguously and in the right units", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-048, title: "Correcting an entry without obscuring it", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-049, title: "Reporting a result with its uncertainty", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-050, title: "Statements of conformity in plain terms", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-15-051, title: "Describing a deviation from the procedure", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-052, title: "Writing for the person who reads it next", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-15-053, title: "Tables, figures and when each is clearer", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-054, title: "Avoiding claims the data does not support", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-15-055, title: "Reviewing somebody else's record", kind: skill, levelCeiling: 3, status: draft }

      - id: CM-15-A01
        title: Foundations of Technical Writing
        status: draft
        elements:
          - { id: CM-15-001, title: "Purpose, audience and scope before writing", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-15-002, title: "Structure: leading with the conclusion", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-003, title: "Precision of language and avoidable ambiguity", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-004, title: "Concision and removing what does not carry information", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-005, title: "Objectivity, hedging and overclaiming", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-006, title: "Numbers in prose: significant figures, units and consistency", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-007, title: "Editing your own work and the value of distance", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-008, title: "Giving and receiving written review", kind: skill, levelCeiling: 3, status: draft }

      - id: CM-15-A02
        title: Measurement Reports and Certificates
        status: draft
        summary: >-
          Boundary: the required content of a calibration certificate is
          CM-06-A06 and CM-10; this area is how to write it well.
        elements:
          - { id: CM-15-009, title: "Anatomy of a technical measurement report", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-010, title: "Stating what was measured, how, and under what conditions", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-011, title: "Presenting results with uncertainty without burying the answer", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-15-012, title: "Writing conclusions that follow from the evidence presented", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-013, title: "Limitations, caveats and stating what the result does not show", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-014, title: "Traceability statements and their wording", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-015, title: "Writing for a reader who will act without reading it all", kind: judgment, levelCeiling: 4, status: draft }

      - id: CM-15-A03
        title: Procedures, Instructions and Standards
        status: draft
        elements:
          - { id: CM-15-016, title: "Writing a procedure that survives contact with a real operator", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-15-017, title: "Step granularity and assumed knowledge", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-018, title: "Warnings, cautions and safety-critical instruction", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-019, title: "Writing to be translated", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-020, title: "Quality manual and policy writing", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-021, title: "Drafting and reviewing standards and specifications", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-022, title: "Requirements language: shall, should, may and must", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-15-023, title: "Maintaining documents over time without incoherence", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-15-A04
        title: Adapting Technical Content to an Audience
        status: draft
        summary: >-
          The competence that determines whether metrology influences decisions
          or is merely consulted. Deliberately its own area.
        elements:
          - { id: CM-15-024, title: "Diagnosing what an audience already knows and needs", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-025, title: "Writing for executives and non-technical decision makers", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-026, title: "Writing for production and operations audiences", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-027, title: "Writing for auditors, assessors and regulators", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-028, title: "Writing for other metrologists and technical peers", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-029, title: "Explaining uncertainty and risk to people who want a yes or no", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-15-030, title: "Analogy and simplification without distortion", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-031, title: "Knowing when simplification has become misrepresentation", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-15-032, title: "Delivering unwelcome technical findings", kind: judgment, levelCeiling: 5, status: draft }

      - id: CM-15-A05
        title: Presentation and Spoken Communication
        status: draft
        elements:
          - { id: CM-15-033, title: "Structuring a technical talk", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-034, title: "Slide design that supports rather than replaces the speaker", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-035, title: "Presenting to a hostile or sceptical audience", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-036, title: "Handling questions, including ones you cannot answer", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-037, title: "Explaining a measurement at the bench, informally", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-038, title: "Meeting facilitation and technical decision making", kind: judgment, levelCeiling: 4, status: draft }

      - id: CM-15-A06
        title: Scholarly and Professional Publication
        status: draft
        elements:
          - { id: CM-15-039, title: "Structure and conventions of a technical paper", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-15-040, title: "Literature search and staying current", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-041, title: "Citation, attribution and avoiding plagiarism", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-042, title: "Peer review: submitting to it and performing it", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-15-043, title: "Conference papers, posters and technical presentations", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-044, title: "Writing for a professional society audience", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-15-045, title: "Publishing negative and null results", kind: judgment, levelCeiling: 4, status: draft }
