# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.
#
# ONE EC PACK PER DP. DP-11 is the discipline this pack serves. The parity is a
# test rather than a tidiness rule: a discipline with no equipment pack is a
# discipline whose instruments nobody can be assessed on.

schemaVersion: 1
domains:
  - id: EC-17
    title: Magnetic Measurement Equipment Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the instruments of magnetic measurement, where the probe
      orientation, the field gradient and the material history are inside
      every reading. This pack existed nowhere: the electrical power pack
      claimed DP-11 and covered only its high-voltage half.

    competencyAreas:

      - id: EC-17-A01
        title: Gaussmeter and Teslameter Calibration
        status: draft
        summary: >-
          Hall-probe and NMR field instruments, calibrated in a known
          field where the probe's own orientation and active area define
          the result.
        elements:
          - { id: EC-17-001, title: "Receiving inspection and functional check of a gaussmeter", kind: skill, levelCeiling: 3, status: draft }
