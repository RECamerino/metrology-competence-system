schemaVersion: 1
domains:
  - id: CM-19
    title: Ethics, Legal and Regulatory Metrology
    kind: core
    status: draft
    summary: >-
      Where measurement carries legal force, and where a metrologist's
      professional obligations may conflict with commercial pressure. Legal
      metrology (OIML and national frameworks) and professional ethics are
      combined here because both concern the enforceable consequences of a
      measurement result. Boundary: accreditation requirements are CM-10;
      signatory responsibility is CM-11.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: CM-19-A07
        title: Foundational Knowledge — Integrity in Measurement Work
        status: draft
        summary: >-
          The conduct the whole system rests on, stated as competence
          because it is one: everything else in this corpus is worthless
          if the number was invented.
        elements:
          - { id: CM-19-049, title: "Why a measurement record is a statement of fact", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-19-050, title: "Falsification, and the forms it takes in a laboratory", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-19-051, title: "Recording a result you did not expect", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-19-052, title: "Pressure to pass an item, and what to do about it", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-19-053, title: "Repeating a measurement until it passes", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-19-054, title: "Reporting your own mistake", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-19-055, title: "Working within your own competence", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-19-056, title: "Confidentiality of a customer's information", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-19-057, title: "Impartiality and conflict of interest", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-19-058, title: "Legal metrology and where measurement is regulated", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-19-059, title: "Raising a concern and whistleblowing routes", kind: knowledge, levelCeiling: 3, status: draft }

      - id: CM-19-A01
        title: Professional Ethics
        status: draft
        elements:
          - { id: CM-19-001, title: "Professional obligations of a metrologist", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-19-002, title: "Honesty in reporting and the duty not to mislead", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-19-003, title: "Data selection, exclusion and the boundary with fabrication", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-19-004, title: "Pressure to report a favourable result", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-19-005, title: "Conflicts of interest and impartiality in practice", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-19-006, title: "Competence limits and declining work you cannot do", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-19-007, title: "Confidentiality and its limits", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-19-008, title: "Raising concerns and whistleblowing", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-19-009, title: "Research integrity and authorship", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-19-010, title: "Case studies in measurement-related failure and misconduct", kind: knowledge, levelCeiling: 4, status: draft }

