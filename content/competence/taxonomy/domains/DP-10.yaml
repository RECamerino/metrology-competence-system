          - { id: DP-10-028, title: "Uncertainty evaluation for S-parameter measurement", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-10-029, title: "Nonlinear device characterisation and large-signal measurement", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-10-A04
        title: Signal Generation, Analysis and Noise
        status: draft
        elements:
          - { id: DP-10-030, title: "Signal generator characterisation and calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-031, title: "Spectrum analyser architecture and calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-032, title: "Attenuation measurement and standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-033, title: "Modulation measurement and analysis", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-034, title: "Noise figure and noise temperature", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-035, title: "Noise sources and excess noise ratio", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-036, title: "Phase noise measurement", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-10-037, title: "Intermodulation and linearity measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-038, title: "Digital modulation and error vector magnitude", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-10-A05
        title: Antennas and Field Measurement
        status: draft
        elements:
          - { id: DP-10-039, title: "Antenna parameters: gain, pattern, polarisation, efficiency", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-040, title: "Antenna gain measurement methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-041, title: "Near-field and far-field regions", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-042, title: "Anechoic chambers and antenna ranges", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-043, title: "Near-field scanning and transformation", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-10-044, title: "Field strength measurement and probes", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-045, title: "Antenna factor and its calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-046, title: "Over-the-air testing and reverberation chambers", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-047, title: "Radar cross section and scattering measurement", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-10-A06
