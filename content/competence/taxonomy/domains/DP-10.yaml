          - { id: DP-10-049, title: "Conducted emissions measurement and LISN", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-050, title: "Radiated emissions measurement and test sites", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-051, title: "Test site validation and site attenuation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-052, title: "Immunity testing: radiated and conducted", kind: skill, levelCeiling: 4, status: draft }
