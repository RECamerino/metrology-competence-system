          - { id: DP-10-056, title: "Calibration of EMC test equipment", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-057, title: "Human exposure and SAR measurement", kind: skill, levelCeiling: 4, status: draft }
