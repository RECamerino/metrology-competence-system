schemaVersion: 1
domains:
  - id: DP-10
    title: RF, Microwave, Antenna and EMC
    kind: discipline
    status: draft
    summary: >-
      Measurement where wavelength becomes comparable to the apparatus and
      lumped-element thinking fails. Distinguished by the fact that the
      connection between instrument and device is itself part of the
      measurement, which is why connector care and de-embedding carry as much
      weight here as the instrument specification.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-10-A07
        title: Foundational Knowledge — Radio Frequency, Impedance and the Decibel
        status: draft
        summary: >-
          Why RF is different: the cable is part of the circuit,
          everything is a ratio in decibels, and a connector is a
          precision component.
        elements:
          - { id: DP-10-058, title: "Frequency, wavelength and their relationship", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-059, title: "Why a cable becomes a transmission line at high frequency", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-060, title: "Characteristic impedance and the 50 ohm convention", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-061, title: "Reflection, VSWR and return loss as one idea", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-062, title: "The decibel, dBm and absolute against relative levels", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-063, title: "Insertion loss and attenuation", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-064, title: "Connector types and matching them correctly", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-065, title: "Connector care, torque and gauging", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-10-066, title: "Cable flexure, phase stability and damage", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-10-067, title: "Terminations and why an unterminated port matters", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-068, title: "Adapters and what each one costs the measurement", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-069, title: "Power levels, damage thresholds and protecting a sensor", kind: judgment, levelCeiling: 3, status: draft }
          - { id: DP-10-070, title: "RF exposure and safe working practice", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-10-071, title: "Recording an RF result with its frequency and conditions", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-10-A01
        title: RF Fundamentals
        status: draft
        elements:
          - { id: DP-10-001, title: "Transmission line theory and characteristic impedance", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-002, title: "Reflection coefficient, VSWR and return loss", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-003, title: "Scattering parameters and their meaning", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-10-004, title: "The Smith chart and impedance transformation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-005, title: "Waveguide modes and cutoff", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-006, title: "Skin effect, dielectric loss and dispersion", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-007, title: "Mismatch uncertainty and its evaluation", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-10-008, title: "Connector types, care and repeatability", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-009, title: "Cable effects, flexure and phase stability", kind: knowledge, levelCeiling: 4, status: draft }

      - id: DP-10-A02
        title: RF Power
        status: draft
        elements:
          - { id: DP-10-010, title: "RF power definitions and units", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-011, title: "Microcalorimeters as primary power standards", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-10-012, title: "Thermistor and bolometric power sensors", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-013, title: "Thermocouple and diode power sensors", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-014, title: "Effective efficiency and calibration factor", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-10-015, title: "Power sensor calibration and transfer", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-016, title: "Peak and pulse power measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-017, title: "High power measurement and directional couplers", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-10-018, title: "Uncertainty budget for RF power measurement", kind: skill, levelCeiling: 5, status: draft }

