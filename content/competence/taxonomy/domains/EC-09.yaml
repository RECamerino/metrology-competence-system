# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-09
    title: Chemical and Analytical Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the instruments of chemical measurement, where the
      calibrant is a certified reference material, the sample matrix
      changes the answer, and calibration and method validation are harder
      to separate than elsewhere. Boundary: the measurement science is
      DP-16.

    competencyAreas:

      - id: EC-09-A01
        title: pH and Ion-Selective Electrode Calibration
        status: draft
        summary: >-
          Slope and offset from buffers, where temperature and electrode
          condition matter more than the meter.
        elements:
          - { id: EC-09-001, title: "Receiving inspection and functional check of a pH meter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-09-002, title: "Calibration configuration and stabilisation for a pH meter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-09-003, title: "Selecting the standards and fixturing for a pH meter calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-09-004, title: "Slope and offset determination from buffer solutions", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-09-005, title: "Buffer selection, bracketing and traceability", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-09-006, title: "Temperature compensation and isopotential point", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-09-007, title: "Electrode response time and drift", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-09-008, title: "Junction potential and sample matrix effects", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-09-009, title: "Electrode condition, cleaning and storage", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-09-010, title: "Ion-selective electrode selectivity and interference", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-09-011, title: "Adjustment of a pH meter, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-09-012, title: "Uncertainty budget for a pH meter calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-09-013, title: "Conformity statement for a pH meter against its specification", kind: judgment, levelCeiling: 4, status: draft }

