schemaVersion: 1
domains:
  - id: CM-14
    title: Software, Data and Digital Metrology
    kind: core
    status: draft
    summary: >-
      Software is now part of almost every measurement chain, and is the least
      controlled part of most of them. Covers software as a measurement
      component, the engineering practice needed to build it responsibly, data
      management, and the emerging digital infrastructure. Boundary: machine
      learning is CM-21; visual presentation is CM-16.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: CM-14-A07
        title: Foundational Knowledge — Measurement Software and Data Handling
        status: draft
        summary: >-
          The everyday computer competence a measurement result passes
          through, where the commonest error is not a wrong reading but
          a right one entered wrongly.
        elements:
          - { id: CM-14-054, title: "Data entry, transcription and checking", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-055, title: "Spreadsheets: formulas, references and their common errors", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-056, title: "Units and unit consistency in a calculation", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-057, title: "Rounding and precision in software", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-058, title: "File naming, versions and finding a record later", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-059, title: "Templates and using the approved one", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-060, title: "Backups and what to do when a file is lost", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-061, title: "Instrument interfaces and captured data", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-062, title: "Copy, paste and the errors it causes", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-063, title: "Access, passwords and shared accounts", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-064, title: "Checking a calculated result independently", kind: skill, levelCeiling: 3, status: draft }

      - id: CM-14-A01
        title: Software as Part of the Measurement Chain
        status: draft
        elements:
          - { id: CM-14-001, title: "Where software enters a measurement result", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-002, title: "Software as an uncertainty source", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-14-003, title: "Floating-point arithmetic and numerical error", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-14-004, title: "Numerical conditioning, cancellation and algorithm choice", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-14-005, title: "Rounding, truncation and display precision", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-006, title: "Unit handling and unit errors in software", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-14-007, title: "Firmware, embedded processing and the hidden calculation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-14-008, title: "Spreadsheets as measurement software and why they fail", kind: judgment, levelCeiling: 4, status: draft }

      - id: CM-14-A02
        title: Software Validation and Control
        status: draft
        elements:
          - { id: CM-14-009, title: "Software validation requirements under ISO/IEC 17025", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-010, title: "Risk-based scoping of software validation", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-14-011, title: "Validating commercial off-the-shelf software", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-012, title: "Validating in-house developed software", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-013, title: "Reference data sets and numerical benchmarks", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-014, title: "Regression testing after a software change", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-015, title: "Configuration control and software version records", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-016, title: "Revalidation triggers including operating system changes", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-14-017, title: "Documenting validation so an assessor can follow it", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-14-A03
        title: Software Development Practice
        status: draft
        summary: >-
          Genuinely adjacent competence. Metrologists increasingly write code
          that produces results; most were never taught how to do it safely.
        elements:
          - { id: CM-14-018, title: "Programming fundamentals for measurement work", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-019, title: "Version control and why every analysis needs it", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-020, title: "Automated testing and test design for numerical code", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-14-021, title: "Code review as a technical control", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-14-022, title: "Requirements, specification and traceable software design", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-023, title: "Error handling and failing loudly rather than silently", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-024, title: "Reproducible computational environments", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-025, title: "Documentation and maintainability of analysis code", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-026, title: "Dependency management and supply chain considerations", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-027, title: "Working effectively with professional software teams", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-14-028, title: "Open source in a laboratory: licensing, support and risk", kind: judgment, levelCeiling: 3, status: draft }

      - id: CM-14-A04
        title: Data Management and Integrity
        status: draft
        elements:
          - { id: CM-14-029, title: "Data integrity principles and their regulatory framing", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-14-030, title: "Raw data, derived data and reconstructability of a result", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-14-031, title: "Audit trails and tamper evidence", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-032, title: "Electronic records and electronic signatures", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-033, title: "Database fundamentals for measurement data", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-034, title: "Data modelling for calibration and measurement records", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-035, title: "Backup, retention and long-term readability", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-036, title: "Data migration without loss of meaning", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-14-037, title: "Metadata and why a number without context is worthless", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-14-038, title: "FAIR data principles in a metrology setting", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-039, title: "Data cleaning and its documentation", kind: skill, levelCeiling: 3, status: draft }

      - id: CM-14-A05
        title: Digital Metrology Infrastructure
        status: draft
        summary: >-
          Boundary: DP-20 covers this material in depth for practitioners
          implementing it; these elements are what every metrologist should know.
        elements:
          - { id: CM-14-040, title: "Digital calibration certificates and machine-readable results", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-041, title: "Digital SI and machine-readable units and quantities", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-042, title: "Interoperability, schemas and data exchange formats", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-14-043, title: "Digital signatures, integrity and provenance of results", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-14-044, title: "Sensor networks and distributed measurement systems", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-14-045, title: "Digital twins and simulation-based measurement", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-14-046, title: "Cloud, on-premises and air-gapped deployment considerations", kind: judgment, levelCeiling: 3, status: draft }

      - id: CM-14-A06
        title: Cybersecurity for Measurement Systems
        status: draft
        summary: >-
          A measurement result that can be altered is not a measurement result.
          Increasingly an accreditation and regulatory expectation.
        elements:
          - { id: CM-14-047, title: "Threat model for a measurement system", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-14-048, title: "Access control and least privilege in laboratory systems", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-14-049, title: "Protecting instrument firmware and configuration", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-050, title: "Network segmentation and legacy instrument exposure", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-051, title: "Integrity protection of stored and transmitted results", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-14-052, title: "Incident response when data integrity is in question", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-14-053, title: "Operating in regulated and classified environments", kind: judgment, levelCeiling: 4, status: draft }
