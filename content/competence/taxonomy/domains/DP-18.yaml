schemaVersion: 1
domains:
  - id: DP-18
    title: Nanometrology and Surface Science
    kind: discipline
    status: draft
    summary: >-
      Measurement at scales where the probe, the surface and the measurand
      cease to be separable. Distinguished from DP-01 by the fact that
      instrument tip geometry, surface forces and contamination are not
      corrections to the result but constitutive of it. Boundary: conventional
      surface texture is DP-01-A07; nanoscale chemical analysis overlaps DP-16.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-18-A06
        title: Foundational Knowledge — Measurement at the Nanoscale
        status: draft
        summary: >-
          What changes when the feature is smaller than the probe: the
          environment becomes the dominant error, and a surface is not
          the same thing as a bulk material.
        elements:
          - { id: DP-18-040, title: "Length units at the nanometre and picometre scale", kind: knowledge, levelCeiling: 2, status: draft }
          - { id: DP-18-041, title: "Surface against bulk properties", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-18-042, title: "Probe and feature size, and what convolution means", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-18-043, title: "Vibration isolation and why a building matters", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-18-044, title: "Thermal drift over the duration of a scan", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-18-045, title: "Acoustic and airflow disturbance at the nanoscale", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-18-046, title: "Cleanliness, particulates and cleanroom classes", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-18-047, title: "Handling specimens without contaminating them", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-18-048, title: "Vacuum basics for surface instruments", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-18-049, title: "Electrostatic charge and its effect on a measurement", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-18-050, title: "Reference artefacts at the nanoscale", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-18-051, title: "Image against measurement: when a picture is not data", kind: judgment, levelCeiling: 3, status: draft }
          - { id: DP-18-052, title: "Recording a nanoscale result with its conditions", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-18-A01
        title: Foundations at the Nanoscale
        status: draft
        elements:
          - { id: DP-18-001, title: "What changes about measurement below one hundred nanometres", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-18-002, title: "Surface forces, adhesion and their effect on probing", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-18-003, title: "Tip-sample convolution and dilation", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-18-004, title: "Traceability of nanoscale dimensional measurement", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-18-005, title: "Nanoscale transfer standards and calibration artefacts", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-18-006, title: "Contamination, oxidation and surface condition", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-18-007, title: "Uncertainty evaluation at the nanoscale", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-18-A02
        title: Scanning Probe Microscopy
        status: draft
        elements:
          - { id: DP-18-008, title: "Atomic force microscopy principles and modes", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-18-009, title: "Cantilever calibration: spring constant and sensitivity", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-010, title: "Scanner calibration, nonlinearity, creep and hysteresis", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-011, title: "Metrological AFM with interferometric position feedback", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-18-012, title: "Scanning tunnelling microscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-013, title: "Tip characterization, wear and artefact recognition", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-014, title: "Force spectroscopy and nanomechanical measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-015, title: "Image processing, levelling and the risk of creating features", kind: judgment, levelCeiling: 5, status: draft }

      - id: DP-18-A03
        title: Electron and Ion Microscopy
        status: draft
        elements:
          - { id: DP-18-016, title: "Scanning electron microscopy for dimensional measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-017, title: "SEM magnification calibration and edge definition", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-018, title: "Transmission electron microscopy and lattice references", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-019, title: "Critical dimension metrology in semiconductor manufacture", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-18-020, title: "Focused ion beam and destructive cross-sectioning", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-021, title: "Charging, beam damage and sample preparation artefacts", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-18-022, title: "Electron backscatter diffraction and crystallography", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-18-A04
        title: Surface Analysis and Composition
        status: draft
        elements:
          - { id: DP-18-023, title: "X-ray photoelectron spectroscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-024, title: "Auger electron spectroscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-025, title: "Secondary ion mass spectrometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-026, title: "Depth profiling and sputter rate calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-027, title: "Quantification in surface analysis and sensitivity factors", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-18-028, title: "Ellipsometry and thin film thickness measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-029, title: "X-ray reflectometry and diffraction for thin films", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-030, title: "Contact angle and surface energy at small scales", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-18-A05
        title: Nanoparticles and Nanomaterials
        status: draft
        elements:
          - { id: DP-18-031, title: "Particle size definitions and the equivalent sphere problem", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-18-032, title: "Dynamic light scattering", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-033, title: "Particle tracking and single particle techniques", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-034, title: "Electron microscopy for particle size distribution", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-035, title: "Specific surface area and porosity measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-036, title: "Zeta potential and colloidal stability measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-037, title: "Nanoparticle reference materials", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-18-038, title: "Method comparability for particle size and its disagreements", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-18-039, title: "Regulatory definitions of nanomaterial and their measurement basis", kind: knowledge, levelCeiling: 4, status: draft }
