# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.
#
# ONE EC PACK PER DP. DP-13 is the discipline this pack serves. The parity is a
# test rather than a tidiness rule: a discipline with no equipment pack is a
# discipline whose instruments nobody can be assessed on.

schemaVersion: 1
domains:
  - id: EC-16
    title: Spectroscopic, Laser and Fibre Optic Equipment Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating lasers, fibre optic test equipment and optical spectrum
      instruments, where wavelength, launch condition and connector state
      decide the measurement. Split from the photometry pack so that DP-13
      has an equipment pack of its own.

    competencyAreas:

      - id: EC-08-A06
        title: Fibre Optic Test Equipment Calibration
        status: draft
        summary: >-
          OTDRs, loss test sets and light sources, where connector
          condition and launch conditions dominate the measured loss.
        elements:
