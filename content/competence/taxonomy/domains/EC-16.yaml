          - { id: EC-08-066, title: "Calibration configuration and stabilization for fibre optic test equipment", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-08-067, title: "Selecting the standards and fixturing for fibre optic test equipment calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-08-068, title: "OTDR distance accuracy and group index setting", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-08-069, title: "OTDR loss and reflectance measurement accuracy", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-08-070, title: "Dead zone and dynamic range verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-08-071, title: "Optical loss test set source and meter accuracy", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-08-072, title: "Launch condition, mandrel wrap and mode filling", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-08-073, title: "Connector end-face inspection and cleanliness", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-08-074, title: "Reference cord and adapter loss contribution", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-08-075, title: "Adjustment of fibre optic test equipment, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
