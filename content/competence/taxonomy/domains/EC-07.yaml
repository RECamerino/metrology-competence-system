# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-07
    title: Time, Frequency and Timing Device Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating clocks, counters, oscillators and timing receivers,
      where the reference is usually better than the device by orders of
      magnitude and the interesting quantity is stability rather than
      accuracy. Boundary: the measurement science is DP-14.

    competencyAreas:

      - id: EC-07-A01
        title: Frequency Standard and Oscillator Calibration
        status: draft
        summary: >-
          Ovened, rubidium and caesium sources characterised for offset,
          ageing and short-term stability, which are three different
          measurements.
        elements:
          - { id: EC-07-001, title: "Receiving inspection and functional check of a frequency standard", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-002, title: "Calibration configuration and stabilisation for a frequency standard", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-003, title: "Selecting the standards and fixturing for a frequency standard calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-004, title: "Frequency offset against a reference standard", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-005, title: "Ageing rate determination over time", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-006, title: "Allan deviation and short-term stability characterisation", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-007, title: "Warm-up and retrace behaviour after power cycling", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-008, title: "Temperature coefficient of frequency", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-009, title: "Phase comparison and beat frequency methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-010, title: "Disciplined oscillator holdover verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-011, title: "Adjustment of a frequency standard, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-012, title: "Uncertainty budget for a frequency standard calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-013, title: "Conformity statement for a frequency standard against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-07-A02
        title: Timing Receiver and Distribution Calibration
        status: draft
        summary: >-
          GNSS receivers and distribution amplifiers, where cable delay
          and antenna position are part of the delivered time.
        elements:
          - { id: EC-07-014, title: "Receiving inspection and functional check of a timing receiver", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-015, title: "Calibration configuration and stabilisation for a timing receiver", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-016, title: "Selecting the standards and fixturing for a timing receiver calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-017, title: "One pulse per second output accuracy against UTC", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-018, title: "Antenna cable delay determination and correction", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-019, title: "Receiver internal delay calibration", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-020, title: "Holdover performance on loss of signal", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-021, title: "Distribution amplifier channel delay and skew", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-022, title: "Time code output verification: IRIG, NTP and PTP", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-023, title: "Multipath and antenna siting effects", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-07-024, title: "Adjustment of a timing receiver, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-025, title: "Uncertainty budget for a timing receiver calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-026, title: "Conformity statement for a timing receiver against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-07-A03
        title: Stopwatch, Timer and Clock Calibration
        status: draft
        summary: >-
          Handheld and process timers, where the operator reaction time
          frequently exceeds the instrument error and has to be handled
          honestly.
        elements:
          - { id: EC-07-027, title: "Receiving inspection and functional check of a stopwatch or timer", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-028, title: "Calibration configuration and stabilisation for a stopwatch or timer", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-029, title: "Selecting the standards and fixturing for a stopwatch or timer calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-030, title: "Time interval indication error over stated durations", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-031, title: "Timebase frequency verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-032, title: "Start-stop and lap function verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-033, title: "Operator reaction and its treatment in the result", kind: judgment, levelCeiling: 3, status: draft }
          - { id: EC-07-034, title: "Display resolution and rounding behaviour", kind: skill, levelCeiling: 2, status: draft }
          - { id: EC-07-035, title: "Process timer and interval controller verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-036, title: "Adjustment of a stopwatch or timer, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-037, title: "Uncertainty budget for a stopwatch or timer calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-038, title: "Conformity statement for a stopwatch or timer against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-07-A04
        title: Phase Noise and Frequency Stability Analyser Calibration
        status: draft
        summary: >-
          Instruments that characterise oscillators, verified against
          sources of known instability because their own floor bounds
          every result.
        elements:
          - { id: EC-07-039, title: "Receiving inspection and functional check of a stability analyser", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-040, title: "Calibration configuration and stabilisation for a stability analyser", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-041, title: "Selecting the standards and fixturing for a stability analyser calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-042, title: "Allan deviation measurement verification", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-043, title: "Instrument noise floor and cross-correlation limits", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-044, title: "Phase noise measurement accuracy against a reference", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-045, title: "Frequency offset and drift measurement accuracy", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-046, title: "Measurement bandwidth and averaging effects", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-047, title: "Dead time and its effect on a stability statistic", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: EC-07-048, title: "Reference source selection for a stability measurement", kind: judgment, levelCeiling: 5, status: draft }
          - { id: EC-07-049, title: "Adjustment of a stability analyser, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-050, title: "Uncertainty budget for a stability analyser calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-051, title: "Conformity statement for a stability analyser against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-07-A05
        title: Tachometer and Rotational Speed Instrument Calibration
        status: draft
        summary: >-
          Contact, optical and stroboscopic speed measurement, where the
          sampling and the target pattern define the answer.
        elements:
          - { id: EC-07-052, title: "Receiving inspection and functional check of a tachometer", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-053, title: "Calibration configuration and stabilisation for a tachometer", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-054, title: "Selecting the standards and fixturing for a tachometer calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-055, title: "Speed indication accuracy against a reference", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-056, title: "Contact versus optical measurement technique", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-057, title: "Stroboscope flash rate accuracy and harmonic confusion", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-058, title: "Target marking, reflectivity and pulse-per-revolution setting", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-059, title: "Gate time and resolution at low speed", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-060, title: "Surface speed and length measurement functions", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-061, title: "Adjustment of a tachometer, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-062, title: "Uncertainty budget for a tachometer calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-063, title: "Conformity statement for a tachometer against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-07-A06
        title: Primary Frequency Standard Operation
        status: draft
        summary: >-
          Caesium fountains, beam standards and hydrogen masers,
          operated as the reference the rest of the timing chain is
          measured against.
        elements:
          - { id: EC-07-064, title: "Receiving inspection and functional check of a primary frequency standard", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-065, title: "Calibration configuration and stabilisation for a primary frequency standard", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-07-066, title: "Selecting the standards and fixturing for a primary frequency standard calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-067, title: "Caesium beam standard operation and tube health", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-068, title: "Caesium fountain operation and evaluation", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-069, title: "Hydrogen maser operation, cavity tuning and drift", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-070, title: "Systematic frequency shift evaluation and correction", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-071, title: "Ensemble timescale generation and steering", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-072, title: "Comparison to international time scales and reporting", kind: judgment, levelCeiling: 5, status: draft }
          - { id: EC-07-073, title: "Uncertainty budget for a primary frequency realisation", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-07-074, title: "Adjustment of a primary frequency standard, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-07-075, title: "Uncertainty budget for a primary frequency standard calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-07-076, title: "Conformity statement for a primary frequency standard against its specification", kind: judgment, levelCeiling: 4, status: draft }
