          - { id: EC-05-019, title: "Effective area determination and its uncertainty", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-05-020, title: "Mass set calibration and its traceability", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-021, title: "Local gravity value and its application", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-022, title: "Temperature correction of the piston-cylinder assembly", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-023, title: "Fall rate, rotation and float position", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-024, title: "Head correction and reference level definition", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-025, title: "Cross-float comparison between pressure balances", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-05-026, title: "Piston-cylinder condition, cleaning and wear", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-05-027, title: "Adjustment of a deadweight tester, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-05-028, title: "Uncertainty budget for a deadweight tester calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-029, title: "Conformity statement for a deadweight tester against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-05-A03
        title: Pressure Controller and Calibrator Calibration
        status: draft
        summary: >-
