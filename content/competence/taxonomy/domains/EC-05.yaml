          - { id: EC-05-037, title: "Interchangeable pressure module verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-038, title: "Leak testing the calibration system itself", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-05-039, title: "Adjustment of a pressure controller, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-05-040, title: "Uncertainty budget for a pressure controller calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-041, title: "Conformity statement for a pressure controller against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-05-A04
