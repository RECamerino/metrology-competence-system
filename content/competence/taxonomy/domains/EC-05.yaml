# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-05
    title: Pressure, Vacuum and Flow Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the instruments of fluid measurement, where head
      correction, media compatibility and the difference between gauge and
      absolute are routine sources of a wrong result. Boundary: the
      measurement science is DP-03 and DP-07; this is the work.

    competencyAreas:

      - id: EC-05-A01
        title: Pressure Gauge and Indicator Calibration
        status: draft
        summary: >-
          Analogue and digital pressure instruments, calibrated with
          attention to head, media and the hysteresis a single-direction
          sweep never shows.
        elements:
          - { id: EC-05-001, title: "Receiving inspection and functional check of a pressure gauge", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-05-002, title: "Calibration configuration and stabilisation for a pressure gauge", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-05-003, title: "Selecting the standards and fixturing for a pressure gauge calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-05-004, title: "Indication error in increasing and decreasing pressure", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-05-005, title: "Hysteresis and its reporting", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-006, title: "Repeatability and zero return", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-05-007, title: "Head correction for the height difference between reference and device", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-008, title: "Gauge, absolute and differential reference distinguished", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-05-009, title: "Media compatibility and cross-contamination avoidance", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-05-010, title: "Torque, orientation and mounting effects", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-05-011, title: "Temperature effect on a pressure instrument", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-012, title: "Overpressure history and its consequences", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-05-013, title: "Adjustment of a pressure gauge, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-05-014, title: "Uncertainty budget for a pressure gauge calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-05-015, title: "Conformity statement for a pressure gauge against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-05-A02
        title: Deadweight Tester and Pressure Balance Calibration
        status: draft
        summary: >-
          The pressure standard itself, whose effective area, mass set
