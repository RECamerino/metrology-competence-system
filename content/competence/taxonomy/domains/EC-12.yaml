          - { id: EC-12-002, title: "Calibration configuration and stabilisation for a patient monitor", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-12-003, title: "Selecting the standards and fixturing for a patient monitor calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-12-004, title: "ECG amplitude, rate and waveform verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-005, title: "Non-invasive blood pressure accuracy and cuff behaviour", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-006, title: "Invasive pressure channel accuracy and zeroing", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-007, title: "Pulse oximetry saturation and perfusion verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-008, title: "Respiration rate and apnoea detection verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-009, title: "Temperature channel accuracy", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-12-010, title: "Alarm limit, priority and audibility verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-011, title: "Patient simulator traceability and its own calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-12-012, title: "Adjustment of a patient monitor, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
