        # The summary said "insufflators, surgical lights, pumps and tables"
        # until 2026-08-17 — four types where the area holds seven, and one of
        # the four (pumps) has no element here at all: infusion pumps are
        # EC-12-A02. The area outgrew its own description during the generated
