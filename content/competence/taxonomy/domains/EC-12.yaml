      # Added 2026-08-17. Device-side electrical safety testing appeared in this
      # pack exactly once — EC-12-036, bolted to the electrosurgery area — while
      # eight other equipment classes had none and no cross-class element
      # existed. A candidate holding every other element in EC-12 was attested
      # to verify a ventilator, a dialyser and an infusion pump and held no
      # attested competence in the test that decides whether any of them may be
      # reconnected to a patient. In hospital practice it is the most frequently
      # performed procedure in the pack.
      #
      # Boundary, stated because two neighbours are close. EC-01 has an
      # Electrical Safety and Hipot Tester Calibration area: that is calibrating
      # the ANALYSER, one rung up the traceability chain. This area is
      # performing the test on the device in front of you. DP-17-051 carries the
      # same subject as foundational KNOWLEDGE at L3 — explanation, not
      # performance — and cannot bear a performance attestation.
      #
      # EC-12-036 stays. Its subject is RF leakage and patient isolation of an
      # electrosurgical unit, which is a genuinely different measurement from
      # mains-frequency leakage under a general safety standard. The titles are
      # close enough that the distinction needs to be written down, which is
      # what this note is for.
      #
      # This area does not carry the full six-element spine. Receiving
      # inspection, standards and fixturing, uncertainty and conformity all
      # apply and are present. "Adjustment, and what it does to as-found data"
      # is deliberately absent: a device under electrical safety test is not
      # adjusted, it passes or it is withdrawn, so an adjustment element here
      # would assert a competence that does not exist.
      - id: EC-12-A10
        title: Electrical Safety Testing and Device Release
        status: draft
        summary: >-
          Performing an electrical safety test on a medical device and
          deciding what its result means. Protective earth continuity,
          the three leakage currents and the applied-part discrimination
          that sets their limits, in normal and single-fault condition.
          Boundary: calibrating the safety analyser is EC-01; this is
          using one on a device. The competence this area exists for is
          the release decision, not the reading.
        elements:
          - { id: EC-12-123, title: "Device classification: Class I, Class II and internally powered", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: EC-12-124, title: "Applied part types B, BF and CF, and what each changes about the limits", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: EC-12-125, title: "Protective earth continuity and resistance measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-126, title: "Earth leakage current in normal and single-fault condition", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-127, title: "Enclosure leakage current and its measurement configuration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-128, title: "Patient leakage current measured by applied-part type", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-129, title: "Patient auxiliary current between applied-part connections", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-130, title: "Mains voltage on the applied part, and when that test applies", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-131, title: "Insulation resistance and dielectric strength on a medical device", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-132, title: "Receiving inspection and functional check before a safety test", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-12-133, title: "Selecting the analyser, leads and fixturing for the device under test", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-134, title: "Selecting the limit set: standard edition, device class and applied-part type", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-12-135, title: "Uncertainty of a leakage current measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-136, title: "Conformity statement for an electrical safety test against its limit set", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-12-137, title: "Electrical safety after repair, and how it differs from periodic testing", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-12-138, title: "Interpreting a failed safety test and the device-release decision", kind: judgment, levelCeiling: 5, status: draft }

      # Added 2026-08-17. Neonatal thermal equipment was absent from the WHOLE
      # corpus, not only from this pack: `infant`, `neonat`, `radiant warmer`
      # and `phototherapy` each returned zero hits across all 64 domain files.
      # A technician assessed complete against EC-12 had no attested competence
      # on the equipment serving the most vulnerable patients in the building,
      # and there was no element anywhere to attest it against — so the gap
      # could not even be recorded as a gap.
      #
      # Two disproof attempts, both recorded because the next reviewer will make
      # them too. `incubator` hits EC-09-058, which is a LABORATORY incubator in
      # the chemical pack — different standard, no patient in it. EC-12-117
      # (warming device temperature) sits in the theatre area, which its own
      # summary scopes to insufflators, lights, pumps and tables — a patient
      # warmer, not neonatal thermal equipment.
      #
      # SPLIT INTO TWO AREAS DELIBERATELY, and this is the judgement call worth
      # arguing about. One "neonatal equipment" area would have spanned a
      # thermal measurand and an optical one, so its generic spine elements
      # would have asked a candidate to demonstrate standard selection across a
      # thermometer AND a spectroradiometer — which is exactly the defect the
      # EC-12 review files against EC-12-A09, and creating a second instance of
      # it while that finding is open would be indefensible. Rule 14's test is
      # that an area whose parameters could be swapped for another type's has
      # been written wrong; hood oxygen and spectral irradiance cannot be
      # swapped, so they are two areas.
