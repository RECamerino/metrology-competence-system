# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-12
    title: Medical and Biomedical Equipment Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating and performance-verifying medical devices, where the
      measurand is a patient parameter, the analyser simulates a
      physiology, and the acceptance criteria come from a clinical
      standard rather than a manufacturer's specification. Boundary: the
      measurement science is DP-17.

    competencyAreas:

      - id: EC-12-A01
        title: Patient Monitor and Vital Signs Equipment Verification
        status: draft
        summary: >-
          Multi-parameter monitors verified against simulators, where
          each parameter has its own standard and its own failure mode.
        elements:
          - { id: EC-12-001, title: "Receiving inspection and functional check of a patient monitor", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-12-002, title: "Calibration configuration and stabilisation for a patient monitor", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-12-003, title: "Selecting the standards and fixturing for a patient monitor calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-12-004, title: "ECG amplitude, rate and waveform verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-005, title: "Non-invasive blood pressure accuracy and cuff behaviour", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-006, title: "Invasive pressure channel accuracy and zeroing", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-007, title: "Pulse oximetry saturation and perfusion verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-008, title: "Respiration rate and apnoea detection verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-009, title: "Temperature channel accuracy", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-12-010, title: "Alarm limit, priority and audibility verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-011, title: "Patient simulator traceability and its own calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-12-012, title: "Adjustment of a patient monitor, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-12-013, title: "Uncertainty budget for a patient monitor calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-12-014, title: "Conformity statement for a patient monitor against its specification", kind: judgment, levelCeiling: 4, status: draft }

