# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-03
    title: Dimensional and Geometric Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the instruments and artefacts of dimensional
      measurement, from a workshop caliper to a coordinate measuring
      machine. The domain where temperature, contact force and operator
      technique are part of the reading, and where an artefact is as often
      the thing being calibrated as the thing calibrating.

    competencyAreas:

      - id: EC-03-A01
        title: Caliper and Height Gauge Calibration
        status: draft
        summary: >-
          The instrument most people in a plant actually touch, and the
          one whose calibration is most often reduced to a single length
          check it does not deserve.
        elements:
          - { id: EC-03-001, title: "Receiving inspection and functional check of a caliper", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-002, title: "Calibration configuration and stabilisation for a caliper", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-003, title: "Selecting the standards and fixturing for a caliper calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-03-004, title: "Indication error across the measuring range", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-005, title: "External jaw parallelism and flatness", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-006, title: "Internal jaw and step measurement error", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-007, title: "Depth rod indication and squareness", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-008, title: "Repeatability and measuring force effects", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-009, title: "Zero setting, backlash and slide condition", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-010, title: "Digital resolution, drift and battery-low behaviour", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-011, title: "Height gauge indication error and column squareness", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-03-012, title: "Scriber and probe offset in a height gauge", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-03-013, title: "Adjustment of a caliper, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-03-014, title: "Uncertainty budget for a caliper calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-03-015, title: "Conformity statement for a caliper against its specification", kind: judgment, levelCeiling: 4, status: draft }

