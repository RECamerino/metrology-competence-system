          - { id: CM-10-050, title: "ISO/IEC 17020 inspection and ISO/IEC 17065 product certification", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-10-051, title: "ISO 15189 for medical laboratories", kind: knowledge, levelCeiling: 3, status: draft }
