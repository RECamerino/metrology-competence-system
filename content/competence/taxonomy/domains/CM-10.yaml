      - id: CM-10-A05
        title: Accreditation in Practice
        status: draft
        elements:
          - { id: CM-10-038, title: "What accreditation is and what it is not", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-10-039, title: "Scope of accreditation: construction and meaning", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-10-040, title: "Flexible scope and its obligations", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-10-041, title: "The accreditation lifecycle: application to surveillance to renewal", kind: knowledge, levelCeiling: 3, status: draft }
