          - { id: DP-01-087, title: "Freeform and sculptured surface measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-088, title: "Bearing, roundness and cylindricity measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-089, title: "Roundness instrument principles and spindle error separation", kind: skill, levelCeiling: 5, status: draft }
