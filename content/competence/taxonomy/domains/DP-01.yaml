schemaVersion: 1
domains:
  - id: DP-01
    title: Dimensional and Geometric Metrology
    kind: discipline
    status: draft
    summary: >-
      Length, form, orientation, location and surface texture. The largest
      discipline pack, reflecting both its breadth and the fact that geometric
      specification (ASME Y14.5 and ISO GPS) is a language in its own right that
      takes years to read fluently. Note the ASME and ISO treatments diverge in
      ways that cause real inspection disputes; elements must name those
      divergences rather than pick a side.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-01-A09
        title: Foundational Knowledge — Length, Form and Reading a Drawing
        status: draft
        summary: >-
          What a person needs before dimensional work makes sense: the
          quantities and units, how a drawing states what must be
          measured, and the handling and temperature discipline that
          decides whether a reading means anything.
        elements:
          - { id: DP-01-095, title: "Length, angle and their SI units in workshop use", kind: knowledge, levelCeiling: 2, status: draft }
          - { id: DP-01-096, title: "Reading a dimension and its tolerance from a drawing", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-01-097, title: "Tolerance, limits and fits", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-098, title: "Datums and what they mean on a drawing", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-099, title: "Common GD&T symbols and what each controls", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-100, title: "Nominal, actual and deviation distinguished", kind: knowledge, levelCeiling: 2, status: draft }
          - { id: DP-01-101, title: "Resolution, accuracy and repeatability of a measuring instrument", kind: knowledge, levelCeiling: 2, status: draft }
          - { id: DP-01-102, title: "Choosing an instrument appropriate to the tolerance", kind: judgment, levelCeiling: 3, status: draft }
          - { id: DP-01-103, title: "Thermal expansion and the 20 °C reference temperature", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-104, title: "Soak time and handling heat from the operator", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-01-105, title: "Measuring force and how it deforms the part", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-106, title: "Cleanliness, burrs and surface condition before measurement", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-01-107, title: "Wringing, contact and seating a part against a datum", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-01-108, title: "Parallax and reading a scale correctly", kind: skill, levelCeiling: 2, status: draft }
          - { id: DP-01-109, title: "Abbe error in a hand instrument", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-110, title: "Repeating a measurement and what the spread tells you", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-01-111, title: "Recording a dimensional result with units and decimal places", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-01-112, title: "Care, storage and protection of measuring equipment", kind: skill, levelCeiling: 2, status: draft }
          - { id: DP-01-113, title: "When to stop and refer a measurement upward", kind: judgment, levelCeiling: 3, status: draft }

      - id: DP-01-A01
        title: Length Standards and Realisation
        status: draft
        elements:
          - { id: DP-01-001, title: "Definition and practical realisation of the metre", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-01-002, title: "Iodine-stabilised lasers and recommended radiations", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-003, title: "Gauge blocks: construction, grades and wringing", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-004, title: "Interferometric calibration of gauge blocks", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-01-005, title: "Mechanical comparison of gauge blocks", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-006, title: "Length bars, step gauges and long-length artefacts", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-007, title: "Line scales and graduated standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-008, title: "Ball and sphere artefacts", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-009, title: "Ring and plug gauges", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-010, title: "Thermal expansion correction and the 20 degree reference", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-011, title: "Refractive index of air and the Edlen equation", kind: skill, levelCeiling: 5, status: draft }
          # Added 2026-08-16. Every other DP pack carries a per-technique budget
          # element at ceiling 5 — DP-02-016, DP-03-011, DP-05-026 and seventeen
          # more — and DP-01 had none. Its only uncertainty element was
          # DP-01-057, which is task-specific uncertainty for coordinate
          # measurement and does not cover length calibration. The gap was
          # concealed by CM-03-078, a dimensional budget element sitting on the
          # concept axis; deprecating that one exposed it.
          - { id: DP-01-114, title: "Uncertainty budget for dimensional calibration", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-01-A02
        title: Hand Tools and Shop-Floor Instruments
        status: draft
        elements:
          - { id: DP-01-012, title: "Micrometers: principle, error sources and calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-013, title: "Vernier and digital calipers", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-014, title: "Dial and digital indicators", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-015, title: "Height gauges and surface plates", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-016, title: "Bore gauges and internal measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-017, title: "Depth gauges and step measurement", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-01-018, title: "Squares, straightedges and angle plates", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-019, title: "Measuring force, feel and operator-dependent error", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-01-020, title: "Abbe error and cosine error", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-01-021, title: "Elastic deformation and contact effects in measurement", kind: knowledge, levelCeiling: 4, status: draft }

      - id: DP-01-A03
        title: Angle and Alignment
        status: draft
        elements:
          - { id: DP-01-022, title: "Angle units, standards and the closure principle", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-023, title: "Angle gauge blocks and polygons", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-024, title: "Autocollimators", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-025, title: "Sine bars and sine plates", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-026, title: "Levels, clinometers and inclination measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-027, title: "Rotary tables and indexing devices", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-028, title: "Straightness, flatness and squareness measurement", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-01-029, title: "Machine tool alignment and geometric testing", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-090, title: "Error separation: measuring an instrument and an artefact simultaneously", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-01-091, title: "Reversal methods", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-01-092, title: "Multi-position and multi-probe separation techniques", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-01-093, title: "Straightness and flatness measurement by error separation", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-01-094, title: "Volumetric error mapping and compensation of machine geometry", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-01-A04
        title: Geometric Specification and Tolerancing
        status: draft
        summary: >-
          GD&T as a specification language. Figure-dependent material: figures
          from ASME Y14.5 and ISO GPS may not be reproduced under any tier, so
          elements must describe callouts in original prose and cite the figure.
        elements:
          - { id: DP-01-030, title: "Purpose of geometric tolerancing and its advantage over coordinate tolerancing", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-01-031, title: "Feature of size, feature and derived elements", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-032, title: "Datums, datum features and datum reference frames", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-01-033, title: "Datum precedence and constraint of degrees of freedom", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-01-034, title: "Form tolerances: flatness, straightness, circularity, cylindricity", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-035, title: "Orientation tolerances: parallelism, perpendicularity, angularity", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-036, title: "Location tolerances: position, concentricity, symmetry", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-037, title: "Profile tolerances of a line and of a surface", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-038, title: "Runout and total runout", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-039, title: "Material condition modifiers and bonus tolerance", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-040, title: "Composite and multiple single-segment position tolerances", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-041, title: "Envelope principle, independency and Rule 1", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-042, title: "Maximum and least material boundaries and virtual condition", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-043, title: "Tolerance stack-up analysis", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-044, title: "Statistical tolerancing", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-045, title: "Divergences between ASME Y14.5 and ISO GPS treatment", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-01-046, title: "Reading a drawing and inferring the designer's functional intent", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-01-047, title: "Specifying a tolerance that can actually be verified", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-01-048, title: "Model-based definition and annotated 3D models", kind: knowledge, levelCeiling: 4, status: draft }

      - id: DP-01-A05
        title: Coordinate Measuring Systems
        status: draft
        elements:
          - { id: DP-01-049, title: "CMM architectures and their error characteristics", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-050, title: "Probing systems: touch trigger, scanning and analogue", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-051, title: "Probe qualification and stylus effects", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-052, title: "Part alignment and datum establishment on a CMM", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-053, title: "Sampling strategy and point density", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-01-054, title: "Fitting algorithms and the substitute geometry problem", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-01-055, title: "Evaluating GD&T callouts from measured points", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-056, title: "CMM performance verification and acceptance testing", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-057, title: "Task-specific measurement uncertainty for coordinate measurement", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-01-058, title: "Thermal effects and environmental compensation on CMMs", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-059, title: "Articulated arms and portable coordinate systems", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-060, title: "Laser trackers and large-volume metrology", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-061, title: "Photogrammetry and structured light systems", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-062, title: "Computed tomography for dimensional measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-063, title: "Comparing results between different measurement systems", kind: judgment, levelCeiling: 4, status: draft }

      - id: DP-01-A06
        title: Optical and Non-Contact Dimensional Measurement
        status: draft
        elements:
          - { id: DP-01-064, title: "Optical comparators and profile projection", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-01-065, title: "Measuring microscopes and vision systems", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-066, title: "Edge detection, illumination and apparent size", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-067, title: "Laser scanning and triangulation sensors", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-068, title: "Confocal and focus-variation techniques", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-069, title: "Interferometric displacement measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-070, title: "Optical flats and flatness by interference", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-071, title: "Limitations of non-contact measurement on real surfaces", kind: judgment, levelCeiling: 5, status: draft }

      - id: DP-01-A07
        title: Surface Texture
        status: draft
        elements:
          - { id: DP-01-072, title: "Surface texture concepts: roughness, waviness, form", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-073, title: "Filtering, cut-off wavelength and its consequences", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-01-074, title: "Amplitude parameters and their interpretation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-075, title: "Spacing, hybrid and functional parameters", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-076, title: "Areal surface texture parameters", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-077, title: "Stylus instruments: principle, calibration and stylus effects", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-078, title: "Optical surface texture instruments", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-079, title: "Surface texture specification on drawings", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-080, title: "Relating surface texture to function", kind: judgment, levelCeiling: 4, status: draft }

      - id: DP-01-A08
        title: Threads, Gears and Complex Geometry
        status: draft
        elements:
          - { id: DP-01-081, title: "Screw thread geometry and terminology", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-01-082, title: "Thread measurement by three-wire and other methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-01-083, title: "Thread gauging and functional acceptance", kind: skill, levelCeiling: 4, status: draft }
