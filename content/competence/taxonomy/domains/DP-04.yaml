schemaVersion: 1
domains:
  - id: DP-04
    title: Vibration, Shock and Acoustics
    kind: discipline
    status: draft
    summary: >-
      Dynamic mechanical quantities and airborne sound. Grouped because both
      are fundamentally about time-varying signals, share transducer physics,
      and demand competence in the frequency domain that static-measurement
      training does not provide.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-04-A06
        title: Foundational Knowledge — Vibration, Sound and the Decibel
        status: draft
        summary: >-
          The quantities of dynamic measurement, where the same motion
          has three descriptions and almost everything is reported on a
          logarithmic scale.
        elements:
          - { id: DP-04-049, title: "Frequency, period and amplitude", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-050, title: "Acceleration, velocity and displacement as descriptions of one motion", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-051, title: "The decibel: a ratio, not a unit", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-052, title: "Sound pressure, sound pressure level and the reference value", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-053, title: "A, C and Z frequency weighting and why they exist", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-054, title: "Peak, RMS and average of a dynamic signal", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-055, title: "Resonance and why a structure amplifies at one frequency", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-056, title: "Mounting a transducer, and how mounting changes what it reads", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-04-057, title: "Cable routing, triboelectric noise and connector care", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-04-058, title: "Background noise and its effect on a measurement", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-04-059, title: "Field calibration check before and after a measurement", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-04-060, title: "Hearing protection and exposure limits", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-061, title: "Recording a vibration or acoustic result with its conditions", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-04-A01
        title: Dynamic Measurement Foundations
        status: draft
        elements:
          - { id: DP-04-001, title: "Time domain and frequency domain representations", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-04-002, title: "Fourier analysis and the discrete Fourier transform", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-003, title: "Windowing, leakage and resolution", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-04-004, title: "Sampling, aliasing and anti-alias filtering", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-04-005, title: "Amplitude conventions: peak, RMS, peak-to-peak", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-04-006, title: "Frequency response functions and coherence", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-04-007, title: "Phase measurement and its pitfalls", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-04-008, title: "Random, periodic and transient signal characterisation", kind: knowledge, levelCeiling: 4, status: draft }

      - id: DP-04-A02
        title: Vibration Measurement and Calibration
        status: draft
        elements:
          - { id: DP-04-009, title: "Acceleration, velocity and displacement relationships", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-04-010, title: "Accelerometer types and their characteristics", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-011, title: "Mounting effects and mounted resonance", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-012, title: "Primary calibration by laser interferometry", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-04-013, title: "Comparison calibration against a reference accelerometer", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-014, title: "Vibration exciters and their characterisation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-015, title: "Transverse sensitivity and cross-axis response", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-016, title: "Charge amplifiers, signal conditioning and cable effects", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-017, title: "Low frequency and high frequency calibration challenges", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-018, title: "Uncertainty budget for accelerometer calibration", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-04-019, title: "Velocity transducers and laser vibrometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-020, title: "Proximity probes and shaft vibration measurement", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-04-A03
        title: Shock and Transient Measurement
        status: draft
        elements:
          - { id: DP-04-021, title: "Shock pulse characterisation and shock response spectrum", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-04-022, title: "Shock calibration methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-023, title: "High-g and pyroshock measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-024, title: "Zero shift and transducer damage in shock events", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-025, title: "Drop testing and impact measurement", kind: skill, levelCeiling: 4, status: draft }

