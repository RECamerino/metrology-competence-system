          - { id: DP-04-027, title: "Fault signatures: imbalance, misalignment, looseness", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-04-028, title: "Bearing and gear fault detection", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-029, title: "Envelope analysis and demodulation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-030, title: "Order tracking and variable speed machinery", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-031, title: "Balancing: field and workshop", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-032, title: "Modal testing and structural dynamics", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-04-033, title: "Human vibration exposure measurement", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-04-A05
        title: Acoustics and Sound Measurement
        status: draft
        elements:
          - { id: DP-04-034, title: "Sound pressure, sound power and sound intensity distinguished", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-04-035, title: "Decibel scales and reference quantities in acoustics", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-04-036, title: "Frequency weighting and time weighting", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-04-037, title: "Octave and fractional octave band analysis", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-038, title: "Microphone types and their characteristics", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-039, title: "Reciprocity calibration of microphones", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-04-040, title: "Comparison calibration and acoustic calibrators", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-041, title: "Free-field, pressure-field and diffuse-field responses", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-04-042, title: "Sound level meter verification and periodic testing", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-043, title: "Anechoic and reverberation chambers", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-044, title: "Environmental and occupational noise measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-045, title: "Sound power determination methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-046, title: "Audiometric equipment calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-047, title: "Ultrasound measurement and its applications", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-04-048, title: "Uncertainty evaluation in acoustic measurement", kind: skill, levelCeiling: 5, status: draft }
