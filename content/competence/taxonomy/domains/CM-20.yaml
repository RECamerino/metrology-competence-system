          - { id: CM-20-002, title: "Literature review and establishing the state of the art", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-20-003, title: "Formulating a tractable research question", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-20-004, title: "Feasibility assessment and early termination", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-20-005, title: "Distinguishing incremental improvement from a genuine advance", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-20-006, title: "Research roadmaps and long-horizon capability planning", kind: judgment, levelCeiling: 4, status: draft }

