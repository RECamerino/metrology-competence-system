schemaVersion: 1
domains:
  - id: CM-20
    title: Research, Development and Innovation in Metrology
    kind: core
    status: draft
    summary: >-
      Advancing measurement capability rather than applying it. The competence
      of NMI scientists and principal metrologists, and the route by which the
      field improves. Boundary: routine method development is CM-06; publication
      craft is CM-15-A06; the statistics of experimentation are CM-05-A06.

    competencyAreas:

