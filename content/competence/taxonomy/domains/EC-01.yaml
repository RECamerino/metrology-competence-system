          - { id: EC-01-004, title: "DC vertical gain accuracy across ranges", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-01-005, title: "DC offset and position accuracy", kind: skill, levelCeiling: 4, status: draft }
