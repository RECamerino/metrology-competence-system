# Equipment-calibration pack: electrical test and measurement instruments.
#
# WHY A THIRD AXIS EXISTS. The corpus had two, and both are organised by
# measurement science: CM by cross-cutting concept, DP by measured quantity.
# Neither is organised by the work. A technician's day is not "uncertainty,
# then traceability" — it is an oscilloscope, then a torque wrench, then an RF
# attenuator, and their competence is per equipment type.
#
# The proof was already in the corpus before this pack existed. DP-08-052 is
# titled "Oscilloscope DC and timebase calibration", truncated to the parts
# that fit a DC and low-frequency electrical domain: bandwidth belongs to
# DP-10, jitter and time-interval to DP-14. Calibrating a scope is ONE job, and
# a quantity-organised taxonomy could only describe a third of it. That is what
# a missing axis looks like from the inside.
#
# WHAT AN EC ELEMENT IS, AND IS NOT. It is the competence to calibrate a class
# of equipment: what the parameters are, how they are measured, what standard
# is required, and where the job goes wrong. It is NOT a restatement of CM-06,
# which owns calibration METHODOLOGY — procedure design, adjustment decisions,
# certificates, as-found and as-left. CM-06 says what as-found data is and why
# both are recorded; EC says what as-found data for an oscilloscope consists
# of. Neither substitutes for the other, and an EC element that could be
# written without naming the equipment belongs in CM-06 instead.
#
# The three roles the metrologist named all read this pack differently: the
# technician performs it, the engineer designs the method and the fixturing,
# and the metrologist has to understand it well enough to say whether the
# measurement was sound.

schemaVersion: 1
domains:
  - id: EC-01
    title: Electrical Test and Measurement Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the instruments that measure electrical quantities, organised
      by the instrument that arrives on the bench rather than by the quantity
      it measures. Oscilloscopes, multimeters, sources, generators and analysers
      each present a whole job: several parameters, several standards, and
      failure modes that belong to the instrument rather than to any one
      quantity. Boundary: the physics and the measurement science are DP-08,
      DP-09 and DP-14; calibration methodology is CM-06; this pack is the work.

    competencyAreas:

      # The worked equipment type. Built first because an oscilloscope spans
      # three quantity domains at once, which makes it the strongest test of
      # whether the equipment axis is real or whether these elements could
      # have lived in DP after all. They could not.
      #
      # Ceilings mostly 4: this is professional calibration technique, and the
      # non-routine case — a scope that meets bandwidth on one channel and not
      # the next — is exactly where proficiency shows. Two reach 5, where
      # high-bandwidth work genuinely supports career-long learning and a
      # defensible capstone.
