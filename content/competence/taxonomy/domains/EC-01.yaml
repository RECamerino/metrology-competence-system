          - { id: EC-01-008, title: "Bandwidth verification and the −3 dB point", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-01-009, title: "Rise time measurement, and its relationship to bandwidth", kind: knowledge, levelCeiling: 4, status: draft }
