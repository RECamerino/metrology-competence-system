schemaVersion: 1
domains:
  - id: DP-02
    title: Mass, Force, Torque and Hardness
    kind: discipline
    status: draft
    summary: >-
      Mechanical quantities derived from or closely coupled to mass. Grouped
      because they share apparatus, share error mechanisms, and are usually
      staffed by the same people. Hardness is included here despite being an
      ordinal quantity defined by its own test method — a fact that makes it a
      valuable teaching case for CM-01-A03.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-02-A07
        title: Foundational Knowledge — Mass, Force and Turning Effect
        status: draft
        summary: >-
          The quantities of mechanical measurement and the handling that
          protects them: what mass and force actually are, why weight is
          not mass, and why a dropped weight is no longer a standard.
        elements:
          - { id: DP-02-065, title: "Mass and weight distinguished, and why it matters", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-02-066, title: "Force, its units, and newtons against kilogram-force", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-02-067, title: "Local gravity and why a weighing result depends on where you are", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-02-068, title: "Air buoyancy in ordinary weighing", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-02-069, title: "Torque as force times distance, and its units", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-02-070, title: "Hardness as a scale rather than a physical quantity", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-02-071, title: "Levelling, stability and installation of a balance", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-072, title: "Draught, vibration and thermal effects on a weighing", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-073, title: "Handling weights: gloves, tweezers and why skin matters", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-074, title: "Storage, contamination and the value of a mass standard", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-075, title: "Loading a force or torque instrument in its intended direction", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-076, title: "Hysteresis and why an increasing reading differs from a decreasing one", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-02-077, title: "Reading a balance display: resolution against capability", kind: knowledge, levelCeiling: 2, status: draft }
          - { id: DP-02-078, title: "Tare, zero and what each does to a result", kind: skill, levelCeiling: 2, status: draft }
          - { id: DP-02-079, title: "Safe handling of heavy standards and lifting equipment", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-080, title: "Recording a mass or force result with its conditions", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-02-A01
        title: Mass Standards and Realisation
        status: draft
        elements:
          - { id: DP-02-001, title: "Definition of the kilogram from the Planck constant", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-02-002, title: "Kibble balance realisation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-003, title: "X-ray crystal density realisation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-004, title: "Dissemination of the kilogram after the redefinition", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-005, title: "Mass standards: classes, materials and construction", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-006, title: "Weight class specifications and their selection", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-007, title: "Surface effects, adsorption and mass stability", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-02-008, title: "Cleaning, handling and storage of mass standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-009, title: "Mass, weight and conventional mass distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-02-010, title: "Air buoyancy correction and air density determination", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-02-A02
        title: Mass Comparison and Balances
        status: draft
        elements:
          - { id: DP-02-011, title: "Balance principles: electromagnetic force compensation and others", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-012, title: "Mass comparators and their characterisation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-013, title: "Weighing designs and subdivision schemes", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-02-014, title: "Substitution weighing and Borda method", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-015, title: "Least squares analysis of a weighing design", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-016, title: "Uncertainty budget for mass calibration", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-02-017, title: "Environmental effects: convection, draughts, magnetism, static", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-018, title: "Magnetic susceptibility of weights and its testing", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-019, title: "Non-automatic weighing instruments and their verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-020, title: "Eccentricity, repeatability and linearity testing of balances", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-021, title: "Automatic weighing and dynamic weighing systems", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-022, title: "Large-capacity and industrial scale calibration", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-02-A03
        title: Force
        status: draft
        elements:
          - { id: DP-02-023, title: "Force realisation by deadweight machines", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-02-024, title: "Local gravity determination and its uncertainty", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-025, title: "Lever, hydraulic and build-up force machines", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-026, title: "Force transducers: strain gauge and other principles", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-027, title: "Force transducer calibration and classification", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-028, title: "Creep, hysteresis and rotational effects in force measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-029, title: "Loading conditions, adapters and parasitic components", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-030, title: "Materials testing machine verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-031, title: "Dynamic and impact force measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-032, title: "Uncertainty budget for force calibration", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-02-A04
        title: Torque
        status: draft
        elements:
          - { id: DP-02-033, title: "Torque realisation by lever and mass", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-034, title: "Reference torque transducers", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-035, title: "Torque calibration machines and their verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-036, title: "Torque wrench and torque tool calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-037, title: "Static and dynamic torque distinguished", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-038, title: "Torque-tension relationships and joint behaviour", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-039, title: "Mounting, alignment and parasitic loads in torque measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-040, title: "Uncertainty budget for torque calibration", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-02-A05
        title: Hardness
        status: draft
        summary: >-
          A method-defined, ordinal quantity. Understanding why hardness is not
          a physical property in the ordinary sense is more important than
          memorising the scales.
        elements:
          - { id: DP-02-041, title: "Hardness as a method-defined ordinal quantity", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-02-042, title: "Rockwell scales and test principles", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-043, title: "Brinell test and indentation measurement", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-044, title: "Vickers and Knoop microhardness", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-02-045, title: "Shore, Leeb and portable hardness methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-046, title: "Direct and indirect verification of hardness machines", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-047, title: "Hardness reference blocks and their traceability", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-048, title: "Indenter geometry, condition and its effect on results", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-049, title: "Surface preparation and specimen effects", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-050, title: "Hardness scale conversion and why it is unreliable", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-02-051, title: "Uncertainty evaluation for hardness measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-052, title: "Instrumented indentation testing", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-02-A06
        title: Gravity and Gravimetry
        status: draft
        summary: >-
          Measurement of gravitational acceleration as a discipline in its own
          right, not merely as a correction term. Local g enters force
          realisation, pressure realisation and mass comparison, and a
          metrologist who treats it as a looked-up constant has an
          unacknowledged uncertainty contribution. Included here because
          gravimetry shares apparatus and traceability routes with mass and
          force; it is a candidate for its own discipline pack if it grows.
        elements:
          - { id: DP-02-053, title: "Gravitational acceleration as a measurand", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-02-054, title: "Absolute gravimeters and free-fall methods", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-02-055, title: "Atom interferometric gravimetry", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-02-056, title: "Relative gravimeters and their drift behaviour", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-057, title: "Gravity gradients and vertical transfer to the measurement height", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-02-058, title: "Earth tide, ocean loading and atmospheric corrections", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-02-059, title: "Polar motion and length-of-day corrections", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-060, title: "Gravity reference networks and international comparisons", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-02-061, title: "Obtaining a defensible local g value for a laboratory", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-02-062, title: "Consequences of an inadequate g value in force and pressure work", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-02-063, title: "Uncertainty evaluation in gravimetry", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-02-064, title: "Site stability, microseismic noise and gravimeter environments", kind: skill, levelCeiling: 4, status: draft }
