schemaVersion: 1
domains:
  - id: CM-02
    title: Terminology and the International System of Units
    kind: core
    status: draft
    summary: >-
      The controlled vocabulary of metrology (VIM3) and the SI itself. This
      domain is where precision of language is the competence. Where VIM3 and
      everyday laboratory usage diverge, elements must say so explicitly —
      that divergence causes real disputes on certificates and in audits.

    competencyAreas:

      - id: CM-02-A01
        title: VIM Concepts and Terminological Discipline
        status: draft
        summary: >-
          Using the controlled vocabulary correctly, and recognizing when a
          colleague, a supplier, or a standard is not.
        elements:
          - { id: CM-02-001, title: "Purpose and structure of the VIM", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-002, title: "Concept systems and why definitions are ordered as they are", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-003, title: "Core VIM terms for quantities and units", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-004, title: "Core VIM terms for measurement and its results", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-005, title: "Core VIM terms for measuring instruments and their properties", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-006, title: "Core VIM terms for measurement standards and traceability", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-007, title: "Terms commonly misused in laboratory practice", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-02-008, title: "Deprecated terminology still found in circulation", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-009, title: "Reconciling VIM3 with sector-specific vocabularies", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-02-010, title: "Translation and terminology across languages and jurisdictions", kind: knowledge, levelCeiling: 3, status: draft }

      - id: CM-02-A02
        title: Structure of the SI
        status: draft
        summary: The system itself — how it is constructed and why.
        elements:
          - { id: CM-02-011, title: "Base quantities and base units", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-012, title: "Derived quantities and coherent derived units", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-013, title: "Coherence and why it matters computationally", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-02-014, title: "SI prefixes and their correct application", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-015, title: "Units outside the SI accepted for use with it", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-016, title: "Special names and units with the same dimension", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-017, title: "The mole and quantities of amount of substance", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-018, title: "Photometric units and the human observer in the SI", kind: knowledge, levelCeiling: 3, status: draft }

      - id: CM-02-A03
        title: The 2019 Redefinition and the Defining Constants
        status: draft
        summary: >-
          The single largest change to the SI in a century, and its practical
          consequences — most of which are smaller than commonly assumed, but
          not zero.
        elements:
          - { id: CM-02-019, title: "The seven defining constants", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-020, title: "Why the kilogram artefact was abandoned", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-021, title: "Realization of the kilogram: Kibble balance and X-ray crystal density", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-02-022, title: "Realization of the ampere from the elementary charge", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-02-023, title: "Realization of the kelvin from the Boltzmann constant", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-02-024, title: "Mise en pratique documents and their status", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-025, title: "Practical consequences of the redefinition for working laboratories", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-02-026, title: "Continuity of dissemination across the redefinition", kind: knowledge, levelCeiling: 3, status: draft }

      - id: CM-02-A04
        title: Expression, Style and Notation
        status: draft
        summary: >-
          The rules that make a certificate defensible and machine-readable.
          Low glamour, high audit-finding frequency.
        elements:
          - { id: CM-02-027, title: "Writing unit symbols and names correctly", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-02-028, title: "Number formatting, decimal markers and digit grouping", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-02-029, title: "Significant figures and rounding conventions", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-02-030, title: "Expressing quantity values with uncertainty", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-02-031, title: "Quantity symbols, subscripts and typographic conventions", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-032, title: "Expressing ratios, percentages and parts-per notations", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-02-033, title: "Logarithmic quantities: decibel, neper and reference levels", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-034, title: "Common style errors found on calibration certificates", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-02-A05
        title: Dimensional Analysis and Unit Conversion
        status: draft
        summary: Practical arithmetic with units, and where it goes wrong.
        elements:
          - { id: CM-02-035, title: "Dimensional analysis as a verification technique", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-02-036, title: "Unit conversion and exact versus approximate conversion factors", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-02-037, title: "Uncertainty propagation through unit conversion", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-02-038, title: "Temperature scales and the difference between interval and point conversion", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-02-039, title: "Gauge, absolute and differential quantities", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-02-040, title: "Conversion errors that have caused documented failures", kind: knowledge, levelCeiling: 3, status: draft }

      - id: CM-02-A06
        title: Legacy, Customary and Sector Unit Systems
        status: draft
        summary: >-
          What practitioners actually encounter. Boundary: legal enforcement of
          units belongs to CM-19.
        elements:
          - { id: CM-02-041, title: "US customary and imperial systems", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-042, title: "CGS systems and where they persist", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-043, title: "Sector-specific units in pressure, vacuum and flow", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-044, title: "Sector-specific units in radiation and dosimetry", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-045, title: "Units in clinical and laboratory medicine", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-02-046, title: "Managing mixed-unit environments without error", kind: judgment, levelCeiling: 3, status: draft }
