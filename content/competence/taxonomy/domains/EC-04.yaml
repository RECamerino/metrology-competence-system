          - { id: EC-04-005, title: "Eccentricity and off-centre loading error", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-006, title: "Linearity and departure across the weighing range", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-007, title: "Indication error at nominal test points", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-008, title: "Air buoyancy correction and its necessity", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-009, title: "Minimum weight determination for a process", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-04-010, title: "Warm-up, levelling and installation effects", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-011, title: "Internal adjustment weight verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-012, title: "High-capacity and platform scale calibration in situ", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-013, title: "Adjustment of a balance, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-04-014, title: "Uncertainty budget for a balance calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-015, title: "Conformity statement for a balance against its specification", kind: judgment, levelCeiling: 4, status: draft }

