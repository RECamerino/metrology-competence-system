# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-04
    title: Mass, Force, Torque and Hardness Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the instruments of mechanical quantity measurement,
      where the standard is frequently an artefact rather than an
      instrument, and where buoyancy, alignment and loading history change
      the result. Boundary: the measurement science is DP-02; this is the
      work on the bench and in the field.

    competencyAreas:

      - id: EC-04-A01
        title: Balance and Weighing Instrument Calibration
        status: draft
        summary: >-
          Repeatability, eccentricity and linearity rather than a single
          indication, which is what separates a calibration from a
          check.
        elements:
          - { id: EC-04-001, title: "Receiving inspection and functional check of a balance", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-002, title: "Calibration configuration and stabilisation for a balance", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-003, title: "Selecting the standards and fixturing for a balance calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-04-004, title: "Repeatability at the test loads", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-005, title: "Eccentricity and off-centre loading error", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-006, title: "Linearity and departure across the weighing range", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-007, title: "Indication error at nominal test points", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-008, title: "Air buoyancy correction and its necessity", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-009, title: "Minimum weight determination for a process", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-04-010, title: "Warm-up, levelling and installation effects", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-04-011, title: "Internal adjustment weight verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-012, title: "High-capacity and platform scale calibration in situ", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-013, title: "Adjustment of a balance, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-04-014, title: "Uncertainty budget for a balance calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-04-015, title: "Conformity statement for a balance against its specification", kind: judgment, levelCeiling: 4, status: draft }

