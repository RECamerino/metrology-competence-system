          - { id: EC-02-033, title: "Calibration configuration and stabilisation for an RF signal generator", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-034, title: "Selecting the standards and fixturing for an RF signal generator calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-035, title: "Output level accuracy against frequency", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-036, title: "Level flatness and range-switching discontinuities", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-037, title: "Frequency accuracy and reference traceability", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-038, title: "Harmonic and spurious output verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-039, title: "Phase noise verification", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-02-040, title: "Amplitude, frequency and phase modulation accuracy", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-041, title: "Pulse modulation on-off ratio and timing", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-042, title: "Output VSWR and reverse power protection", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-043, title: "Adjustment of an RF signal generator, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-044, title: "Uncertainty budget for an RF signal generator calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-045, title: "Conformity statement for an RF signal generator against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-02-A04
        title: Spectrum and Signal Analyser Calibration
        status: draft
        summary: >-
          Amplitude and frequency across a wide dynamic range, plus the
          resolution-bandwidth and detector behaviour that make two
          analysers disagree on the same signal.
        elements:
          - { id: EC-02-046, title: "Receiving inspection and functional check of a spectrum analyser", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-047, title: "Calibration configuration and stabilisation for a spectrum analyser", kind: skill, levelCeiling: 3, status: draft }
