          - { id: EC-02-073, title: "Adjustment of a vector network analyser, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-074, title: "Uncertainty budget for a vector network analyser calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-075, title: "Conformity statement for a vector network analyser against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-02-A06
        title: Frequency Counter and Time Interval Instrument Calibration
        status: draft
        summary: >-
          Resolution far exceeding accuracy, which makes the reference
