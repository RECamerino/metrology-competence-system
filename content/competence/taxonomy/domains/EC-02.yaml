          - { id: EC-02-105, title: "LISN impedance and insertion loss verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-106, title: "EMI receiver amplitude accuracy and detector verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-107, title: "Receiver bandwidth and CISPR detector response", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-108, title: "ESD generator waveform and discharge verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-109, title: "Surge and EFT generator waveform verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-110, title: "Absorbing clamp and current probe calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-111, title: "Immunity field uniformity verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-112, title: "Adjustment of EMC test equipment, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-113, title: "Uncertainty budget for EMC test equipment calibration", kind: skill, levelCeiling: 4, status: draft }
