          - { id: EC-02-019, title: "Calibration configuration and stabilisation for an RF power meter and sensor", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-020, title: "Selecting the standards and fixturing for an RF power meter and sensor calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-021, title: "Calibration factor against frequency", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-022, title: "Effective efficiency determination", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-02-023, title: "Power linearity across the dynamic range", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-024, title: "Zero stability, drift and noise", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-025, title: "Sensor VSWR and its uncertainty contribution", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-026, title: "Reference oscillator output verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-027, title: "Peak and pulse power sensor verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-028, title: "Sensor damage thresholds and overload history", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: EC-02-029, title: "Adjustment of an RF power meter and sensor, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-030, title: "Uncertainty budget for an RF power meter and sensor calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-031, title: "Conformity statement for an RF power meter and sensor against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-02-A03
        title: Signal Generator Calibration
        status: draft
        summary: >-
          Level, frequency and spectral purity, where the specification
          a user relies on is usually harmonics and phase noise rather
          than amplitude.
        elements:
