          - { id: EC-02-078, title: "Selecting the standards and fixturing for a frequency counter calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-079, title: "Frequency accuracy against a reference standard", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-080, title: "Timebase ageing, drift and temperature stability", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-081, title: "Time interval measurement accuracy", kind: skill, levelCeiling: 4, status: draft }
