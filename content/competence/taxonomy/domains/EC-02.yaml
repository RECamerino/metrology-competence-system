          - { id: EC-02-050, title: "Display and scale fidelity across the dynamic range", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-051, title: "Frequency response flatness against frequency", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-052, title: "Resolution bandwidth accuracy and shape factor", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-053, title: "Reference level and input attenuator switching accuracy", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-054, title: "Displayed average noise level verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-055, title: "Third-order intercept and spurious response", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-056, title: "Frequency readout accuracy and span linearity", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-057, title: "Detector and averaging mode behaviour", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-02-058, title: "Adjustment of a spectrum analyser, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-059, title: "Uncertainty budget for a spectrum analyser calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-060, title: "Conformity statement for a spectrum analyser against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-02-A05
        title: Vector Network Analyser Calibration and Verification
        status: draft
        summary: >-
          Distinguishing the error-correction that precedes a
          measurement from the periodic calibration of the instrument
          itself, which are routinely confused.
        elements:
          - { id: EC-02-061, title: "Receiving inspection and functional check of a vector network analyser", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-062, title: "Calibration configuration and stabilisation for a vector network analyser", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-063, title: "Selecting the standards and fixturing for a vector network analyser calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-064, title: "SOLT error correction and its residual terms", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-065, title: "TRL and LRM correction and when each is required", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-02-066, title: "Calibration kit definitions and standard models", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-067, title: "Verification of a correction using a check standard", kind: skill, levelCeiling: 4, status: draft }
