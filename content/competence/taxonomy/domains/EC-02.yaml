          - { id: EC-02-087, title: "Uncertainty budget for a frequency counter calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-088, title: "Conformity statement for a frequency counter against its specification", kind: judgment, levelCeiling: 4, status: draft }

