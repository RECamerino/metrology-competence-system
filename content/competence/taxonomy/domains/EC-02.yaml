# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-02
    title: RF and Microwave Device Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the devices and instruments of RF and microwave
      measurement, from a passive attenuator to a vector network analyzer.
      The domain where connector care and mismatch contribute more
      uncertainty than the instrument, and where the device under test and
      the measuring system are frequently the same class of hardware.

    competencyAreas:

      - id: EC-02-A01
        title: RF Passive Device Calibration
        status: draft
        summary: >-
          Attenuators, terminations, adapters, couplers and power
          splitters: the devices that carry a calibration through an RF
          system, and the ones most often assumed rather than measured.
        elements:
          - { id: EC-02-001, title: "Receiving inspection and functional check of an RF passive device", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-002, title: "Calibration configuration and stabilization for an RF passive device", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-003, title: "Selecting the standards and fixturing for an RF passive device calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-004, title: "Attenuation accuracy against frequency", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-005, title: "Return loss and VSWR of a passive device", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-006, title: "Termination and load standard characterization", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-007, title: "Directional coupler coupling factor and directivity", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-008, title: "Power splitter and divider tracking and balance", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-009, title: "Adapter characterization and adapter removal", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-010, title: "Phase shift and electrical length of a passive device", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-011, title: "Power handling and its effect on measured attenuation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-02-012, title: "Connector gauging, care and repeatability", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-013, title: "Mismatch uncertainty in a passive device calibration", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-02-014, title: "Verification artefacts and check standards for RF passives", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-015, title: "Adjustment of an RF passive device, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-016, title: "Uncertainty budget for an RF passive device calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-017, title: "Conformity statement for an RF passive device against its specification", kind: judgment, levelCeiling: 4, status: draft }

