          - { id: EC-02-098, title: "Near-field and far-field boundary in a calibration setup", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-02-099, title: "Adjustment of an antenna or field probe, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-100, title: "Uncertainty budget for an antenna or field probe calibration", kind: skill, levelCeiling: 4, status: draft }
