          - { id: EC-02-090, title: "Calibration configuration and stabilisation for an antenna or field probe", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-02-091, title: "Selecting the standards and fixturing for an antenna or field probe calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-02-092, title: "Antenna factor determination against frequency", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-02-093, title: "Gain measurement by substitution and by three-antenna method", kind: skill, levelCeiling: 5, status: draft }
