          - { id: DP-09-008, title: "Frequency response and flatness of AC instruments", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-009, title: "AC current measurement and shunts", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-010, title: "Waveform distortion and non-sinusoidal measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-011, title: "Crest factor and instrument limitations", kind: knowledge, levelCeiling: 4, status: draft }
