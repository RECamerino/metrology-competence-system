          - { id: DP-09-034, title: "Power standards and sampling wattmeters", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-035, title: "Power measurement under distorted waveforms", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-036, title: "Energy meters and their calibration", kind: skill, levelCeiling: 4, status: draft }
