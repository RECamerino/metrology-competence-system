          - { id: DP-09-002, title: "Thermal converters and AC-DC transfer difference", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-09-003, title: "Multijunction thermal converters", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-004, title: "AC-DC transfer standards and their use", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-005, title: "Sampling and digital AC measurement", kind: skill, levelCeiling: 4, status: draft }
