          - { id: DP-09-029, title: "Oscilloscope AC and bandwidth calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-030, title: "Digitiser characterisation and effective bits", kind: skill, levelCeiling: 4, status: draft }
