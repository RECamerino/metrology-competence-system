schemaVersion: 1
domains:
  - id: CM-05
    title: Statistics and Data Analysis for Metrology
    kind: core
    status: draft
    summary: >-
      The statistical competence a metrologist actually needs, taught for
      measurement rather than in general. Deliberately deep: statistical
      weakness is one of the most common limiting factors in a metrologist's
      career, and it is rarely diagnosed as such. Boundary: applying these
      methods to uncertainty evaluation is CM-03; to gauge studies is CM-07; to
      interval analysis is CM-09.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: CM-05-A12
        title: Foundational Knowledge — Reading Data and Simple Statistics
        status: draft
        summary: >-
          The arithmetic a technician actually uses on measurement data,
          and the plots that show what a table hides.
        elements:
          - { id: CM-05-090, title: "Mean, median and range", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-091, title: "Standard deviation and what it describes", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-092, title: "Population and sample distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-05-093, title: "Plotting data and reading a trend", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-094, title: "Histogram and the shape of a data set", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-095, title: "Run charts and spotting a shift", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-096, title: "Correlation and why it is not cause", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-05-097, title: "Sample size and what a small sample cannot tell you", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-05-098, title: "Rounding and precision in a calculated statistic", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-099, title: "Spreadsheet arithmetic and its common errors", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-100, title: "Presenting data honestly", kind: judgment, levelCeiling: 3, status: draft }

      - id: CM-05-A01
        title: Descriptive Statistics and Data Summaries
        status: draft
        elements:
          - { id: CM-05-001, title: "Measures of location and their behaviour under contamination", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-002, title: "Measures of dispersion", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-003, title: "Sample versus population statistics", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-004, title: "Skewness, kurtosis and shape", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-005, title: "Quantiles, order statistics and empirical distributions", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-006, title: "Summarising data without misleading the reader", kind: judgment, levelCeiling: 4, status: draft }

      - id: CM-05-A02
        title: Probability and Distributions
        status: draft
        elements:
          - { id: CM-05-007, title: "Probability axioms and interpretation", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-05-008, title: "Random variables, PDFs and CDFs", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-05-009, title: "The normal distribution and why it is assumed so often", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-05-010, title: "Rectangular, triangular and trapezoidal distributions", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-05-011, title: "Student t distribution and its role in metrology", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-05-012, title: "Chi-squared and F distributions", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-05-013, title: "Poisson and binomial distributions for counting", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-05-014, title: "Lognormal, Weibull and extreme value distributions", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-05-015, title: "The central limit theorem and its practical limits", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-05-016, title: "Joint, marginal and conditional distributions", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-05-017, title: "Covariance, correlation and independence", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-05-018, title: "Transformations of random variables", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-05-A03
        title: Estimation and Interval Construction
        status: draft
        elements:
          - { id: CM-05-019, title: "Point estimation and estimator properties", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-020, title: "Maximum likelihood estimation", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-021, title: "Method of moments and least squares as estimators", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-022, title: "Confidence intervals and what they actually claim", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-05-023, title: "Prediction intervals and tolerance intervals distinguished", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-05-024, title: "Degrees of freedom as a concept", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-025, title: "Sample size determination", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-026, title: "Interval estimation for proportions and rates", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-05-A04
        title: Hypothesis Testing and Inference
        status: draft
        summary: >-
          Includes the widespread misuse of significance testing, which matters
          because metrology reports feed decisions.
        elements:
          - { id: CM-05-027, title: "Null and alternative hypotheses", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-028, title: "Type I and Type II error, significance and power", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-029, title: "What a p-value is and what it is not", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-05-030, title: "t-tests and their assumptions", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-031, title: "Analysis of variance", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-032, title: "Tests for variance and distributional form", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-033, title: "Nonparametric alternatives", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-034, title: "Multiple comparisons and the cost of looking repeatedly", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-05-035, title: "Equivalence testing and why it often fits metrology better", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-036, title: "Statistical significance contrasted with metrological significance", kind: judgment, levelCeiling: 5, status: draft }

      - id: CM-05-A05
        title: Regression, Curve Fitting and Calibration Functions
        status: draft
        elements:
          - { id: CM-05-037, title: "Simple linear regression and its assumptions", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-038, title: "Residual analysis and diagnostics", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-039, title: "Weighted least squares", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-040, title: "Errors-in-variables and total least squares", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-041, title: "Polynomial and nonlinear fitting", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-042, title: "Multiple regression and collinearity", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-043, title: "Uncertainty of fitted parameters and of predictions", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-044, title: "Inverse prediction and the calibration problem", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-045, title: "Interpolation methods and their uncertainty", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-046, title: "Extrapolation and why it is usually indefensible", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-05-047, title: "Model selection and overfitting", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-05-048, title: "Smoothing, splines and filtering", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-05-A06
        title: Design of Experiments
        status: draft
        elements:
          - { id: CM-05-049, title: "Principles of experimental design: randomisation, replication, blocking", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-05-050, title: "Factorial designs", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-051, title: "Fractional factorial and screening designs", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-052, title: "Response surface methodology", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-053, title: "Nested and hierarchical designs for variance components", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-054, title: "Designed experiments for uncertainty evaluation", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-055, title: "Sequential and adaptive experimentation", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-05-A07
        title: Statistical Process Control and Monitoring
        status: draft
        elements:
          - { id: CM-05-056, title: "Control chart fundamentals and the logic of control limits", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-057, title: "Variables charts: X-bar, R, S and individuals", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-058, title: "Attribute charts", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-05-059, title: "CUSUM and EWMA charts", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-060, title: "Run rules and out-of-control signals", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-061, title: "Control charting a check standard", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-062, title: "Distinguishing common-cause from special-cause variation", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-05-063, title: "Autocorrelated processes and why standard charts mislead", kind: skill, levelCeiling: 5, status: draft }

      - id: CM-05-A08
        title: Outliers, Robustness and Data Screening
        status: draft
        elements:
          - { id: CM-05-064, title: "What an outlier is and the danger of the label", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-05-065, title: "Outlier tests and their assumptions", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-066, title: "Robust estimators of location and scale", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-067, title: "When discarding data is defensible and when it is misconduct", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-05-068, title: "Missing data and censored observations", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-05-069, title: "Data screening, plausibility checks and audit trails", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-05-A09
        title: Bayesian Methods
        status: draft
        elements:
          - { id: CM-05-070, title: "Bayes theorem and its metrological interpretation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-05-071, title: "Priors: informative, non-informative and their defensibility", kind: judgment, levelCeiling: 5, status: draft }
