          - { id: CM-05-083, title: "Assigned values and their uncertainty", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-05-084, title: "z-scores, zeta-scores and En numbers", kind: skill, levelCeiling: 4, status: draft }
