          - { id: CM-05-079, title: "Simulation study design", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-080, title: "Numerical accuracy, conditioning and floating-point pitfalls", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-05-081, title: "Reproducibility of a statistical analysis", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-05-A11
        title: Interlaboratory Studies and Proficiency Testing
        status: draft
        summary: >-
          Boundary: the accreditation requirement to participate is CM-10; the
          statistics of doing so are here.
        elements:
