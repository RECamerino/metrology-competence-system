        status: draft
        elements:
          - { id: CM-05-076, title: "Bootstrap methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-05-077, title: "Jackknife and cross-validation", kind: skill, levelCeiling: 4, status: draft }
