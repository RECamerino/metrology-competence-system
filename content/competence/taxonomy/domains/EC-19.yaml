# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.
#
# ONE EC PACK PER DP. DP-19 is the discipline this pack serves. The parity is a
# test rather than a tidiness rule: a discipline with no equipment pack is a
# discipline whose instruments nobody can be assessed on.

schemaVersion: 1
domains:
  - id: EC-19
    title: Additive Manufacturing and Production Metrology Equipment Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the measuring equipment embedded in production:
      on-machine probing, in-process sensing, industrial CT and the
      automated cells that inspect without an operator. Measurement here
      happens where the part is made, and the machine is both the
      manufacturer and the measuring instrument.

    competencyAreas:

      - id: EC-19-A01
        title: On-Machine and In-Process Measurement System Verification
        status: draft
        summary: >-
          Probing systems used on the machine that made the part, where
          the machine's own errors are inside every measurement it
          reports.
        elements:
          - { id: EC-19-001, title: "Receiving inspection and functional check of an on-machine measurement system", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-19-002, title: "Calibration configuration and stabilization for an on-machine measurement system", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-19-003, title: "Selecting the standards and fixturing for an on-machine measurement system calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-19-004, title: "Touch probe pretravel, lobing and repeatability", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-19-005, title: "On-machine measurement against an independent reference", kind: judgment, levelCeiling: 5, status: draft }
          - { id: EC-19-006, title: "Machine thermal state at the time of measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-19-007, title: "Tool setting probe and length offset verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-19-008, title: "Laser tool setter accuracy and repeatability", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-19-009, title: "In-process gauging head calibration and drift", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-19-010, title: "Deciding what an on-machine result can and cannot support", kind: judgment, levelCeiling: 5, status: draft }
          - { id: EC-19-011, title: "Adjustment of an on-machine measurement system, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-19-012, title: "Uncertainty budget for an on-machine measurement system calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-19-013, title: "Conformity statement for an on-machine measurement system against its specification", kind: judgment, levelCeiling: 4, status: draft }

