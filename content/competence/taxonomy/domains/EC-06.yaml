          - { id: EC-06-043, title: "Calibration configuration and stabilisation for a liquid-in-glass thermometer", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-06-044, title: "Selecting the standards and fixturing for a liquid-in-glass thermometer calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-06-045, title: "Indication error at test points by comparison", kind: skill, levelCeiling: 3, status: draft }
