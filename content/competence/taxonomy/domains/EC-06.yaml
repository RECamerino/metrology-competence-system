          - { id: EC-06-064, title: "Spectral response and its effect on a reading", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-06-065, title: "Adjustment of an infrared thermometer, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
