# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-06
    title: Temperature and Humidity Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating thermometers, probes, sources and humidity instruments,
      where the thing being calibrated is usually a sensor plus a readout
      plus a lead, and where the immersion depth and the uniformity of the
      source are inside every number. Boundary: the measurement science is
      DP-05 and DP-06.

    competencyAreas:

      - id: EC-06-A01
        title: Thermocouple Calibration
        status: draft
        summary: >-
          EMF against temperature by comparison or fixed point, with the
          reference junction and the inhomogeneity of a used
          thermocouple as the recurring problems.
        elements:
          - { id: EC-06-001, title: "Receiving inspection and functional check of a thermocouple", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-06-002, title: "Calibration configuration and stabilisation for a thermocouple", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-06-003, title: "Selecting the standards and fixturing for a thermocouple calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-06-004, title: "EMF against temperature by comparison", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-005, title: "Reference junction compensation and ice-point verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-006, title: "Thermoelectric inhomogeneity and its detection", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-06-007, title: "Type-specific behaviour and tolerance classes", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-06-008, title: "Immersion depth and stem conduction error", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-009, title: "Drift, ageing and recalibration intervals for a thermocouple", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-06-010, title: "Extension and compensating cable verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-06-011, title: "Fixed-point calibration of a thermocouple", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-06-012, title: "Adjustment of a thermocouple, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-06-013, title: "Uncertainty budget for a thermocouple calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-014, title: "Conformity statement for a thermocouple against its specification", kind: judgment, levelCeiling: 4, status: draft }

