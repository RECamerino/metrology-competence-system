          - { id: EC-06-040, title: "Uncertainty budget for a temperature readout calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-041, title: "Conformity statement for a temperature readout against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-06-A04
        title: Liquid-in-Glass and Dial Thermometer Calibration
