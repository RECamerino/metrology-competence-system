          - { id: EC-06-016, title: "Calibration configuration and stabilisation for a resistance thermometer", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-06-017, title: "Selecting the standards and fixturing for a resistance thermometer calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-06-018, title: "Resistance against temperature by comparison", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-019, title: "Fixed-point calibration and ITS-90 realisation", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-06-020, title: "Callendar–Van Dusen and ITS-90 coefficient determination", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-021, title: "Self-heating determination and correction", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-022, title: "Lead resistance and three- versus four-wire connection", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-023, title: "Insulation resistance of a probe at temperature", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-024, title: "Hysteresis and thermal shock history", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-06-025, title: "Immersion characteristic verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-026, title: "Adjustment of a resistance thermometer, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-06-027, title: "Uncertainty budget for a resistance thermometer calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-06-028, title: "Conformity statement for a resistance thermometer against its specification", kind: judgment, levelCeiling: 4, status: draft }

