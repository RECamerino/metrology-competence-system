        title: Temperature Indicator and Readout Calibration
        status: draft
        summary: >-
          The electrical half of a temperature measurement, calibrated
          by simulation and then verified with the probe attached.
        elements:
          - { id: EC-06-029, title: "Receiving inspection and functional check of a temperature readout", kind: skill, levelCeiling: 3, status: draft }
