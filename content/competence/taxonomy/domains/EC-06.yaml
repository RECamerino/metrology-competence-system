          - { id: EC-06-067, title: "Conformity statement for an infrared thermometer against its specification", kind: judgment, levelCeiling: 4, status: draft }

      - id: EC-06-A06
        title: Temperature Source and Enclosure Calibration
        status: draft
        summary: >-
