          - { id: DP-11-003, title: "Nuclear magnetic resonance magnetometry", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-11-004, title: "Helmholtz coils and calculable field sources", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-11-005, title: "Magnetic flux standards and the volt-second", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-11-006, title: "Reference magnets and their stability", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-11-007, title: "Traceability for magnetic measurement", kind: judgment, levelCeiling: 4, status: draft }

