# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-10
    title: Ionising Radiation Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating survey meters, dosimeters and activity measuring
      instruments, where the calibration is energy and geometry dependent,
      the source is itself hazardous, and the consequence of an undetected
      error is a person's dose record. Boundary: the measurement science
      is DP-15.

    competencyAreas:

      - id: EC-10-A01
        title: Survey Meter and Dose Rate Instrument Calibration
        status: draft
        summary: >-
          Dose rate instruments calibrated against a known field, where
          energy response and angular dependence dominate the real-world
          error.
        elements:
          - { id: EC-10-001, title: "Receiving inspection and functional check of a radiation survey meter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-10-002, title: "Calibration configuration and stabilisation for a radiation survey meter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-10-003, title: "Selecting the standards and fixturing for a radiation survey meter calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-10-004, title: "Dose rate indication error against a reference field", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-10-005, title: "Energy response across the photon energy range", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-10-006, title: "Angular response and directional dependence", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-10-007, title: "Linearity and range switching across decades", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-10-008, title: "Dead time and saturation at high dose rate", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-10-009, title: "Source geometry, distance and scatter correction", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-10-010, title: "Alarm threshold and audible indication verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-10-011, title: "Detector type specifics: GM, scintillator and ion chamber", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: EC-10-012, title: "Adjustment of a radiation survey meter, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-10-013, title: "Uncertainty budget for a radiation survey meter calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-10-014, title: "Conformity statement for a radiation survey meter against its specification", kind: judgment, levelCeiling: 4, status: draft }

