# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.
#
# ONE EC PACK PER DP. DP-21 is the discipline this pack serves. The parity is a
# test rather than a tidiness rule: a discipline with no equipment pack is a
# discipline whose instruments nobody can be assessed on.

schemaVersion: 1
domains:
  - id: EC-21
    title: Geodetic and Gravimetric Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating instruments that measure position, height and gravity
      over the earth, where the reference is a network or a physical model
      rather than a bench artefact, and where the calibration facility is
      frequently outdoors and kilometres long.

    competencyAreas:

      - id: EC-21-A01
        title: Gravimeter Calibration
        status: draft
        summary: >-
          Absolute and relative gravity instruments, calibrated on
          gravity networks and against absolute determinations.
        elements:
          - { id: EC-21-001, title: "Receiving inspection and functional check of a gravimeter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-21-002, title: "Calibration configuration and stabilization for a gravimeter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-21-003, title: "Selecting the standards and fixturing for a gravimeter calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-21-004, title: "Absolute gravimeter operation and drop measurement", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-21-005, title: "Scale factor determination on a calibration line", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-21-006, title: "Relative gravimeter drift and tare determination", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-21-007, title: "Tidal, ocean loading and polar motion corrections", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-21-008, title: "Vertical gradient determination at a station", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-21-009, title: "Instrument height reduction to the station marker", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-21-010, title: "International comparison participation and offset", kind: judgment, levelCeiling: 5, status: draft }
          - { id: EC-21-011, title: "Superconducting gravimeter operation and calibration", kind: skill, levelCeiling: 5, status: draft }
          - { id: EC-21-012, title: "Adjustment of a gravimeter, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-21-013, title: "Uncertainty budget for a gravimeter calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-21-014, title: "Conformity statement for a gravimeter against its specification", kind: judgment, levelCeiling: 4, status: draft }

