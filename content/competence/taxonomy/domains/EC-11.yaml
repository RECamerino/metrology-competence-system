# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-11
    title: Acoustic and Vibration Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating sound and vibration instruments, where the transducer,
      the coupling and the frequency weighting are inseparable from the
      reading, and where a field check and a laboratory calibration answer
      different questions. Boundary: the measurement science is DP-04.

    competencyAreas:

      - id: EC-11-A01
        title: Sound Level Meter Calibration
        status: draft
        summary: >-
          Acoustic and electrical tests, where the microphone is
          calibrated acoustically and the rest of the instrument
          electrically.
        elements:
          - { id: EC-11-001, title: "Receiving inspection and functional check of a sound level meter", kind: skill, levelCeiling: 3, status: draft }
