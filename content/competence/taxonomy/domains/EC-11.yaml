          - { id: EC-11-004, title: "Acoustic sensitivity at the calibration frequency", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-005, title: "Frequency weighting: A, C and Z response verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-006, title: "Time weighting: fast, slow and impulse response", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-007, title: "Linearity across the level range and range switching", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-008, title: "Microphone free-field and pressure response correction", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-009, title: "Self-generated noise floor determination", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-010, title: "Peak and impulse response verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-011, title: "Octave and third-octave filter verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-012, title: "Windscreen, case and diffraction corrections", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-013, title: "Adjustment of a sound level meter, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-11-014, title: "Uncertainty budget for a sound level meter calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-11-015, title: "Conformity statement for a sound level meter against its specification", kind: judgment, levelCeiling: 4, status: draft }

