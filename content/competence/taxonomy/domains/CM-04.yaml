schemaVersion: 1
domains:
  - id: CM-04
    title: Traceability, Reference Standards and the CIPM MRA
    kind: core
    status: draft
    summary: >-
      How a measurement result is connected to a stated reference through an
      unbroken, documented chain, and the international arrangement that makes
      that connection mean the same thing in every country. Boundary: the
      institutional map is CM-01-A06; uncertainty evaluation within the chain
      is CM-03; accreditation requirements are CM-10.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: CM-04-A07
        title: Foundational Knowledge — Traceability and Reading a Certificate
        status: draft
        summary: >-
          Where a number's authority comes from, and how to read the
          document that carries it — the first thing a technician
          handles and the last thing anybody explains.
        elements:
          - { id: CM-04-050, title: "What traceability means and what it does not", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-04-051, title: "The chain from a working instrument to a national standard", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-04-052, title: "Reading a calibration certificate", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-04-053, title: "What a certificate does and does not say about fitness for use", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-04-054, title: "Accreditation marks and what accreditation covers", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-04-055, title: "Scope of accreditation and reading one", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-04-056, title: "Calibration due date and status labelling", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-04-057, title: "Reference standards and working standards distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-04-058, title: "Unbroken chain: what breaks one", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-04-059, title: "Certificates from a supplier and what to check on receipt", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-04-060, title: "Recording the standards used in a calibration", kind: skill, levelCeiling: 3, status: draft }

      - id: CM-04-A01
        title: Metrological Traceability Concepts
        status: draft
        summary: >-
          What traceability actually requires. Widely claimed, frequently
          misunderstood, and one of the most common sources of accreditation
          findings.
        elements:
          - { id: CM-04-001, title: "The VIM definition of metrological traceability and each of its conditions", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-002, title: "Why a calibration sticker is not evidence of traceability", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-003, title: "The stated reference and what may serve as one", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-004, title: "Unbroken chain of calibrations", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-005, title: "Documented uncertainty at each link", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-006, title: "Traceability to a unit, to a reference procedure, and to a reference material", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-04-007, title: "Metrological traceability chain versus supply chain provenance", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-008, title: "Traceability for quantities with no SI realization", kind: judgment, levelCeiling: 5, status: draft }

      - id: CM-04-A02
        title: Calibration Hierarchies and Dissemination
        status: draft
        summary: How the unit travels from a primary realization to a working instrument.
        elements:
          - { id: CM-04-009, title: "Primary, reference, transfer and working standards", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-04-010, title: "Structure of a calibration hierarchy", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-011, title: "Uncertainty accumulation down a hierarchy", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-04-012, title: "Choosing the right level of the hierarchy for a given need", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-04-013, title: "Echelon and its consequences for cost and capability", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-014, title: "Transfer standards and their special handling", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-015, title: "Check standards and continuous verification of a hierarchy", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-016, title: "Designing an internal traceability architecture for an organization", kind: judgment, levelCeiling: 5, status: draft }

      - id: CM-04-A03
        title: The CIPM MRA, KCDB and CMCs
        status: draft
        summary: >-
          The mechanism by which a national measurement is recognized
          internationally, and how a laboratory reads and uses it.
        elements:
          - { id: CM-04-017, title: "Purpose and structure of the CIPM MRA", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-018, title: "Key comparisons and supplementary comparisons", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-04-019, title: "Key comparison reference values and degrees of equivalence", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-04-020, title: "The BIPM Key Comparison Database and how to search it", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-04-021, title: "Calibration and Measurement Capabilities: what a CMC asserts", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-04-022, title: "CMC review and approval process", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-023, title: "Reading a CMC entry and judging whether it meets your need", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-04-024, title: "Mutual recognition and the acceptance of foreign certificates", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-025, title: "Limits of the MRA and what it does not guarantee", kind: knowledge, levelCeiling: 4, status: draft }

      - id: CM-04-A04
        title: Reference Materials
        status: draft
        summary: >-
          Boundary: chemical and biological reference material production is
          covered in depth in DP-16 and DP-17; this area covers the concepts
          every metrologist needs.
        elements:
          - { id: CM-04-026, title: "Reference materials and certified reference materials distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-04-027, title: "Certified values, property values and their uncertainties", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-028, title: "Commutability and matrix effects", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-04-029, title: "Homogeneity and stability assessment", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-04-030, title: "Reading a reference material certificate", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-04-031, title: "Traceability through a certified reference material", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-032, title: "Selecting, storing and using reference materials correctly", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-04-A05
        title: Intrinsic Standards and Primary Realizations
        status: draft
        summary: >-
          Standards whose value derives from a physical phenomenon rather than
          from calibration against something else.
        elements:
          - { id: CM-04-033, title: "What makes a standard intrinsic", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-034, title: "Josephson voltage standards", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-04-035, title: "Quantum Hall resistance standards", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-04-036, title: "Atomic frequency standards as intrinsic references", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-037, title: "Fixed points and thermometric intrinsic standards", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-038, title: "Stabilized lasers and optical frequency references", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-04-039, title: "Traceability claims for an intrinsic standard and their evidence", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-04-040, title: "Quantum-based dissemination and the changing role of NMIs", kind: knowledge, levelCeiling: 5, status: draft }

      - id: CM-04-A06
        title: Traceability in Practice and Its Failure Modes
        status: draft
        summary: >-
          What actually goes wrong. High-value content: most traceability
          failures are administrative rather than technical.
        elements:
          - { id: CM-04-041, title: "Evaluating whether an external calibration supplier delivers traceability", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-04-042, title: "Accredited versus non-accredited calibration and what each provides", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-04-043, title: "Scope of accreditation: reading it and confirming it covers your work", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-04-044, title: "Broken chains: expired, out-of-scope and out-of-tolerance links", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-04-045, title: "Impact analysis when a link is found to have been invalid", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-04-046, title: "Traceability records and retention requirements", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-04-047, title: "Traceability for software, algorithms and derived quantities", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-04-048, title: "Traceability in field, mobile and in-situ measurement", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-04-049, title: "Common traceability findings raised by assessors", kind: knowledge, levelCeiling: 4, status: draft }
