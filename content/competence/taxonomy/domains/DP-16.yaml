schemaVersion: 1
domains:
  - id: DP-16
    title: Analytical Chemistry, Reference Materials and Gas Metrology
    kind: discipline
    status: draft
    summary: >-
      Chemical measurement, where the sample is usually destroyed, the
      measurand is defined by the method, and sampling error routinely exceeds
      analytical error by an order of magnitude. That inversion of priorities
      relative to physical metrology is the central thing a physically-trained
      metrologist must absorb. Boundary: spectroscopic instrumentation is DP-13;
      clinical measurement is DP-17. SCOPE NOTE: several professional
      disciplines in one pack, not a syllabus; role profiles select from it
      rather than assume it entire.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-16-A08
        title: Foundational Knowledge — Chemical Quantities, Solutions and Sample Handling
        status: draft
        summary: >-
          The quantities of chemical measurement and the sample
          discipline that determines the result before the instrument is
          switched on.
        elements:
          - { id: DP-16-062, title: "Amount of substance, the mole and concentration units", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-16-063, title: "Mass fraction, volume fraction and molarity distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-16-064, title: "Dilution and its calculation", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-16-065, title: "Purity, grade and what a certificate of analysis states", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-16-066, title: "Reference materials and certified values", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-16-067, title: "Sampling and whether a sample represents the batch", kind: judgment, levelCeiling: 3, status: draft }
          - { id: DP-16-068, title: "Contamination, carryover and cross-contamination", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-16-069, title: "Sample storage, stability and holding time", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-16-070, title: "Glassware: volumetric grades and their use", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-16-071, title: "Weighing and dispensing for solution preparation", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-16-072, title: "Temperature effects on volume and concentration", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-16-073, title: "Chemical safety, hazard labelling and safety data sheets", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-16-074, title: "Waste handling and disposal", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-16-075, title: "Recording a chemical result with its method and conditions", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-16-A01
        title: Foundations of Chemical Measurement
        status: draft
        elements:
          - { id: DP-16-001, title: "Amount of substance, the mole and concentration quantities", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-16-002, title: "Concentration expressions and conversion between them", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-16-003, title: "Operationally defined measurands in chemistry", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-16-004, title: "Traceability in chemical measurement", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-16-005, title: "Primary methods of measurement in chemistry", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-16-006, title: "Metrological hierarchy in analytical chemistry", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-16-007, title: "Purity assessment and its role in traceability", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-16-A02
        title: Sampling and Sample Preparation
        status: draft
        summary: >-
          Placed early and deliberately: in chemical measurement, sampling is
          usually the dominant uncertainty contributor and the least controlled
          step.
        elements:
          - { id: DP-16-008, title: "Sampling theory and representativeness", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-16-009, title: "Sampling uncertainty and its estimation", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-16-010, title: "Heterogeneity, particle size and sample mass", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-011, title: "Sample handling, preservation and stability", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-012, title: "Digestion, extraction and dissolution", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-013, title: "Dilution, weighing and volumetric technique", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-014, title: "Contamination control and blank correction", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-015, title: "Volumetric glassware and pipette calibration", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-16-A03
        title: Analytical Techniques
        status: draft
        elements:
          - { id: DP-16-016, title: "Gravimetric and titrimetric analysis", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-017, title: "Coulometry as a primary method", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-018, title: "Gas chromatography", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-019, title: "Liquid chromatography", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-020, title: "Mass spectrometry principles and instrumentation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-16-021, title: "Isotope dilution mass spectrometry", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-16-022, title: "ICP-OES and ICP-MS", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-023, title: "Atomic absorption spectrometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-024, title: "X-ray fluorescence and elemental analysis", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-025, title: "Nuclear magnetic resonance for quantitative analysis", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-026, title: "Thermal analysis techniques", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-16-A04
        title: Calibration, Validation and Data Quality
        status: draft
        elements:
          - { id: DP-16-027, title: "Calibration curves and standard preparation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-028, title: "Standard addition and internal standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-029, title: "Matrix effects and matrix matching", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-16-030, title: "Recovery studies and their interpretation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-031, title: "Limit of detection and limit of quantification", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-032, title: "Selectivity, specificity and interference", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-033, title: "Method validation in analytical chemistry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-034, title: "Uncertainty evaluation for analytical results", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-16-035, title: "Quality control charts and internal quality control", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-036, title: "Reporting results below the detection limit", kind: judgment, levelCeiling: 4, status: draft }

      - id: DP-16-A05
        title: Reference Materials
        status: draft
        summary: >-
          Boundary: reference material concepts for all disciplines are in
          CM-04-A04; this area is their production and certification.
        elements:
          - { id: DP-16-037, title: "Reference material production planning", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-038, title: "Homogeneity assessment and between-bottle variability", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-039, title: "Short-term and long-term stability studies", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-040, title: "Characterisation approaches and value assignment", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-041, title: "Uncertainty of a certified value", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-16-042, title: "Commutability assessment", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-16-043, title: "Certification reporting and the certificate content", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-044, title: "ISO 17034 requirements for reference material producers", kind: knowledge, levelCeiling: 4, status: draft }

      - id: DP-16-A06
        title: Gas Metrology
        status: draft
        elements:
          - { id: DP-16-045, title: "Gravimetric preparation of gas mixtures", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-16-046, title: "Dynamic gas mixture generation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-047, title: "Gas standard stability and cylinder effects", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-048, title: "Ambient air quality measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-049, title: "Emissions and stack gas measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-050, title: "Greenhouse gas measurement and the WMO scales", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-16-051, title: "Natural gas composition and calorific value", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-052, title: "Breath alcohol and forensic gas measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-053, title: "Hydrogen purity measurement", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-16-A07
        title: Electrochemistry and pH
        status: draft
        elements:
          - { id: DP-16-054, title: "pH definition and its metrological basis", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-16-055, title: "Primary pH measurement by the Harned cell", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-16-056, title: "pH buffers and their certification", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-057, title: "Glass electrodes, calibration and liquid junction potential", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-058, title: "Electrolytic conductivity measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-059, title: "Ion selective electrodes", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-060, title: "Redox potential measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-16-061, title: "Uncertainty in pH and conductivity measurement", kind: skill, levelCeiling: 4, status: draft }
