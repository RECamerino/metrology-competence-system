schemaVersion: 1
domains:
  - id: CM-06
    title: Calibration Methodology and Practice
    kind: core
    status: draft
    summary: >-
      The craft of calibration itself, taught discipline-independently: how a
      procedure is designed, validated, executed, recorded and defended.
      Boundary: uncertainty evaluation is CM-03; interval setting is CM-09;
      conformity decisions are CM-08; discipline-specific technique is in the
      DP packs.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: CM-06-A10
        title: Foundational Knowledge — Calibration at the Bench
        status: draft
        summary: >-
          The everyday practice of doing a calibration: following a
          procedure, taking the readings in the right order, and
          recording what happened. This is also the bench-practice layer
          the equipment packs assume — see rule 14.
        elements:
          - { id: CM-06-074, title: "What a calibration is, and what it is not", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-06-075, title: "Calibration, verification and adjustment distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-06-076, title: "Reading and following a calibration procedure", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-077, title: "Preparing a bench and staging the equipment", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-078, title: "Receiving an item: identification, condition and damage", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-079, title: "Stabilization, soak and warm-up before measurement", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-080, title: "Taking readings in the specified order and direction", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-081, title: "As-found and as-left data and why both are taken", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-06-082, title: "Recording raw data legibly and completely", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-083, title: "Environmental conditions and recording them", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-084, title: "Handling, cleanliness and protecting an item under test", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-085, title: "Labelling, status marking and segregation", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-086, title: "Recognizing a result that does not look right", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-06-087, title: "Escalating an out-of-tolerance finding", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-088, title: "Returning an item and what goes with it", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-089, title: "Housekeeping, and leaving the bench fit for the next job", kind: skill, levelCeiling: 2, status: draft }

      - id: CM-06-A01
        title: Calibration Fundamentals
        status: draft
        elements:
          - { id: CM-06-001, title: "What calibration is, and why it is not adjustment", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-06-002, title: "Calibration, verification and validation distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-06-003, title: "The calibration relation and the calibration function", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-06-004, title: "Calibration points, ranges and coverage of use", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-06-005, title: "Reference standard selection and adequacy", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-006, title: "Instrument specifications and how to read them critically", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-007, title: "Tolerance, specification limit and maximum permissible error", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-06-008, title: "Calibration in situ versus in a controlled laboratory", kind: judgment, levelCeiling: 4, status: draft }

      - id: CM-06-A02
        title: Procedure Design and Method Development
        status: draft
        elements:
          - { id: CM-06-009, title: "Anatomy of a calibration procedure", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-010, title: "Writing a procedure that a competent stranger can execute", kind: skill, levelCeiling: 5, status: draft }
          - { id: CM-06-011, title: "Selecting a measurement method for the required capability", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-012, title: "Number and placement of calibration points", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-013, title: "Repetition, ordering and randomization within a procedure", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-014, title: "Hysteresis, loading sequence and directional effects", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-015, title: "Stabilization, soak time and thermal equilibrium", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-016, title: "Environmental control and monitoring within a procedure", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-017, title: "Adapting a published method to local conditions", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-018, title: "Procedure review, approval and version control", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-06-A03
        title: Method Validation and Verification
        status: draft
        elements:
          - { id: CM-06-019, title: "Why a method must be validated before use", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-06-020, title: "Validation parameters and acceptance criteria", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-021, title: "Verifying a standard method in your own hands", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-022, title: "Validating a non-standard or in-house method", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-023, title: "Demonstrating that a method achieves its claimed capability", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-024, title: "Revalidation triggers", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-025, title: "Validation records and their evidentiary value", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-06-A04
        title: Execution, Adjustment and As-Found Data
        status: draft
        summary: >-
          As-found data is the single most valuable dataset a calibration
          laboratory generates, and the most commonly discarded.
        elements:
          - { id: CM-06-026, title: "As-found and as-left data and why both are recorded", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-06-027, title: "Deciding whether to adjust", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-028, title: "Adjustment technique and its own uncertainty", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-029, title: "Limited calibration and restricted-range calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-030, title: "Handling an out-of-tolerance finding", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-031, title: "Reverse traceability and impact assessment after an OOT", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-032, title: "Customer notification obligations", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-06-033, title: "Repair, refurbishment and their effect on calibration history", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-034, title: "Recognizing a failing instrument from its calibration history", kind: judgment, levelCeiling: 5, status: draft }

      - id: CM-06-A05
        title: Comparison and Transfer Techniques
        status: draft
        elements:
          - { id: CM-06-035, title: "Direct comparison methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-036, title: "Substitution and transposition methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-037, title: "Null and balance methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-038, title: "Ratio and bridge techniques", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-039, title: "Designed comparison schemes for artefact intercomparison", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-040, title: "Round-robin and circulating artefact studies", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-041, title: "Self-calibration and closure techniques", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-042, title: "Cancelling systematic effects by experimental design", kind: judgment, levelCeiling: 5, status: draft }

      - id: CM-06-A06
        title: Certificates, Records and Reporting
        status: draft
        summary: >-
          Boundary: general technical writing is CM-15; the required content of
          a certificate under accreditation is CM-10; this area is the
          calibration-specific craft.
        elements:
          - { id: CM-06-043, title: "Required content of a calibration certificate", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-06-044, title: "Reporting results, corrections and uncertainties clearly", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-045, title: "Statements of conformity on a certificate", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-046, title: "Opinions and interpretations and when they may be given", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-047, title: "Amending or withdrawing an issued certificate", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-048, title: "Raw data retention and reconstructability of a result", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-049, title: "Reviewing a certificate you have received from a supplier", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-050, title: "Accreditation body marks and their correct use", kind: knowledge, levelCeiling: 3, status: draft }

      - id: CM-06-A07
        title: Handling, Storage and Transport of Standards
        status: draft
        summary: >-
          Unglamorous and frequently the actual cause of a failed comparison.
        elements:
          - { id: CM-06-051, title: "Handling practices that preserve a standard's value", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-052, title: "Storage environment and its monitoring", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-053, title: "Transport, shock and the case for re-verification on arrival", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-054, title: "Cleaning, surface condition and contamination", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-055, title: "Identification, labelling and status marking", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-06-056, title: "Managing standards that leave the laboratory", kind: judgment, levelCeiling: 4, status: draft }

      - id: CM-06-A08
        title: Sourcing, Insourcing and Programme Management
        status: draft
        summary: >-
          Boundary: the business case and budgeting sit in CM-18; this area is
          the metrological judgement behind the decision.
        elements:
          - { id: CM-06-057, title: "Deciding what to calibrate in house and what to send out", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-058, title: "Qualifying and monitoring an external calibration supplier", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-059, title: "Building a calibration programme from a measurement requirement", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-060, title: "Equipment identification, inventory and status control", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-061, title: "Recall systems and preventing use of overdue equipment", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-062, title: "Equipment criticality classification", kind: judgment, levelCeiling: 4, status: draft }

      - id: CM-06-A09
        title: Metrological Confirmation and Fitness for Intended Use
        status: draft
        summary: >-
          Confirming that a specific item of equipment is fit for a specific
          measurement process, which is a different question from whether it
          was calibrated. A calibration reports what an instrument does; a
          confirmation decides whether that is good enough for the job it is
          about to do. The central concept of ISO 10012 and the step most
          often skipped, because a calibration certificate is mistaken for an
          answer to a question it never asked. Boundary: the management-system
          requirement is CM-10; the risk mathematics behind the decision is
          CM-08.
        elements:
          - { id: CM-06-063, title: "Calibration, verification and metrological confirmation distinguished", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-06-064, title: "Deriving metrological requirements from a measurement process", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-065, title: "Comparing instrument capability against metrological requirements", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-066, title: "Confirmation criteria and how they are set", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-067, title: "Confirmation status, labelling and its meaning to a user", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-068, title: "Confirmation intervals and their relationship to calibration intervals", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-069, title: "Handling a confirmation failure", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-070, title: "Reconfirmation after repair, adjustment or relocation", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-06-071, title: "The same instrument confirmed for one process and not another", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-06-072, title: "Confirmation records and their evidentiary role", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-06-073, title: "Designing a metrological confirmation system", kind: judgment, levelCeiling: 5, status: draft }
