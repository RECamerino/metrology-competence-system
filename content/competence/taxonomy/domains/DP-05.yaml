          - { id: DP-05-043, title: "Thermal uniformity surveys and heat treatment qualification", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-044, title: "Cryogenic temperature measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-045, title: "High temperature measurement above the silver point", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-046, title: "Temperature measurement in process and safety-critical systems", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-05-A05
