          - { id: DP-05-029, title: "Emissivity and its measurement", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-05-030, title: "Blackbody sources and cavity design", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-031, title: "Radiation thermometer types and spectral bands", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-032, title: "Size of source effect", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-05-033, title: "Reflected radiation and background compensation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-034, title: "Atmospheric absorption and path effects", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-035, title: "Ratio and multi-wavelength thermometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-036, title: "Thermal imaging cameras and their calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-05-037, title: "Uncertainty budget for radiation thermometry", kind: skill, levelCeiling: 5, status: draft }

