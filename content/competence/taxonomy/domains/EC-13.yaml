# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.

schemaVersion: 1
domains:
  - id: EC-13
    title: Electrical Power, Energy and High Voltage Equipment Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the instruments of power and energy measurement, and the
      high-voltage equipment used to test electrical apparatus, where
      phase angle and waveform distortion decide the result and the
      working voltages are hazardous. Boundary: the measurement science is
      DP-09 and DP-11.

    competencyAreas:

      - id: EC-13-A01
        title: Energy Meter Calibration
        status: draft
        summary: >-
          Watt-hour meters calibrated across load and power factor,
          because a meter accurate at unity can be badly wrong at a real
          one.
        elements:
          - { id: EC-13-001, title: "Receiving inspection and functional check of an energy meter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-13-002, title: "Calibration configuration and stabilisation for an energy meter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-13-003, title: "Selecting the standards and fixturing for an energy meter calibration", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-13-004, title: "Energy registration error at stated load points", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-13-005, title: "Power factor dependence and phase angle error", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-13-006, title: "Starting current and no-load creep verification", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-13-007, title: "Harmonic and distorted waveform response", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-13-008, title: "Multi-phase and unbalanced load behaviour", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-13-009, title: "Register, pulse output and display verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-13-010, title: "Reference meter and phantom loading arrangements", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-13-011, title: "Tariff, time-of-use and demand register verification", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-13-012, title: "Adjustment of an energy meter, and what it does to as-found data", kind: judgment, levelCeiling: 4, status: draft }
          - { id: EC-13-013, title: "Uncertainty budget for an energy meter calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: EC-13-014, title: "Conformity statement for an energy meter against its specification", kind: judgment, levelCeiling: 4, status: draft }

