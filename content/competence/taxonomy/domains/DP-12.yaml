          - { id: DP-12-028, title: "Solar and UV irradiance measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-029, title: "Uncertainty evaluation in photometry", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-12-A04
        title: Colorimetry
        status: draft
        elements:
          - { id: DP-12-030, title: "Colour matching functions and the standard observer", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-12-031, title: "Tristimulus values and chromaticity coordinates", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-032, title: "CIE colour spaces and uniform colour spaces", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-12-033, title: "Colour difference formulae", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-034, title: "Standard illuminants and viewing conditions", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-035, title: "Metamerism and illuminant dependence", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-12-036, title: "Correlated colour temperature and distance from the Planckian locus", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-037, title: "Colour rendering and fidelity metrics", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-038, title: "Spectrophotometers and colorimeters", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-039, title: "Colour measurement of fluorescent and translucent materials", kind: skill, levelCeiling: 4, status: draft }
