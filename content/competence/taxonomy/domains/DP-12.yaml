schemaVersion: 1
domains:
  - id: DP-12
    title: Photometry, Radiometry and Colorimetry
    kind: discipline
    status: draft
    summary: >-
      Optical radiation measured physically (radiometry), as perceived by the
      human eye (photometry), and as colour. Unusual among disciplines in that
      one of its base units, the candela, is defined by reference to a human
      observer — which makes the distinction between physical and perceptual
      quantities a competence in its own right rather than a technicality.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-12-A06
        title: Foundational Knowledge — Light, Colour and Photometric Quantities
        status: draft
        summary: >-
          The difference between measuring light physically and
          measuring it as the eye responds to it, which is where most
          photometric confusion begins.
        elements:
          - { id: DP-12-049, title: "Radiometric and photometric quantities distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-12-050, title: "Lumen, candela, lux and their relationship", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-12-051, title: "Luminance against illuminance", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-12-052, title: "The photopic response and why a detector must match it", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-12-053, title: "Wavelength, spectrum and colour", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-12-054, title: "Colour temperature and the illuminant", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-12-055, title: "The inverse square law and measurement distance", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-12-056, title: "Cosine response and the angle of incident light", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-12-057, title: "Stray light and ambient rejection", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-12-058, title: "Detector fatigue, warm-up and drift", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-12-059, title: "Source stabilisation and lamp warm-up", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-12-060, title: "Laser and optical radiation safety in outline", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-12-061, title: "Recording a photometric result with its geometry", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-12-A01
        title: Radiometric and Photometric Quantities
        status: draft
        elements:
          - { id: DP-12-001, title: "Radiometric quantities: flux, intensity, irradiance, radiance", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-12-002, title: "Photometric quantities and their radiometric counterparts", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-12-003, title: "The candela definition and the spectral luminous efficiency function", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-12-004, title: "Photopic, scotopic and mesopic vision", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-12-005, title: "Solid angle, projected area and the inverse square law", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-12-006, title: "Lambertian sources and the cosine law", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-12-007, title: "Distance, alignment and the limits of the point source assumption", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-12-008, title: "Units and conversion in photometry and radiometry", kind: knowledge, levelCeiling: 3, status: draft }

      - id: DP-12-A02
        title: Detectors and Standards
