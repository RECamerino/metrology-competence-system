          - { id: DP-12-041, title: "Visual assessment and its relationship to instrumental colour", kind: judgment, levelCeiling: 4, status: draft }

      - id: DP-12-A05
        title: Applied Optical Radiation Measurement
        status: draft
        elements:
          - { id: DP-12-042, title: "Lighting design measurement and field photometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-043, title: "Display and projector measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-044, title: "Photobiological safety and blue light hazard", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-045, title: "UV disinfection dose measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-046, title: "Photovoltaic device measurement and solar simulators", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-047, title: "Optical properties of materials for industry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-048, title: "Retroreflection and road safety measurement", kind: skill, levelCeiling: 4, status: draft }
