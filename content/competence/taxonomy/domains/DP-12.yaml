          - { id: DP-12-010, title: "Silicon and other photodiode detectors", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-011, title: "Trap detectors and predictable quantum efficiency devices", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-012, title: "Thermal detectors: thermopiles and pyroelectrics", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-013, title: "Photometer heads and V-lambda filtering", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-014, title: "Spectral mismatch correction", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-12-015, title: "Detector linearity, spatial uniformity and temperature dependence", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-12-016, title: "Standard lamps and source standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-017, title: "Lamp ageing, seasoning and operating conditions", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-018, title: "Integrating spheres and their characterisation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-12-019, title: "Stray light and its control", kind: skill, levelCeiling: 4, status: draft }

