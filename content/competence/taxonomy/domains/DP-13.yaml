schemaVersion: 1
domains:
  - id: DP-13
    title: Spectroscopy, Lasers and Fibre Optics
    kind: discipline
    status: draft
    summary: >-
      Wavelength-resolved measurement, coherent optical sources, and guided
      optical transmission. Distinguished from DP-12 by its concern with
      spectral structure rather than integrated optical power, and from DP-16 by
      treating spectroscopy as a physical measurement technique rather than as
      an analytical chemistry method.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-13-A07
        title: Foundational Knowledge — Spectra, Lasers and Optical Fibre
        status: draft
        summary: >-
          Wavelength as the organizing quantity, the loss budget that
          governs fibre work, and the laser safety that governs
          everything else.
        elements:
          - { id: DP-13-049, title: "Wavelength, frequency and the electromagnetic spectrum", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-13-050, title: "Absorption, transmission and reflection", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-13-051, title: "Absorbance and transmittance and the relationship between them", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-13-052, title: "Laser classes and the hazard each presents", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-13-053, title: "Laser safety: eyewear, controlled areas and interlocks", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-13-054, title: "Beam divergence, spot size and power density", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-13-055, title: "Optical fibre: single mode and multimode", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-13-056, title: "Loss in decibels and the fibre loss budget", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-13-057, title: "Connector types, end-face condition and cleaning", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-13-058, title: "Bend radius, stress and fibre handling", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-13-059, title: "Splices, reflections and their effect on a link", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-13-060, title: "Cleanliness of optics and why a fingerprint is a measurement error", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-13-061, title: "Recording an optical result with its wavelength", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-13-A01
        title: Spectroscopic Fundamentals
        status: draft
        elements:
          - { id: DP-13-001, title: "Wavelength, wavenumber, frequency and energy relationships", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-13-002, title: "Absorption, emission and scattering processes", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-13-003, title: "Spectral resolution, bandpass and slit function", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-13-004, title: "Line shapes and broadening mechanisms", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-13-005, title: "Beer-Lambert law and its limits of validity", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-13-006, title: "Signal to noise and detection limits in spectroscopy", kind: knowledge, levelCeiling: 4, status: draft }

      - id: DP-13-A02
        title: Spectrometers and Their Calibration
        status: draft
        elements:
          - { id: DP-13-007, title: "Dispersive spectrometer architectures", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-13-008, title: "Fourier transform spectrometers", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-13-009, title: "Array detectors and their characterization", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-010, title: "Wavelength calibration and reference standards", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-13-011, title: "Photometric and absorbance scale calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-012, title: "Stray light characterization and correction", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-013, title: "Bandwidth effects on measured absorbance", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-014, title: "Spectrometer verification standards and filters", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-015, title: "Uncertainty evaluation in spectrophotometry", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-13-A03
        title: Spectroscopic Techniques
        status: draft
        elements:
          - { id: DP-13-016, title: "UV-visible absorption spectroscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-017, title: "Infrared and FTIR spectroscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-018, title: "Raman spectroscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-019, title: "Fluorescence and luminescence spectroscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-020, title: "Atomic absorption and emission spectroscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-021, title: "Laser-based absorption and cavity enhanced techniques", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-022, title: "Frequency comb spectroscopy", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-023, title: "Hyperspectral imaging", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-024, title: "Chemometrics and multivariate spectral calibration", kind: judgment, levelCeiling: 5, status: draft }

      - id: DP-13-A04
