          - { id: DP-13-026, title: "Beam quality, M-squared and beam profiling", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-027, title: "Laser power and energy measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-028, title: "Wavelength and frequency stabilization", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-029, title: "Stabilized lasers as length and frequency standards", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-13-030, title: "Optical frequency combs", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-031, title: "Linewidth and coherence measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-032, title: "Pulsed laser characterization", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-033, title: "Laser safety classification and control measures", kind: knowledge, levelCeiling: 4, status: draft }

      - id: DP-13-A05
        title: Interferometry
        status: draft
        elements:
          - { id: DP-13-034, title: "Interferometer configurations and their applications", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-13-035, title: "Fringe counting and phase interpolation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-036, title: "Environmental compensation in interferometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-037, title: "Surface form interferometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-038, title: "White light and low coherence interferometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-039, title: "Error sources in interferometric measurement", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-13-A06
        title: Fibre Optics and Optical Communications
        status: draft
        elements:
          - { id: DP-13-040, title: "Optical fibre types and propagation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-13-041, title: "Attenuation measurement and cutback technique", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-042, title: "Optical time domain reflectometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-043, title: "Optical power meter calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-044, title: "Connector loss, return loss and end face quality", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-045, title: "Dispersion measurement: chromatic and polarization mode", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-046, title: "Optical spectrum analysis for communications", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-047, title: "Fibre optic sensing and distributed measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-13-048, title: "Uncertainty in optical fibre measurement", kind: skill, levelCeiling: 5, status: draft }
