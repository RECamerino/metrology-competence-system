          - { id: CM-22-036, title: "Handover and communication between shifts and teams", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-22-037, title: "Speaking up across a hierarchy", kind: judgment, levelCeiling: 4, status: draft }
