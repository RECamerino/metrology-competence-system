          - { id: CM-22-028, title: "Laser and optical radiation safety", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-22-029, title: "Ionizing radiation safety and dose control", kind: skill, levelCeiling: 4, status: draft }
