          - { id: CM-22-032, title: "Permit to work, isolation and lockout", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-22-033, title: "Emergency response and incident reporting", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-22-034, title: "Safety on customer sites and in the field", kind: skill, levelCeiling: 4, status: draft }

      - id: CM-22-A05
        title: Teams, Culture and Wellbeing
