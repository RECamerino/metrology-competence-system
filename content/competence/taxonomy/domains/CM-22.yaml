          - { id: CM-22-002, title: "Perception, reading error and parallax", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: CM-22-003, title: "Attention, vigilance and repetitive task degradation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-22-004, title: "Fatigue, shift work and circadian effects on performance", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-22-005, title: "Expectation bias and reading what you expect to see", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: CM-22-006, title: "Anchoring, rounding habits and digit preference", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: CM-22-007, title: "Blinding and masking to control observer bias", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-22-008, title: "Quantifying operator contribution to uncertainty", kind: skill, levelCeiling: 5, status: draft }

