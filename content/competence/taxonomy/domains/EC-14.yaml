# Equipment-calibration pack. See rule 14 in CLAUDE.md: an EC element is the
# competence to calibrate a CLASS OF EQUIPMENT — the parameters, the standards
# required, and where the job goes wrong. Calibration methodology stays in
# CM-06, and an element here that could be written without naming the
# equipment belongs there instead.
#
# ONE EC PACK PER DP. DP-07 is the discipline this pack serves. The parity is a
# test rather than a tidiness rule: a discipline with no equipment pack is a
# discipline whose instruments nobody can be assessed on.

schemaVersion: 1
domains:
  - id: EC-14
    title: Flow and Volume Instrument Calibration
    kind: equipment
    status: draft
    summary: >-
      Calibrating the instruments of flow and volume measurement, where
      installation, flow profile and reference conditions change a meter
      factor more than the meter drifts. Split from the pressure pack so
      that DP-07 has an equipment pack of its own.

    competencyAreas:

      - id: EC-05-A05
        title: Liquid Flow Meter Calibration
        status: draft
        summary: >-
          Gravimetric and volumetric comparison, where installation and
          flow profile change a meter's factor more than the meter
          itself drifts.
        elements:
          - { id: EC-05-055, title: "Receiving inspection and functional check of a liquid flow meter", kind: skill, levelCeiling: 3, status: draft }
          - { id: EC-05-056, title: "Calibration configuration and stabilization for a liquid flow meter", kind: skill, levelCeiling: 3, status: draft }
