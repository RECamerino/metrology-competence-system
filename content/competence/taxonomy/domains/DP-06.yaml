          - { id: DP-06-029, title: "Water activity measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-030, title: "Moisture reference materials and method comparability", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-031, title: "Sampling and homogeneity in moisture determination", kind: judgment, levelCeiling: 5, status: draft }

      - id: DP-06-A05
        title: Applied Humidity Measurement
        status: draft
        elements:
          - { id: DP-06-032, title: "Humidity control in metrology laboratories", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-06-033, title: "Environmental chamber qualification and mapping", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-034, title: "Humidity in pharmaceutical and food storage", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-06-035, title: "Meteorological humidity measurement", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-06-036, title: "Humidity in compressed gas and process systems", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-037, title: "Condensation risk assessment", kind: skill, levelCeiling: 3, status: draft }
