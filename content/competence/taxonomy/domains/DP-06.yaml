schemaVersion: 1
domains:
  - id: DP-06
    title: Humidity and Moisture
    kind: discipline
    status: draft
    summary: >-
      Water vapour in gases and water content in solids and liquids. A small
      discipline with an outsized error rate, because humidity quantities are
      interconvertible only through temperature and pressure, and practitioners
      routinely conflate them. Boundary: humidity as an influence quantity on
      other measurements is CM-12-A01.

    competencyAreas:

      - id: DP-06-A01
        title: Humidity Quantities and Relationships
        status: draft
        elements:
          - { id: DP-06-001, title: "Relative humidity, dew point, mixing ratio and absolute humidity", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-06-002, title: "Conversion between humidity quantities and its dependencies", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-003, title: "Saturation vapour pressure formulations", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-06-004, title: "Enhancement factor and non-ideal gas behaviour", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-06-005, title: "Frost point and its distinction from dew point", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-06-006, title: "Wet-bulb temperature and psychrometry", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-06-007, title: "Choosing the right humidity quantity for an application", kind: judgment, levelCeiling: 4, status: draft }

      - id: DP-06-A02
        title: Humidity Generation and Standards
        status: draft
        elements:
          - { id: DP-06-008, title: "Two-pressure humidity generators", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-009, title: "Two-temperature and divided-flow generators", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-010, title: "Saturated salt solutions and their limitations", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-011, title: "Gravimetric hygrometry as a primary method", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-06-012, title: "Standard humidity chambers and uniformity", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-013, title: "Uncertainty budget for humidity generation", kind: skill, levelCeiling: 5, status: draft }

