schemaVersion: 1
domains:
  - id: DP-06
    title: Humidity and Moisture
    kind: discipline
    status: draft
    summary: >-
      Water vapour in gases and water content in solids and liquids. A small
      discipline with an outsized error rate, because humidity quantities are
      interconvertible only through temperature and pressure, and practitioners
      routinely conflate them. Boundary: humidity as an influence quantity on
      other measurements is CM-12-A01.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-06-A06
        title: Foundational Knowledge — Humidity, Moisture and Psychrometry
        status: draft
        summary: >-
          The several different quantities all called humidity, why they
          are not interchangeable, and why temperature is inside every
          one of them.
        elements:
          - { id: DP-06-038, title: "Relative humidity, absolute humidity and dew point distinguished", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-06-039, title: "Saturation and why relative humidity depends on temperature", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-06-040, title: "Dew point, frost point and where they diverge", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-06-041, title: "Wet and dry bulb measurement and psychrometric charts", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-06-042, title: "Sensor response time and equilibration", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-06-043, title: "Sensor hysteresis after exposure to high humidity", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-06-044, title: "Contamination, condensation and sensor recovery", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-06-045, title: "Air velocity over a probe and its effect", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-06-046, title: "Salt solutions as a field check", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-06-047, title: "Sampling: measuring the air you meant to measure", kind: judgment, levelCeiling: 3, status: draft }
          - { id: DP-06-048, title: "Moisture in solids and in gases as different measurements", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-06-049, title: "Recording a humidity result with its temperature", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-06-A01
        title: Humidity Quantities and Relationships
        status: draft
        elements:
          - { id: DP-06-001, title: "Relative humidity, dew point, mixing ratio and absolute humidity", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-06-002, title: "Conversion between humidity quantities and its dependencies", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-003, title: "Saturation vapour pressure formulations", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-06-004, title: "Enhancement factor and non-ideal gas behaviour", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-06-005, title: "Frost point and its distinction from dew point", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-06-006, title: "Wet-bulb temperature and psychrometry", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-06-007, title: "Choosing the right humidity quantity for an application", kind: judgment, levelCeiling: 4, status: draft }

      - id: DP-06-A02
