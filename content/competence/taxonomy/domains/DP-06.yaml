          - { id: DP-06-023, title: "High temperature and high pressure humidity measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-024, title: "Uncertainty budget for humidity calibration", kind: skill, levelCeiling: 5, status: draft }

