          - { id: DP-06-009, title: "Two-temperature and divided-flow generators", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-010, title: "Saturated salt solutions and their limitations", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-011, title: "Gravimetric hygrometry as a primary method", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-06-012, title: "Standard humidity chambers and uniformity", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-06-013, title: "Uncertainty budget for humidity generation", kind: skill, levelCeiling: 5, status: draft }

