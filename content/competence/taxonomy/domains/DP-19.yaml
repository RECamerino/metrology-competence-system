schemaVersion: 1
domains:
  - id: DP-19
    title: Additive Manufacturing and Advanced Production Metrology
    kind: discipline
    status: draft
    summary: >-
      Measurement for production processes that conventional inspection was not
      designed for: additively manufactured parts with internal geometry no
      probe can reach, in-process monitoring, and closed-loop production
      control. Boundary: the dimensional techniques themselves are DP-01; this
      domain is their application where the part or the process breaks the
      usual assumptions.

    competencyAreas:

      # FIRST, not last. Display order follows array order, not the area ID.
      # This is where a career starts and, for most people who will ever use
      # this corpus, where it stays: the areas below are what a minority go on
      # to. Ceilings run low here because that is honest — several of these
      # genuinely stop at Advanced Beginner, which is what the L1 and L2 rungs
      # in tools/ceiling-plan.json exist for.
      - id: DP-19-A06
        title: Foundational Knowledge — Production Measurement and Process Context
        status: draft
        summary: >-
          Measurement inside manufacturing, where the part is still
          changing, the measurement is one step in a process, and the
          answer feeds a decision immediately.
        elements:
          - { id: DP-19-055, title: "Measurement in-process, on-machine and post-process compared", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-056, title: "Process capability and what Cp and Cpk describe", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-057, title: "Variation: common cause and special cause", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-058, title: "Control charts and reading one correctly", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-19-059, title: "Gauge R&R and what it tells you about a measurement", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-060, title: "Measurement uncertainty against process tolerance", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-061, title: "How often to measure, and how many parts", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-062, title: "First article inspection and its purpose", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-063, title: "Part cleanliness, burrs and as-manufactured condition", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-19-064, title: "Thermal state of a part straight off a machine", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-065, title: "Fixturing and datum repeatability in production", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-19-066, title: "Additive processes and how they differ for measurement", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-19-067, title: "Recording a production measurement and its disposition", kind: skill, levelCeiling: 3, status: draft }

      - id: DP-19-A01
        title: Additive Manufacturing Measurement
        status: draft
        elements:
          - { id: DP-19-001, title: "Additive processes and their measurement implications", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-19-002, title: "Why additive parts defeat conventional inspection", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-19-003, title: "Internal geometry and inaccessible feature measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-004, title: "Computed tomography for additive part inspection", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-005, title: "CT calibration, artefacts and dimensional traceability", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-19-006, title: "Surface texture of as-built additive surfaces", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-007, title: "Porosity, density and defect characterization", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-008, title: "Residual stress measurement in additive parts", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-009, title: "Distortion, warping and datum instability", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-010, title: "Test artefacts and machine qualification for additive processes", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-011, title: "Feedstock powder characterization", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-012, title: "Qualification of additive parts for critical applications", kind: judgment, levelCeiling: 5, status: draft }

      - id: DP-19-A02
        title: In-Process and In-Line Measurement
        status: draft
        elements:
          - { id: DP-19-013, title: "In-process monitoring principles and their limits", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-19-014, title: "Melt pool and thermal monitoring", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-015, title: "Layer-wise optical inspection", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-016, title: "Traceability of an in-process measurement", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-19-017, title: "In-line dimensional measurement in production", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-018, title: "On-machine probing and machine tool measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-019, title: "Relating in-process signals to part quality", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-19-020, title: "Measurement-driven process control and closed loop correction", kind: judgment, levelCeiling: 5, status: draft }

      - id: DP-19-A03
        title: Advanced Materials and Joining
        status: draft
        elements:
          - { id: DP-19-021, title: "Composite material inspection and defect detection", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-022, title: "Adhesive and bonded joint evaluation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-023, title: "Weld inspection and measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-024, title: "Coating thickness measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-025, title: "Non-destructive testing methods and their measurement basis", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-19-026, title: "Ultrasonic thickness and flaw measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-027, title: "Eddy current and electromagnetic inspection", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-028, title: "Mechanical property testing and its measurement uncertainty", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-19-A04
        title: Production Systems and Integration
        status: draft
        elements:
          - { id: DP-19-029, title: "Designing an inspection strategy for a production line", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-19-030, title: "First article inspection and production part approval", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-031, title: "Automated inspection cells and robot-mounted metrology", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-032, title: "Machine vision inspection systems", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-033, title: "Sampling plans and inspection frequency", kind: judgment, levelCeiling: 4, status: draft }
          - { id: DP-19-034, title: "Fixturing, repeatability and part presentation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-035, title: "Traceability and identification through a production process", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-036, title: "Reverse engineering and as-built model generation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-037, title: "Measurement planning from a model-based definition", kind: judgment, levelCeiling: 5, status: draft }

      - id: DP-19-A05
        title: Nondestructive Measurement and Inspection
        status: draft
        summary: >-
          NDT treated as measurement science rather than as a set of trades.
          The distinctive competence is that the measurand is usually a defect
          that may not be there, so detection probability and sizing
          uncertainty matter more than instrument accuracy, and a negative
          result carries a claim that must be quantified. Individual physical
          techniques also appear in their own packs — ultrasonics in DP-04,
          eddy current in DP-08, radiography in DP-15, thermography in DP-05 —
          and this area is where they are treated as inspection methods.
        elements:
          - { id: DP-19-038, title: "NDT as measurement: what is being measured and what is being claimed", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-19-039, title: "Probability of detection and its determination", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-19-040, title: "Flaw sizing and sizing uncertainty", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-19-041, title: "What a negative NDT result does and does not assert", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-19-042, title: "Reference blocks, calibration standards and artificial defects", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-043, title: "Ultrasonic testing: pulse-echo and through-transmission", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-044, title: "Phased array ultrasonics and time-of-flight diffraction", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-19-045, title: "Guided wave and long-range screening techniques", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-046, title: "Radiographic testing and digital radiography", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-047, title: "Industrial computed tomography for defect detection", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-19-048, title: "Magnetic particle and liquid penetrant inspection", kind: skill, levelCeiling: 3, status: draft }
          - { id: DP-19-049, title: "Eddy current inspection and depth of penetration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-050, title: "Infrared thermography and shearography", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-051, title: "Acoustic emission monitoring", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-19-052, title: "Acceptance criteria and their origin in fitness for service", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-19-053, title: "Operator effects and inspector qualification schemes", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-19-054, title: "Automated and robotic NDT with machine interpretation", kind: skill, levelCeiling: 5, status: draft }
