          - { id: DP-07-041, title: "Metering systems, computers and volume correction", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-042, title: "Multiphase and wet gas flow measurement", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-07-043, title: "Cryogenic and liquefied gas flow", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-044, title: "Low flow and micro flow measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-045, title: "Medical and infusion flow measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-046, title: "Air velocity and anemometry", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-047, title: "Water and wastewater flow measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-048, title: "Hydrogen and alternative fuel flow measurement", kind: skill, levelCeiling: 4, status: draft }
