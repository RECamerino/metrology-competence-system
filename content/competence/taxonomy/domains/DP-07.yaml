schemaVersion: 1
domains:
  - id: DP-07
    title: Flow Measurement
    kind: discipline
    status: draft
    summary: >-
      Volume and mass flow of liquids, gases and multiphase mixtures. The
      discipline where installation dominates: a flow meter calibrated to a
      tenth of a percent can read several percent wrong because of what is
      upstream of it, and understanding that is the core competence.

    competencyAreas:

      - id: DP-07-A01
        title: Flow Fundamentals
        status: draft
        elements:
          - { id: DP-07-001, title: "Volumetric and mass flow rate and their relationship", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-07-002, title: "Reynolds number and flow regimes", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-003, title: "Velocity profile development and fully developed flow", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-07-004, title: "Swirl, asymmetry and flow disturbance", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-005, title: "Compressibility and expansibility in gas flow", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-006, title: "Reference conditions for gas volume", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-007, title: "Conservation principles applied to flow measurement", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-008, title: "Pulsating and unsteady flow effects", kind: knowledge, levelCeiling: 4, status: draft }

      - id: DP-07-A02
        title: Flow Meter Technologies
        status: draft
        elements:
          - { id: DP-07-009, title: "Differential pressure meters: orifice, nozzle, venturi", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-010, title: "Discharge coefficient and its determination", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-07-011, title: "Positive displacement meters", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-012, title: "Turbine meters", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-013, title: "Electromagnetic flow meters", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-014, title: "Ultrasonic flow meters: transit time and Doppler", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-015, title: "Coriolis mass flow meters", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-016, title: "Vortex shedding meters", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-017, title: "Thermal mass flow meters", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-018, title: "Variable area and rotameter devices", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-07-019, title: "Laminar flow elements", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-020, title: "Open channel and weir flow measurement", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-07-021, title: "Meter selection for an application", kind: judgment, levelCeiling: 5, status: draft }

      - id: DP-07-A03
        title: Flow Standards and Calibration Facilities
        status: draft
        elements:
          - { id: DP-07-022, title: "Gravimetric flow standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-023, title: "Volumetric provers and pipe provers", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-024, title: "Piston provers and syringe standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-025, title: "Bell provers and gas volume standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-026, title: "Critical flow venturi nozzles", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-027, title: "Master meter and transfer standard methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-028, title: "PVTt gas flow standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-07-029, title: "Traceability of flow measurement and its chain", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-07-030, title: "Uncertainty budget for flow calibration", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-07-031, title: "Calibration at conditions other than those of use", kind: judgment, levelCeiling: 4, status: draft }

      - id: DP-07-A04
        title: Installation and In-Service Performance
        status: draft
        elements:
