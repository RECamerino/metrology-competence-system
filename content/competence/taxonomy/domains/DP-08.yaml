          - { id: DP-08-053, title: "Charge, current, voltage and resistance as physical quantities", kind: knowledge, levelCeiling: 2, status: draft }
          - { id: DP-08-054, title: "Ohm's law applied to a resistive circuit", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-08-066, title: "Kirchhoff's current and voltage laws", kind: knowledge, levelCeiling: 3, status: draft }
