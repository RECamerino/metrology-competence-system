schemaVersion: 1
domains:
  - id: DP-08
    title: DC and Low Frequency Electrical Metrology
    kind: discipline
    status: draft
    summary: >-
      Voltage, current, resistance and charge at DC and low frequency, including
      the quantum standards that now anchor the electrical units. The discipline
      where the gap between what an instrument displays and what it measured is
      widest, because thermal EMFs, leakage and guarding operate below the level
      most practitioners think about. Boundary: AC power and impedance are
      DP-09; RF is DP-10.

    competencyAreas:

      - id: DP-08-A01
        title: Quantum Electrical Standards
        status: draft
        elements:
          - { id: DP-08-001, title: "The ampere definition from the elementary charge", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-08-002, title: "Josephson effect and voltage standards", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-08-003, title: "Programmable and pulse-driven Josephson arrays", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-08-004, title: "Quantum Hall effect and resistance standards", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-08-005, title: "Graphene quantum Hall devices", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-08-006, title: "Single electron transport and current standards", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-08-007, title: "The quantum metrology triangle", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-08-008, title: "Dissemination from quantum standards to working standards", kind: knowledge, levelCeiling: 5, status: draft }

      - id: DP-08-A02
        title: DC Voltage
        status: draft
        elements:
          - { id: DP-08-009, title: "Zener reference standards and their behaviour", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-08-010, title: "Standard cells and their historical role", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-08-011, title: "Voltage divider techniques", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-08-012, title: "Potentiometric and null measurement methods", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-08-013, title: "Digital multimeter architecture and DC voltage performance", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-08-014, title: "DC voltage calibration procedures", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-08-015, title: "Low-level voltage measurement and nanovolt techniques", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-08-016, title: "High voltage DC measurement and dividers", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-08-017, title: "Uncertainty budget for DC voltage calibration", kind: skill, levelCeiling: 5, status: draft }

