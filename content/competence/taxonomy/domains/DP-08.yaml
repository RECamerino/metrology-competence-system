          - { id: DP-08-019, title: "Temperature and power coefficients of resistance standards", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-08-020, title: "Two, three and four terminal resistance definitions", kind: knowledge, levelCeiling: 4, status: draft }
