schemaVersion: 1
domains:
  - id: DP-08
    title: DC and Low Frequency Electrical Metrology
    kind: discipline
    status: draft
    summary: >-
      Voltage, current, resistance and charge at DC and low frequency, including
      the quantum standards that now anchor the electrical units. The discipline
      where the gap between what an instrument displays and what it measured is
      widest, because thermal EMFs, leakage and guarding operate below the level
      most practitioners think about. Boundary: AC power and impedance are
      DP-09; RF is DP-10.

    competencyAreas:

      # FIRST, not last. This is where a career starts and, for most of the
      # people who will ever use this corpus, where it stays: the areas below
      # are what a minority go on to. An entry section stuck at the end of the
      # domain is an entry section nobody finds.
      #
      # Added after a practicing metrologist pointed out that this domain began
      # at the ampere definition and the Josephson effect and had no element
      # for Ohm's law, so prior education was an unstated entry requirement in
      # a project whose first principle is that nothing gates entry.
      #
      # COMPREHENSIVE ON PURPOSE. Sized as a body of knowledge somebody can
      # work from for twenty years, not as a ramp to the areas below. That is
      # why it is nearly as large as the rest of the domain, and why instrument
      # operation is split by CLASS: a 3½-digit handheld, a 6½-digit bench
      # meter, an 8½-digit reference, a null detector and a nanovoltmeter are
      # different instruments used for different jobs, and one element called
      # "operating a digital multimeter" collapsed all of them into a heading
      # so broad nothing could be assessed against it.
      #
      # Ceilings run below 3 where the competence genuinely stops there, which
      # is what the L1 and L2 rungs in tools/ceiling-plan.json exist for. They
      # also reach 4 where a twenty-year technician is still better at it than
      # a two-year one — an 8½-digit reference meter and a nanovoltmeter are
      # foundational to this discipline and not remotely shallow.
      - id: DP-08-A07
        title: Foundational Knowledge — Electrical Quantities and Circuits
        status: draft
        summary: >-
          The working knowledge of electricity and instruments that a person in
          this discipline needs to do the job: the quantities, the circuit
          behaviour that makes a connection make sense, the instrument classes
          and what each is for, the technique that separates a reading from a
          measurement, and the safety that comes before any of it. Entry to the
          discipline and, for most practitioners, the whole of it.
