          - { id: DP-08-024, title: "Hamon transfer devices and resistance scaling", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-08-025, title: "High resistance and insulation measurement", kind: skill, levelCeiling: 4, status: draft }
