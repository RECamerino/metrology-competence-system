# Proficiency scale and evidence ladder
#
# The frame that every per-element anchor is written into. This file says what
# a level MEANS and what it COSTS; the element's own anchors say what it looks
# like for that specific competence.
#
# Steward-controlled. Changing the meaning of a level retroactively changes
# what every credential already issued asserts — see GOVERNANCE.md.
#
# Two properties hold at every level:
#
#   Open-resource. The candidate may use references, the internet, and AI
#   assistance, because a working metrologist has all three. There is no
#   proctoring anywhere in this system. Integrity is carried by item design.
#
#   No self-signoff, ever. The signer is always a distinct natural person.
#
# ---------------------------------------------------------------------------
# CROSSWALK TO THE PROFESSION'S OWN SCALES — added 2026-08-17
# ---------------------------------------------------------------------------
#
# This ladder came from a general skill-acquisition model (decision 7,
# "5-level Dreyfus-style"), not from the metrology profession's published
# position. The profession has two scales and this system matches neither, so
# the mapping is stated here rather than left for each adopting laboratory to
# guess. Renaming the levels is NOT the fix: level names are load-bearing on
# every credential already issued.
#
# READ THIS FIRST. RP-20's "Proficient" is THIS SYSTEM'S L3 Competent. It is
# NOT this system's L4, which is also called Proficient. The word denotes a
# different rung in each document. A manager mapping their existing Proficient
# staff onto the same word here promotes every one of them by a rung — and that
# rung is not nominal: L4 costs 200 hours, 180 days, a capstone, a work
# product, double scoring and two signers who hold L5 in the same element.
# This is the single most likely adoption error and it is silent.
#
#   NCSLI RP-20 (2010) — staff KSA matrix, three values, per parameter
#     Trained     -> L1 Novice / L2 Advanced Beginner
#     Proficient  -> L3 Competent          <-- NOT L4
#     SME         -> L5 Expert             (see the L5 note below)
#
#   NCSLI RP-17 (2007) — four-rung authorization ladder, per parameter,
#   ascending, where a higher rung subsumes the lower ones
#     Perform Under Supervision -> L1 / L2
#     Qualified to Perform      -> L3 Competent
#     Qualified to Train        -> no clean equivalent; see below
#     Authorized Signatory      -> NOT A LEVEL IN THIS SYSTEM
#
# Two deliberate departures, declared rather than silent:
#
#   1. Authorized Signatory is not a rung here. RP-17 places it at the top of
#      its ladder and treats it as subsuming every activity for that parameter
#      — that is, it ranks a PERMISSION as a qualification. This system holds
#      the opposite (rule 6): competence is what a person can do, authority is
#      what a laboratory permits them to do, it is granted for a named scope
#      and it ends on departure. `approved-signatory` is therefore an
#      authority-overlay role, not a level. The divergence is intentional and
#      this system's position is the one to defend.
#
#   2. Qualified to Train sits one rung above independent performance in
#      RP-17, and RP-20 likewise reaches SME from Proficient in a single step.
#      This system puts the mentoring requirement at L5 only — two rungs above
#      L3 — and gates it behind 1000 hours, 365 days and a cross-organizational
#      signature. That is a real divergence from both documents and it is NOT
#      yet resolved: it is why `senior-metrology-technician` and
#      `metrology-trainer` currently carry role targets that do not reach the
#      level their own `authorities` entries describe. Open, and the crosswalk
#      records it rather than papering over it.
#
# The unit of record also differs and no aggregation exists. Both NCSLI scales
# are per MEASUREMENT PARAMETER on the laboratory's scope — torque, mass,
# temperature — and this system records per ELEMENT (`assessedAt: element`).
# A laboratory answering "is this person qualified for our temperature scope"
# needs a mapping the corpus does not currently provide. Anything scope-facing
# built later has to close that, and RP-20's matrix is the layout to target.
#
# Sources are registered: NCSLI-RP-17-2007, NCSLI-RP-20-2010, NCSLI-LM-13-2012,
# NCSLI-LM-14-2010. Cited, never quoted — all four are blockedPendingCounsel.
#
# PROVISIONAL: the experience-hour thresholds and waiting periods below are a
# steward judgement that has never been tested against a real career history.
# They are the numbers most likely to move once practicing metrologists review
# them, and they are blocked on that review with no timetable. Treat them as a
# starting position, not a settled requirement — and note that every credential
# pins the policy in force when it was issued (assessmentPolicyRef, decision
# 46), so revising them later does not silently rewrite what anybody earned.
#
# EDUCATION AND PRIOR CERTIFICATION ARE DELIBERATELY NOT INPUTS — declared
# 2026-09-03, because an undeclared exclusion reads as an oversight.
#
# The profession treats formal education as SUBSTITUTABLE for experience.
# NCSLI RP-17 (2007) 4.2.1 establishes knowledge of basic metrological concepts
# through educational background OR through demonstrated proficiency testing,
# at management's discretion; LM-14 (2010) sets out both routes and says years
# of industrial experience may be substituted for the maths and physics
# background, and the reverse. LM-13 (2012) makes establishing educational
# requirements part of a manager's job. This ladder has no field for any of it,
# and that is a choice.
#
# The reason: this system attests DEMONSTRATED COMPETENCE, not credentials. A
# degree is evidence that someone was taught, which is the same distinction
# rule 9 draws for training — teaching is not proving. Admitting education as a
# route would also gate entry by ability to pay for it, against the first
# principle in CLAUDE.md.
#
# What that costs, stated honestly: a person arriving with an AAS in metrology
# or a BSc holds knowledge the profession recognizes, and this system will make
# them demonstrate it. That is friction, and it is accepted deliberately —
# assessment is open-resource and unproctored, so demonstrating what you
# already know is cheap, and the alternative is a credential that rests on
# something nobody checked. The failure to avoid is somebody recording hours
# that were not worked in order to smuggle a qualification in; hours are the
# one experience field that IS checked, and corrupting it is worse than
# omitting the education.
#
# Breadth is a separate matter and IS modelled: see minDistinctActivities at
# L4 and L5. Hours measure duration, and LM-14's "progressively more complex
# assignments" is a claim about range.

schemaVersion: 1

levels:
  - level: 1
    name: Novice
    descriptor: >-
      Recognizes the concept and can apply it by following a rule that someone
      else supplied, in a situation someone else framed. Depends on explicit
      instruction and does not yet distinguish the cases where the rule stops
      holding.
    assessedAt: element
    assessment:
      modality:
        - open-resource-parameterized
        - challenge-exam
      requiresCapstone: false
      minExperienceHours: 0
      minDaysSincePreviousLevel: 0
    signoff:
      signerCount: 1
      # Null deliberately: a witness attests that they saw the work, which does
      # not require them to be more expert than the candidate.
      #
      # THIS IS A DECLARED DEPARTURE FROM THE PROFESSION, not an oversight.
      # NCSLI RP-17 (2007) requires the witness to a satisfactory demonstration
      # to be a qualified individual possessing expertise in the specific
      # measurement area, and even its lowest rung — Perform Under Supervision —
      # presupposes a competent supervising person. This system does not require
      # that at L1 or L2, and the reason is the first principle in CLAUDE.md:
      # nothing gates entry. Requiring a witness who already holds a level would
      # make L1 unreachable for a person with no employer and no professional
      # network, which is precisely the person the Personal edition exists for.
      #
      # The distinction RP-17 carries in the witness requirement is carried
      # HERE by provenanceTier instead, and it is machine-checked offline:
      # `highestSupportedTier` returns `self-study` whenever no signer has
      # evidenced standing, and `checkProvenanceTier` refuses a credential that
      # claims more than its signers can show. So an L1 witnessed by somebody
      # with no standing and an L1 witnessed by a competent practitioner are NOT
      # indistinguishable — the first cannot rise above `self-study`, and a
      # reader sees which they are holding. Two candidates who hold nothing may
      # witness each other; both results are `self-study`, which asserts only
      # that somebody who was not the subject saw the work, and that is the
      # honest floor rather than a loophole.
      #
      # From L3 the requirement appears, because that is where independent work
      # is entrusted and the signer judges quality rather than merely observing.
      witnessMustHoldLevel: null

  - level: 2
    name: Advanced Beginner
    descriptor: >-
      Applies the concept to familiar situations without step-by-step
      direction, and recognizes when a situation is NOT the familiar one — but
      escalates at that point rather than resolving it independently.
    assessedAt: element
    assessment:
      modality:
        - open-resource-parameterized
        - challenge-exam
      requiresCapstone: false
      minExperienceHours: 0
      minDaysSincePreviousLevel: 0
    signoff:
      signerCount: 1
      # Null for the same declared reason as L1 — see the note there. RP-17
      # would require a witness with expertise in the measurement area; this
      # system carries that distinction in provenanceTier rather than in a
      # level gate, so that entry stays open.
      witnessMustHoldLevel: null

  - level: 3
    name: Competent
    descriptor: >-
      Works unsupervised on routine cases and produces a defensible result,
      including in situations not seen before. Recognizes the limits of their
      own competence and can say what would change their approach. This is the
      level at which independent laboratory work is normally entrusted.
    assessedAt: element
    assessment:
      modality:
        - open-resource-parameterized
        - challenge-exam
        - witnessed-proficiency-test
      # witnessed-proficiency-test added 2026-08-17. A satisfactory result in a
      # proficiency test or interlaboratory comparison for this measurement
      # area, witnessed and recorded. Admitted from L3 because that is where
      # independent work begins; L1 and L2 are witnessed observation of framed
      # work, and a PT result is neither framed nor observed. It is the only
      # modality whose comparison value the candidate's own laboratory did not
      # set, which is why an assessor asks for it first — NCSLI RP-17 (2007)
      # gives it its own line on the certification summary form, and RP-20
      # (2010) names interlaboratory comparison as demonstrated-competency
      # evaluation. Until this was added, a laboratory holding the profession's
      # strongest objective evidence for a person had to re-manufacture it as a
      # work product, which is a weaker claim: an internally produced
      # deliverable judged by a colleague, rather than a result compared against
      # a value the candidate's own laboratory did not choose.
      requiresCapstone: false
      # A real deliverable, archived and hashed — not an exam answer. From here
      # up, the evidence is work, not response.
      requiresWorkProduct: true
      minExperienceHours: 40
      minDaysSincePreviousLevel: 30
    signoff:
      signerCount: 1
      # From L3 the signer judges quality rather than merely observing, so they
      # must hold the level above the one being attested.
      witnessMustHoldLevel: 4
      requiresCredentialedReviewer: true
    defaultRecertificationMonths: 60

  - level: 4
    name: Proficient
    descriptor: >-
      Handles the non-routine case, and sees the situation as a whole rather
      than as a set of rules to apply in turn. Diagnoses why an approach is
      failing, adapts it, and defends the adaptation against a peer who is
      actively looking for its weaknesses.
    assessedAt: element
    assessment:
      modality:
        - reviewer-conducted-defense
        - capstone-with-review
        - witnessed-proficiency-test
      requiresCapstone: true
      requiresWorkProduct: true
      doubleScored: true
      minExperienceHours: 200
      minDistinctActivities: 3
      minDaysSincePreviousLevel: 180
    signoff:
      signerCount: 2
      witnessMustHoldLevel: 5
      requiresCredentialedReviewer: true
    defaultRecertificationMonths: 48

  - level: 5
    name: Expert
    descriptor: >-
      Advances the practice rather than only executing it: resolves cases where
      the established approach gives no answer, and can bring another person to
      competence in the same element. Expected to know where the field's own
      position is contested, and to hold a defensible view on it.
    assessedAt: element
    assessment:
      modality:
        - reviewer-conducted-defense
        - capstone-with-review
        - witnessed-proficiency-test
      requiresCapstone: true
      requiresWorkProduct: true
      # At expert level the field's judgement is that you have not mastered
      # something until you can bring someone else to competence in it.
      requiresMentoring: true
      doubleScored: true
      minExperienceHours: 1000
      minDistinctActivities: 5
      minDaysSincePreviousLevel: 365
    signoff:
      signerCount: 2
      # Cannot escalate past 5; the additional rigour at this level comes from
      # the cross-organizational requirement instead.
      witnessMustHoldLevel: 5
      requiresCredentialedReviewer: true
      # Prevents a closed group from certifying its own experts.
      requiresCrossOrganizational: true
    defaultRecertificationMonths: 36
