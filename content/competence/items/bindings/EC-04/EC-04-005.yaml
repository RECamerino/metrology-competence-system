# The first binding outside CM-03, and the first to an element whose
# demonstration route is `equipment`. See ARC-0005 for why neither existed
# before: the item bank had no shape for work that is watched rather than
# submitted, so the corpus's equipment-route elements could not be bound at all.

schemaVersion: 1
element: EC-04-005

bindings:
  - level: 1
    archetype: ARC-0005
    status: draft
    justification: >-
      At L1 the method is stated, the load is supplied and the positions are
      marked, so nothing is left for the candidate to decide and the item is
      about execution: placing by the centre of gravity, letting the indication
      settle, and recording each reading against the position it belongs to.
      Method 1 is fixed here because it does not tare — the zero-device
      requirement belongs to L2, and loading it onto L1 would fail a candidate
      for missing a precondition nobody had yet asked them to understand.
    parameterRanges:
      - name: stated_method
        choices:
          - "method 1 — zero, then move the load between positions"
      - name: drift_present
        choices: [false]
      - name: dual_purpose
        choices: [false]

  - level: 2
    archetype: ARC-0005
    status: draft
    justification: >-
      L2 fixes the method to one of the taring variants, which is what makes the
      zero-setting and zero-tracking requirement bite: those are the two methods
      it attaches to, and a candidate who does not switch the devices off
      produces the plausible small uniform result the witness exists to catch.
      Method 4 additionally forces the pairing question — each off-centre
      indication has its own centre reading — so a candidate who collapses them
      into one shared value is caught on arithmetic rather than on observation.
      `dual_purpose` varies, so the calibrated-weight requirement is live
      without being announced.
    parameterRanges:
      - name: stated_method
        choices:
          - "method 2 — tare at the centre, then move the load"
          - "method 4 — return to the centre between positions"
      - name: drift_present
        choices: [false]
      - name: dual_purpose
        choices: [true, false]

  - level: 3
    archetype: ARC-0005
    status: draft
    justification: >-
      L3 states no method, which is the whole difference: the candidate has to
      notice how the instrument in front of them behaves and choose accordingly.
      `drift_present` varies across the draw, so neither answer is safe — an
      interleaved method chosen on a stable instrument is defensible and costs
      only time, while a non-interleaved one chosen on a drifting instrument
      reports an eccentricity that is partly a clock. The receptor shape varies
      too, so the position pattern has to be adapted rather than recited, and
      `dual_purpose` decides whether the test load must be a calibrated weight.
      What separates a pass from a fail at this level is the recorded reasoning,
      not the choice: a candidate who starts on method 1, observes the drift,
      stops and restarts has demonstrated more than one who guessed right.
    parameterRanges:
      - name: stated_method
        choices:
          - "not stated — select the method and record why before you begin"
      - name: instrument_class
        choices:
          - top-loading balance with a rectangular receptor
          - analytical balance with a small round pan
          - platform scale with a large rectangular deck
      - name: drift_present
        choices: [true, false]
      - name: dual_purpose
        choices: [true, false]
