# ARC-0005 — Witnessed measurement-method test on a weighing instrument
#
# THE FIRST WITNESSED ARCHETYPE, AND THE FIRST OUTSIDE CM-03. It exists because
# authoring EC-04-005 and trying to bind it found that the item bank could not
# express an assessment for an element whose demonstration route is `equipment`
# at all: every itemType was a desk item served as a prompt, `lookupResistance`
# was required of all of them, and the corpus's equipment-route elements
# consequently had zero bindings between them.
#
# IT WAS WRITTEN FOR ONE TEST AND WIDENED TO A FAMILY. Authoring EC-04-004 next
# to it showed that eccentricity and repeatability are the same shape — the same
# instrument, the same bench, the same test-load provision, and failures that are
# invisible in the record either way. cg-18 groups them itself, under measurement
# methods. An axis with 2732 equipment elements cannot afford one archetype per
# test.
#
# EC-04-007 then bound to it with NO change to this file or to any schema, which
# is the evidence the widening was sound rather than convenient. A shape that
# has to be adjusted for every new member was not a family shape.
#
# Widening cost something, and it is worth knowing what: `witnessRequirement`
# below can now only state what EVERY test in the family requires. What a witness
# must see for a PARTICULAR test is a property of the procedure, and the binding
# is where the procedure is chosen — so the binding carries the other half.

id: ARC-0005
title: Witnessed measurement-method test on a weighing instrument
itemType: witnessed-performance
kinds:
  - skill
levels: [1, 2, 3]
status: draft

prompt: >-
  A {{instrument_class}} is set up on the bench, with a test load available to
  you. Test to perform: {{test}}. Procedure: {{stated_procedure}}.

  Carry out the test, record the indications, and produce the result the test
  calls for. Hand over the record you would put in front of a reviewer.

  Where the procedure is not stated, select it and record why before you begin.
  State anything you decided about the test load, the number of readings or the
  positions that the record itself would not show.

parameters:
  - name: instrument_class
    type: choice
    description: >-
      The instrument provided — a top-loading balance with a rectangular
      receptor, an analytical balance with a small round pan, a platform scale.
      Decides what the candidate has to adapt to, which is part of the
      competence rather than decoration.
  - name: test
    type: choice
    description: >-
      Which of cg-18's measurement methods is being performed. THE BINDING SETS
      THIS, and it is what ties the item to its element: repeatability for
      EC-04-004, eccentricity for EC-04-005, errors of indication for EC-04-007.
      All three are authored and bound, which is the evidence that the widening
      was sound — the third took no schema change at all.
  - name: stated_procedure
    type: choice
    description: >-
      What the candidate is told and what is left to them — the procedural
      variant for an eccentricity test, the load and number of depositions for a
      repeatability test, or that the choice is theirs. The main difficulty knob:
      stated makes the item about execution, unstated makes it about selecting
      against the instrument in front of them.
  - name: confounder
    type: choice
    # Never rendered. Naming the thing the candidate is supposed to notice is
    # the whole competence at the top level of every element in this family.
    visibility: generator
    description: >-
      The property of the instrument or the setup that the candidate has to
      notice and respond to — drift across the duration of an eccentricity test,
      a multiple-range instrument whose smallest scale interval is not in the
      largest range, a test load that would push a repeatability test over the
      threshold where fewer depositions are permitted.
    constraint: >-
      Must be a confounder the bound element actually concerns, and must be
      reachable by the procedure the binding leaves open. A binding that sets a
      confounder the candidate has no authority to respond to is testing
      helplessness.
  - name: dual_purpose
    type: choice
    # Never rendered. Saying the indications will also determine errors of
    # indication announces that the test load has to be a calibrated weight.
    visibility: generator
    description: >-
      Whether the same indications will also be used to determine the errors of
      indication. cg-18 attaches the identical provision to every test in this
      family: the test load need not be calibrated UNLESS it does, at which
      point it becomes a reference value. The requirement most often missed,
      because the combination saves a loading.

scoring:
  method: rubric
  rubricRef: content/competence/items/rubrics/ARC-0005.md

witnessRequirement: >-
  Three things are true of every test in this family, and not one of them
  survives into the record. Whether the load was actually MANIPULATED as the
  method requires — lifted clear and deposited again, or moved between positions
  — rather than the display being read repeatedly while it sat where it was; the
  handed-over table is identical either way and its scatter is smaller than the
  truth. Whether the instrument's automatic zero aids were configured as the
  method requires BEFORE the first reading, which is decided in the seconds
  before the test starts and cannot be recovered from the numbers afterwards.
  And whether the handling was genuinely held constant across the readings —
  placement, speed, and the interval before each reading — since every variation
  is reported as though it belonged to the instrument. What a witness must see
  for a PARTICULAR test is a property of that procedure and is stated on the
  binding.

citations:
  - source: EURAMET-CG-18
    clause: "5.1"
    relevance: >-
      The repeatability test — repeated deposition under identical handling, the
      number of depositions, and the zero check between them.
  - source: EURAMET-CG-18
    clause: "5.2"
    relevance: >-
      The test for errors of indication — the distribution of test loads, the
      four loading sequences, and the requirement that the loads be standard
      weights, which is the provision the other two tests defer to.
  - source: EURAMET-CG-18
    clause: "5.3"
    relevance: >-
      The eccentricity test — positions, load size, the four procedural
      variants, and the zero-device requirement attached to two of them.

# Higher than a desk archetype's, deliberately. Exposure control exists because
# a candidate who has seen a desk item before has an advantage on it; nobody
# gains an advantage on depositing a weight correctly from having been told what
# the task is. The integrity here is carried by the witness, not by novelty.
exposureLimit: 12

authoring:
  createdOn: "2026-09-05"
