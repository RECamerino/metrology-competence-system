schemaVersion: 1
domains:
  - id: DP-15
    title: Ionising Radiation, Dosimetry and Nuclear Instrumentation
    kind: discipline
    status: draft
    summary: >-
      Measurement of ionising radiation and the dose it delivers. Unusual in
      that the measurand of greatest interest — absorbed dose in tissue — is
      often not directly measurable, so the discipline is built on carefully
      justified chains of conversion. Counting statistics also give it a
      distinctive uncertainty treatment. Boundary: radiation safety practice is
      CM-22-A04.

    competencyAreas:

      - id: DP-15-A01
        title: Radiation Physics and Quantities
        status: draft
        elements:
          - { id: DP-15-001, title: "Types of ionising radiation and their interactions", levelCeiling: 4, status: draft }
          - { id: DP-15-002, title: "Activity, decay and half-life", levelCeiling: 4, status: draft }
          - { id: DP-15-003, title: "Fluence, kerma and absorbed dose", levelCeiling: 4, status: draft }
          - { id: DP-15-004, title: "Equivalent dose, effective dose and radiation weighting", levelCeiling: 4, status: draft }
          - { id: DP-15-005, title: "Operational quantities for radiation protection", levelCeiling: 4, status: draft }
          - { id: DP-15-006, title: "Charged particle equilibrium and cavity theory", levelCeiling: 5, status: draft }
          - { id: DP-15-007, title: "Stopping power, attenuation and build-up", levelCeiling: 4, status: draft }
          - { id: DP-15-008, title: "Why absorbed dose in tissue is usually inferred rather than measured", levelCeiling: 5, status: draft }

      - id: DP-15-A02
        title: Detectors and Instrumentation
        status: draft
        elements:
