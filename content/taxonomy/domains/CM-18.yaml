schemaVersion: 1
domains:
  - id: CM-18
    title: Project, Programme and Business Management
    kind: core
    status: draft
    summary: >-
      Running measurement work as a managed activity, and making the case for it
      in terms an organization acts on. Included because the ceiling on most
      metrology careers is commercial and organisational rather than technical.
      Boundary: quality management systems are CM-10; people development is
      CM-17.

    competencyAreas:

      - id: CM-18-A01
        title: Project Management Fundamentals
        status: draft
        elements:
          - { id: CM-18-001, title: "Defining scope, deliverables and acceptance criteria", levelCeiling: 4, status: draft }
          - { id: CM-18-002, title: "Work breakdown and estimation", levelCeiling: 4, status: draft }
          - { id: CM-18-003, title: "Scheduling, dependencies and critical path", levelCeiling: 4, status: draft }
          - { id: CM-18-004, title: "Resource planning and allocation", levelCeiling: 4, status: draft }
          - { id: CM-18-005, title: "Risk identification, assessment and mitigation", levelCeiling: 5, status: draft }
          - { id: CM-18-006, title: "Progress tracking and honest status reporting", levelCeiling: 4, status: draft }
          - { id: CM-18-007, title: "Change control and scope management", levelCeiling: 4, status: draft }
          - { id: CM-18-008, title: "Project closure and lessons learned", levelCeiling: 4, status: draft }
          - { id: CM-18-009, title: "Iterative and adaptive delivery approaches", levelCeiling: 4, status: draft }

      - id: CM-18-A02
        title: The Business Case for Measurement
        status: draft
        summary: >-
          The competence that most often determines whether a metrology function
          is funded or cut.
        elements:
          - { id: CM-18-010, title: "Cost of poor measurement quantified", levelCeiling: 5, status: draft }
          - { id: CM-18-011, title: "Cost of quality and the economics of prevention", levelCeiling: 5, status: draft }
          - { id: CM-18-012, title: "Building a capital business case for measurement capability", levelCeiling: 5, status: draft }
          - { id: CM-18-013, title: "Return on investment, payback and total cost of ownership", levelCeiling: 4, status: draft }
          - { id: CM-18-014, title: "Make or buy analysis for calibration capability", levelCeiling: 5, status: draft }
          - { id: CM-18-015, title: "Quantifying the value of reduced measurement uncertainty", levelCeiling: 5, status: draft }
          - { id: CM-18-016, title: "Presenting a technical case in financial terms", levelCeiling: 5, status: draft }
          - { id: CM-18-017, title: "Defending a metrology budget under pressure", levelCeiling: 5, status: draft }

