schemaVersion: 1
domains:
  - id: CM-18
    title: Project, Programme and Business Management
    kind: core
    status: draft
    summary: >-
      Running measurement work as a managed activity, and making the case for it
      in terms an organization acts on. Included because the ceiling on most
      metrology careers is commercial and organisational rather than technical.
      Boundary: quality management systems are CM-10; people development is
      CM-17.

    competencyAreas:

      - id: CM-18-A01
        title: Project Management Fundamentals
        status: draft
        elements:
          - { id: CM-18-001, title: "Defining scope, deliverables and acceptance criteria", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-18-002, title: "Work breakdown and estimation", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-18-003, title: "Scheduling, dependencies and critical path", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-18-004, title: "Resource planning and allocation", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-18-005, title: "Risk identification, assessment and mitigation", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-18-006, title: "Progress tracking and honest status reporting", kind: judgment, levelCeiling: 3, status: draft }
          - { id: CM-18-007, title: "Change control and scope management", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-18-008, title: "Project closure and lessons learned", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-18-009, title: "Iterative and adaptive delivery approaches", kind: knowledge, levelCeiling: 3, status: draft }

      - id: CM-18-A02
        title: The Business Case for Measurement
        status: draft
        summary: >-
          The competence that most often determines whether a metrology function
          is funded or cut.
        elements:
          - { id: CM-18-010, title: "Cost of poor measurement quantified", kind: judgment, levelCeiling: 5, status: draft }
          - { id: CM-18-011, title: "Cost of quality and the economics of prevention", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-18-012, title: "Building a capital business case for measurement capability", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-18-013, title: "Return on investment, payback and total cost of ownership", kind: skill, levelCeiling: 3, status: draft }
          - { id: CM-18-014, title: "Make or buy analysis for calibration capability", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-18-015, title: "Quantifying the value of reduced measurement uncertainty", kind: judgment, levelCeiling: 4, status: draft }
          - { id: CM-18-016, title: "Presenting a technical case in financial terms", kind: skill, levelCeiling: 4, status: draft }
          - { id: CM-18-017, title: "Defending a metrology budget under pressure", kind: judgment, levelCeiling: 5, status: draft }

