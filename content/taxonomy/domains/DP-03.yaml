schemaVersion: 1
domains:
  - id: DP-03
    title: Pressure, Vacuum, Density and Viscosity
    kind: discipline
    status: draft
    summary: >-
      Pressure and vacuum span roughly eighteen decades, more than any other
      common measurand, and no single technique covers them. Density and
      viscosity are grouped here because they share fluid-property apparatus and
      because density enters pressure and mass work as a correction.

    competencyAreas:

      - id: DP-03-A01
        title: Pressure Fundamentals and Realisation
        status: draft
        elements:
          - { id: DP-03-001, title: "Pressure definitions: absolute, gauge, differential, sealed gauge", levelCeiling: 3, status: draft }
          - { id: DP-03-002, title: "Pressure units and conversion pitfalls", levelCeiling: 3, status: draft }
          - { id: DP-03-003, title: "Liquid column manometers as primary standards", levelCeiling: 4, status: draft }
          - { id: DP-03-004, title: "Mercury and water column corrections", levelCeiling: 4, status: draft }
          - { id: DP-03-005, title: "Piston gauges and pressure balances", levelCeiling: 4, status: draft }
          - { id: DP-03-006, title: "Effective area and its determination", levelCeiling: 5, status: draft }
          - { id: DP-03-007, title: "Pressure distortion coefficient", levelCeiling: 4, status: draft }
          - { id: DP-03-008, title: "Head correction, fluid density and reference level", levelCeiling: 4, status: draft }
          - { id: DP-03-009, title: "Local gravity in pressure realisation", levelCeiling: 4, status: draft }
          - { id: DP-03-010, title: "Cross-floating technique", levelCeiling: 4, status: draft }
          - { id: DP-03-011, title: "Uncertainty budget for pressure balance calibration", levelCeiling: 5, status: draft }

      - id: DP-03-A02
