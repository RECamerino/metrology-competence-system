schemaVersion: 1
domains:
  - id: DP-05
    title: Temperature and Thermophysical Properties
    kind: discipline
    status: draft
    summary: >-
      Thermometry, the international temperature scale, and the thermal
      properties of materials. A discipline where the difference between the
      thermodynamic temperature and its practical realisation is a live
      technical issue rather than a footnote, and where the sensor almost always
      perturbs what it measures.

    competencyAreas:

      - id: DP-05-A01
        title: Temperature Scales and Realisation
        status: draft
        elements:
          - { id: DP-05-001, title: "Thermodynamic temperature and the Boltzmann constant definition", levelCeiling: 5, status: draft }
          - { id: DP-05-002, title: "ITS-90 structure and defining fixed points", levelCeiling: 5, status: draft }
          - { id: DP-05-003, title: "Interpolating instruments and sub-ranges of ITS-90", levelCeiling: 4, status: draft }
          - { id: DP-05-004, title: "Differences between ITS-90 and thermodynamic temperature", levelCeiling: 4, status: draft }
          - { id: DP-05-005, title: "PLTS-2000 and low temperature scales", levelCeiling: 4, status: draft }
          - { id: DP-05-006, title: "Fixed point cells: construction, realisation and maintenance", levelCeiling: 4, status: draft }
          - { id: DP-05-007, title: "Triple point of water cells and their care", levelCeiling: 4, status: draft }
          - { id: DP-05-008, title: "Freezing and melting plateaux and their interpretation", levelCeiling: 4, status: draft }
          - { id: DP-05-009, title: "Primary thermometry methods", levelCeiling: 4, status: draft }
          - { id: DP-05-010, title: "Temperature units, scales and conversion between them", levelCeiling: 3, status: draft }

      - id: DP-05-A02
        title: Contact Thermometry
        status: draft
        elements:
          - { id: DP-05-011, title: "Standard platinum resistance thermometers", levelCeiling: 5, status: draft }
          - { id: DP-05-012, title: "Industrial platinum resistance thermometers", levelCeiling: 4, status: draft }
          - { id: DP-05-013, title: "Resistance measurement bridges and their use in thermometry", levelCeiling: 4, status: draft }
          - { id: DP-05-014, title: "Self-heating and its correction", levelCeiling: 4, status: draft }
          - { id: DP-05-015, title: "Lead resistance, three-wire and four-wire connection", levelCeiling: 4, status: draft }
          - { id: DP-05-016, title: "Thermocouple types, principles and Seebeck effect", levelCeiling: 4, status: draft }
          - { id: DP-05-017, title: "Reference junction compensation", levelCeiling: 4, status: draft }
          - { id: DP-05-018, title: "Thermocouple inhomogeneity and drift", levelCeiling: 4, status: draft }
          - { id: DP-05-019, title: "Thermocouple calibration methods", levelCeiling: 4, status: draft }
          - { id: DP-05-020, title: "Thermistors and semiconductor sensors", levelCeiling: 4, status: draft }
          - { id: DP-05-021, title: "Liquid-in-glass thermometers and their calibration", levelCeiling: 4, status: draft }
          - { id: DP-05-022, title: "Immersion depth, stem conduction and thermal contact", levelCeiling: 4, status: draft }
          - { id: DP-05-023, title: "Calibration baths, furnaces and dry blocks", levelCeiling: 4, status: draft }
          - { id: DP-05-024, title: "Comparison calibration technique and uniformity assessment", levelCeiling: 4, status: draft }
