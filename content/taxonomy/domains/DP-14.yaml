          - { id: DP-14-043, title: "Precision Time Protocol and hardware timestamping", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-14-044, title: "Timing in telecommunications and synchronisation networks", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-14-045, title: "Timing for power grids and synchrophasors", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-14-046, title: "Timing in financial transaction records and regulatory traceability", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-14-047, title: "Timing for scientific instrumentation and data acquisition", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-14-048, title: "Demonstrating traceability of a timestamp", kind: judgment, levelCeiling: 5, status: draft }
