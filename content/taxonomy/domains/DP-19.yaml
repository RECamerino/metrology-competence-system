          - { id: DP-19-031, title: "Automated inspection cells and robot-mounted metrology", levelCeiling: 5, status: draft }
          - { id: DP-19-032, title: "Machine vision inspection systems", levelCeiling: 4, status: draft }
          - { id: DP-19-033, title: "Sampling plans and inspection frequency", levelCeiling: 5, status: draft }
          - { id: DP-19-034, title: "Fixturing, repeatability and part presentation", levelCeiling: 4, status: draft }
          - { id: DP-19-035, title: "Traceability and identification through a production process", levelCeiling: 4, status: draft }
