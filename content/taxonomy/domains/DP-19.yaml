schemaVersion: 1
domains:
  - id: DP-19
    title: Additive Manufacturing and Advanced Production Metrology
    kind: discipline
    status: draft
    summary: >-
      Measurement for production processes that conventional inspection was not
      designed for: additively manufactured parts with internal geometry no
      probe can reach, in-process monitoring, and closed-loop production
      control. Boundary: the dimensional techniques themselves are DP-01; this
      domain is their application where the part or the process breaks the
      usual assumptions.

    competencyAreas:

      - id: DP-19-A01
        title: Additive Manufacturing Measurement
        status: draft
        elements:
          - { id: DP-19-001, title: "Additive processes and their measurement implications", levelCeiling: 4, status: draft }
          - { id: DP-19-002, title: "Why additive parts defeat conventional inspection", levelCeiling: 5, status: draft }
          - { id: DP-19-003, title: "Internal geometry and inaccessible feature measurement", levelCeiling: 5, status: draft }
          - { id: DP-19-004, title: "Computed tomography for additive part inspection", levelCeiling: 5, status: draft }
          - { id: DP-19-005, title: "CT calibration, artefacts and dimensional traceability", levelCeiling: 5, status: draft }
          - { id: DP-19-006, title: "Surface texture of as-built additive surfaces", levelCeiling: 5, status: draft }
          - { id: DP-19-007, title: "Porosity, density and defect characterisation", levelCeiling: 5, status: draft }
          - { id: DP-19-008, title: "Residual stress measurement in additive parts", levelCeiling: 5, status: draft }
          - { id: DP-19-009, title: "Distortion, warping and datum instability", levelCeiling: 5, status: draft }
          - { id: DP-19-010, title: "Test artefacts and machine qualification for additive processes", levelCeiling: 5, status: draft }
          - { id: DP-19-011, title: "Feedstock powder characterisation", levelCeiling: 4, status: draft }
          - { id: DP-19-012, title: "Qualification of additive parts for critical applications", levelCeiling: 5, status: draft }

      - id: DP-19-A02
        title: In-Process and In-Line Measurement
        status: draft
        elements:
          - { id: DP-19-013, title: "In-process monitoring principles and their limits", levelCeiling: 5, status: draft }
          - { id: DP-19-014, title: "Melt pool and thermal monitoring", levelCeiling: 5, status: draft }
          - { id: DP-19-015, title: "Layer-wise optical inspection", levelCeiling: 5, status: draft }
          - { id: DP-19-016, title: "Traceability of an in-process measurement", levelCeiling: 5, status: draft }
          - { id: DP-19-017, title: "In-line dimensional measurement in production", levelCeiling: 4, status: draft }
          - { id: DP-19-018, title: "On-machine probing and machine tool measurement", levelCeiling: 5, status: draft }
          - { id: DP-19-019, title: "Relating in-process signals to part quality", levelCeiling: 5, status: draft }
          - { id: DP-19-020, title: "Measurement-driven process control and closed loop correction", levelCeiling: 5, status: draft }

      - id: DP-19-A03
        title: Advanced Materials and Joining
        status: draft
        elements:
          - { id: DP-19-021, title: "Composite material inspection and defect detection", levelCeiling: 4, status: draft }
          - { id: DP-19-022, title: "Adhesive and bonded joint evaluation", levelCeiling: 4, status: draft }
          - { id: DP-19-023, title: "Weld inspection and measurement", levelCeiling: 4, status: draft }
          - { id: DP-19-024, title: "Coating thickness measurement", levelCeiling: 4, status: draft }
          - { id: DP-19-025, title: "Non-destructive testing methods and their measurement basis", levelCeiling: 4, status: draft }
          - { id: DP-19-026, title: "Ultrasonic thickness and flaw measurement", levelCeiling: 4, status: draft }
          - { id: DP-19-027, title: "Eddy current and electromagnetic inspection", levelCeiling: 4, status: draft }
          - { id: DP-19-028, title: "Mechanical property testing and its measurement uncertainty", levelCeiling: 4, status: draft }

      - id: DP-19-A04
