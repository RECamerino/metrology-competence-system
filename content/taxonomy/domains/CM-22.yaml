schemaVersion: 1
domains:
  - id: CM-22
    title: Human Factors, Safety and Risk
    kind: core
    status: draft
    summary: >-
      The person in the measurement loop, and the hazards of the work itself.
      Human factors are included because operator effects are a genuine
      uncertainty source that budgets routinely under-represent, and because a
      metrologist who is injured or fatigued measures badly. Boundary:
      measurement decision risk is CM-08; management-system risk is CM-10.

    competencyAreas:

      - id: CM-22-A01
        title: Human Performance in Measurement
        status: draft
        elements:
          - { id: CM-22-001, title: "The operator as a component of the measurement system", levelCeiling: 4, status: draft }
          - { id: CM-22-002, title: "Perception, reading error and parallax", levelCeiling: 3, status: draft }
          - { id: CM-22-003, title: "Attention, vigilance and repetitive task degradation", levelCeiling: 4, status: draft }
          - { id: CM-22-004, title: "Fatigue, shift work and circadian effects on performance", levelCeiling: 4, status: draft }
          - { id: CM-22-005, title: "Expectation bias and reading what you expect to see", levelCeiling: 5, status: draft }
          - { id: CM-22-006, title: "Anchoring, rounding habits and digit preference", levelCeiling: 4, status: draft }
          - { id: CM-22-007, title: "Blinding and masking to control observer bias", levelCeiling: 4, status: draft }
          - { id: CM-22-008, title: "Quantifying operator contribution to uncertainty", levelCeiling: 5, status: draft }

      - id: CM-22-A02
        title: Error, Violation and System Design
        status: draft
        elements:
          - { id: CM-22-009, title: "Slips, lapses, mistakes and violations distinguished", levelCeiling: 4, status: draft }
          - { id: CM-22-010, title: "Latent conditions and the systemic origin of human error", levelCeiling: 5, status: draft }
          - { id: CM-22-011, title: "Error-tolerant procedure and interface design", levelCeiling: 4, status: draft }
          - { id: CM-22-012, title: "Checklists, independent verification and double-checking", levelCeiling: 4, status: draft }
          - { id: CM-22-013, title: "Automation surprise and mode confusion", levelCeiling: 4, status: draft }
          - { id: CM-22-014, title: "Just culture and reporting without blame", levelCeiling: 4, status: draft }
          - { id: CM-22-015, title: "Investigating an error without stopping at operator fault", levelCeiling: 4, status: draft }
          - { id: CM-22-016, title: "Workload, time pressure and their effect on measurement quality", levelCeiling: 4, status: draft }

      - id: CM-22-A03
        title: Ergonomics and the Working Environment
        status: draft
        elements:
          - { id: CM-22-017, title: "Workstation design for precision manual tasks", levelCeiling: 3, status: draft }
          - { id: CM-22-018, title: "Lighting, magnification and visual ergonomics", levelCeiling: 3, status: draft }
          - { id: CM-22-019, title: "Manual handling of heavy standards and artefacts", levelCeiling: 3, status: draft }
          - { id: CM-22-020, title: "Repetitive strain and long-duration measurement tasks", levelCeiling: 3, status: draft }
          - { id: CM-22-021, title: "Display, alarm and interface design in the laboratory", levelCeiling: 4, status: draft }
          - { id: CM-22-022, title: "Accessibility and inclusive laboratory design", levelCeiling: 4, status: draft }

      - id: CM-22-A04
        title: Laboratory Safety
        status: draft
        elements:
          - { id: CM-22-023, title: "Hazard identification and risk assessment for measurement work", levelCeiling: 4, status: draft }
          - { id: CM-22-024, title: "Electrical safety and high voltage work", levelCeiling: 4, status: draft }
          - { id: CM-22-025, title: "Pressure, vacuum and stored energy hazards", levelCeiling: 4, status: draft }
          - { id: CM-22-026, title: "Mechanical, lifting and crush hazards", levelCeiling: 4, status: draft }
          - { id: CM-22-027, title: "Chemical hazards and safe handling", levelCeiling: 4, status: draft }
          - { id: CM-22-028, title: "Laser and optical radiation safety", levelCeiling: 4, status: draft }
          - { id: CM-22-029, title: "Ionising radiation safety and dose control", levelCeiling: 4, status: draft }
          - { id: CM-22-030, title: "Cryogenic, thermal and asphyxiation hazards", levelCeiling: 4, status: draft }
          - { id: CM-22-031, title: "Magnetic field and RF exposure hazards", levelCeiling: 4, status: draft }
          - { id: CM-22-032, title: "Permit to work, isolation and lockout", levelCeiling: 4, status: draft }
          - { id: CM-22-033, title: "Emergency response and incident reporting", levelCeiling: 3, status: draft }
          - { id: CM-22-034, title: "Safety on customer sites and in the field", levelCeiling: 4, status: draft }

      - id: CM-22-A05
        title: Teams, Culture and Wellbeing
        status: draft
        elements:
          - { id: CM-22-035, title: "Psychological safety and willingness to report a doubtful result", levelCeiling: 5, status: draft }
          - { id: CM-22-036, title: "Handover and communication between shifts and teams", levelCeiling: 4, status: draft }
          - { id: CM-22-037, title: "Speaking up across a hierarchy", levelCeiling: 4, status: draft }
