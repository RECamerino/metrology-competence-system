          - { id: CM-07-031, title: "Capability for non-normal processes", levelCeiling: 5, status: draft }
          - { id: CM-07-032, title: "The effect of measurement variation on an apparent capability", levelCeiling: 5, status: draft }
          - { id: CM-07-033, title: "Capability, tolerance and specification setting", levelCeiling: 5, status: draft }
          - { id: CM-07-034, title: "Short-run and small-sample capability estimation", levelCeiling: 5, status: draft }

      - id: CM-07-A06
        title: MSA in Regulated and Sector Contexts
        status: draft
        elements:
          - { id: CM-07-035, title: "Automotive sector expectations for MSA", levelCeiling: 4, status: draft }
          - { id: CM-07-036, title: "Aerospace and defence expectations", levelCeiling: 4, status: draft }
