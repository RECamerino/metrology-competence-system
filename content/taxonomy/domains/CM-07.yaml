          - { id: CM-07-025, title: "Attribute agreement analysis", levelCeiling: 4, status: draft }
          - { id: CM-07-026, title: "Kappa statistics and agreement measures", levelCeiling: 5, status: draft }
          - { id: CM-07-027, title: "Signal detection and the gray zone near a limit", levelCeiling: 5, status: draft }
          - { id: CM-07-028, title: "Visual inspection as a measurement system", levelCeiling: 4, status: draft }

      - id: CM-07-A05
