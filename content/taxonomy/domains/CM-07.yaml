          - { id: CM-07-025, title: "Attribute agreement analysis", levelCeiling: 4, status: draft }
          - { id: CM-07-026, title: "Kappa statistics and agreement measures", levelCeiling: 4, status: draft }
          - { id: CM-07-027, title: "Signal detection and the gray zone near a limit", levelCeiling: 4, status: draft }
