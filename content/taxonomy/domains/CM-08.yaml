schemaVersion: 1
domains:
  - id: CM-08
    title: Measurement Decision Risk, Guardbanding and Conformity Assessment
    kind: core
    status: draft
    summary: >-
      What happens when a measurement result is used to decide whether
      something passes. The point at which uncertainty stops being an academic
      quantity and starts costing money or endangering people. Governed by
      JCGM 106, ILAC-G8, ISO/IEC 17025 clause 7.8.6 and ANSI/NCSLI Z540.3.
      Boundary: uncertainty evaluation itself is CM-03.

    competencyAreas:

      - id: CM-08-A01
        title: Conformity Assessment Fundamentals
        status: draft
        elements:
          - { id: CM-08-001, title: "Conformity assessment and the role of measurement within it", levelCeiling: 4, status: draft }
          - { id: CM-08-002, title: "Specification limits, tolerance and the acceptance interval", levelCeiling: 4, status: draft }
          - { id: CM-08-003, title: "Why a result on the limit is not a decision", levelCeiling: 4, status: draft }
          - { id: CM-08-004, title: "Conformance and non-conformance as probabilistic statements", levelCeiling: 5, status: draft }
          - { id: CM-08-005, title: "Who owns the decision: laboratory, customer or regulator", levelCeiling: 5, status: draft }
          - { id: CM-08-006, title: "Consequences of a wrong decision and their asymmetry", levelCeiling: 5, status: draft }

      - id: CM-08-A02
        title: Decision Rules
        status: draft
        elements:
          - { id: CM-08-007, title: "What a decision rule must specify", levelCeiling: 4, status: draft }
          - { id: CM-08-008, title: "Simple acceptance and shared risk", levelCeiling: 4, status: draft }
          - { id: CM-08-009, title: "Binary and non-binary decision rules", levelCeiling: 4, status: draft }
          - { id: CM-08-010, title: "Decision rules under ISO/IEC 17025 clause 7.8.6", levelCeiling: 4, status: draft }
          - { id: CM-08-011, title: "ILAC-G8 guidance on statements of conformity", levelCeiling: 4, status: draft }
          - { id: CM-08-012, title: "ISO 14253-1 decision rules in dimensional inspection", levelCeiling: 4, status: draft }
          - { id: CM-08-013, title: "Agreeing a decision rule with a customer in advance", levelCeiling: 5, status: draft }
          - { id: CM-08-014, title: "Documenting a decision rule so it is auditable", levelCeiling: 4, status: draft }
          - { id: CM-08-015, title: "Reporting a conformity statement with its decision rule", levelCeiling: 4, status: draft }

      - id: CM-08-A03
        title: Measurement Decision Risk Theory
        status: draft
        elements:
          - { id: CM-08-016, title: "False accept and false reject risk defined", levelCeiling: 5, status: draft }
          - { id: CM-08-017, title: "Consumer risk and producer risk", levelCeiling: 5, status: draft }
          - { id: CM-08-018, title: "Specific risk contrasted with global risk", levelCeiling: 5, status: draft }
          - { id: CM-08-019, title: "The prior distribution of the measurand and where it comes from", levelCeiling: 5, status: draft }
          - { id: CM-08-020, title: "In-tolerance probability and end-of-period reliability as priors", levelCeiling: 5, status: draft }
          - { id: CM-08-021, title: "Computing false accept risk", levelCeiling: 5, status: draft }
          - { id: CM-08-022, title: "Computing false reject risk", levelCeiling: 5, status: draft }
          - { id: CM-08-023, title: "Sensitivity of computed risk to prior assumptions", levelCeiling: 5, status: draft }
          - { id: CM-08-024, title: "Risk analysis under JCGM 106", levelCeiling: 5, status: draft }
          - { id: CM-08-025, title: "Bayesian formulation of measurement decision risk", levelCeiling: 5, status: draft }

      - id: CM-08-A04
        title: Guardbanding
        status: draft
        elements:
          - { id: CM-08-026, title: "What a guardband is and what it buys", levelCeiling: 4, status: draft }
          - { id: CM-08-027, title: "Guardbanding to a target false accept risk", levelCeiling: 5, status: draft }
          - { id: CM-08-028, title: "The RDS and other common guardband multipliers", levelCeiling: 5, status: draft }
          - { id: CM-08-029, title: "Guardbanding by a fixed fraction of expanded uncertainty", levelCeiling: 4, status: draft }
          - { id: CM-08-030, title: "Asymmetric guardbands", levelCeiling: 5, status: draft }
          - { id: CM-08-031, title: "The cost of guardbanding: false rejects and rework", levelCeiling: 5, status: draft }
          - { id: CM-08-032, title: "Guardbanding in a multi-parameter calibration", levelCeiling: 5, status: draft }
          - { id: CM-08-033, title: "Explaining a guardband to a customer who sees only failed units", levelCeiling: 5, status: draft }

      - id: CM-08-A05
        title: Accuracy Ratios and Legacy Approaches
        status: draft
        summary: >-
          Ratio rules remain contractually mandated in much defence and
          aerospace work. Practitioners must understand both what they do and
          why the risk-based approach replaced them.
        elements:
          - { id: CM-08-034, title: "Test uncertainty ratio and test accuracy ratio", levelCeiling: 4, status: draft }
          - { id: CM-08-035, title: "The 4:1 ratio requirement and its origins", levelCeiling: 4, status: draft }
          - { id: CM-08-036, title: "What a ratio rule assumes and when those assumptions fail", levelCeiling: 5, status: draft }
          - { id: CM-08-037, title: "ANSI/NCSL Z540-1 requirements and their continuing contractual use", levelCeiling: 4, status: draft }
          - { id: CM-08-038, title: "ANSI/NCSLI Z540.3 and the 2 percent false accept requirement", levelCeiling: 5, status: draft }
          - { id: CM-08-039, title: "Migrating a programme from a ratio rule to a risk-based rule", levelCeiling: 5, status: draft }
          - { id: CM-08-040, title: "Demonstrating compliance when the ratio cannot be met", levelCeiling: 5, status: draft }

      - id: CM-08-A06
        title: Risk in Regulation, Sampling and Systems
        status: draft
        summary: >-
          Boundary: enterprise and quality risk management is CM-10 and CM-18;
          this area is measurement decision risk in its regulatory setting.
        elements:
          - { id: CM-08-041, title: "Sampling inspection and its interaction with measurement risk", levelCeiling: 5, status: draft }
          - { id: CM-08-042, title: "Risk-based thinking in ISO 9001 and ISO/IEC 17025", levelCeiling: 4, status: draft }
          - { id: CM-08-043, title: "Measurement risk in safety-critical and regulated products", levelCeiling: 5, status: draft }
          - { id: CM-08-044, title: "Legal metrology and conformity in trade", levelCeiling: 4, status: draft }
          - { id: CM-08-045, title: "Aggregating measurement risk across a process chain", levelCeiling: 5, status: draft }
          - { id: CM-08-046, title: "Building the economic case for a measurement capability improvement", levelCeiling: 5, status: draft }
