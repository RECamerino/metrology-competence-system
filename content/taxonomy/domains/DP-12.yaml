schemaVersion: 1
domains:
  - id: DP-12
    title: Photometry, Radiometry and Colorimetry
    kind: discipline
    status: draft
    summary: >-
      Optical radiation measured physically (radiometry), as perceived by the
      human eye (photometry), and as colour. Unusual among disciplines in that
      one of its base units, the candela, is defined by reference to a human
      observer — which makes the distinction between physical and perceptual
      quantities a competence in its own right rather than a technicality.

    competencyAreas:

      - id: DP-12-A01
        title: Radiometric and Photometric Quantities
        status: draft
        elements:
          - { id: DP-12-001, title: "Radiometric quantities: flux, intensity, irradiance, radiance", levelCeiling: 4, status: draft }
          - { id: DP-12-002, title: "Photometric quantities and their radiometric counterparts", levelCeiling: 4, status: draft }
          - { id: DP-12-003, title: "The candela definition and the spectral luminous efficiency function", levelCeiling: 5, status: draft }
          - { id: DP-12-004, title: "Photopic, scotopic and mesopic vision", levelCeiling: 4, status: draft }
          - { id: DP-12-005, title: "Solid angle, projected area and the inverse square law", levelCeiling: 4, status: draft }
          - { id: DP-12-006, title: "Lambertian sources and the cosine law", levelCeiling: 4, status: draft }
          - { id: DP-12-007, title: "Distance, alignment and the limits of the point source assumption", levelCeiling: 4, status: draft }
          - { id: DP-12-008, title: "Units and conversion in photometry and radiometry", levelCeiling: 3, status: draft }

      - id: DP-12-A02
        title: Detectors and Standards
        status: draft
        elements:
          - { id: DP-12-009, title: "Cryogenic radiometers as primary standards", levelCeiling: 5, status: draft }
          - { id: DP-12-010, title: "Silicon and other photodiode detectors", levelCeiling: 4, status: draft }
          - { id: DP-12-011, title: "Trap detectors and predictable quantum efficiency devices", levelCeiling: 4, status: draft }
          - { id: DP-12-012, title: "Thermal detectors: thermopiles and pyroelectrics", levelCeiling: 4, status: draft }
          - { id: DP-12-013, title: "Photometer heads and V-lambda filtering", levelCeiling: 4, status: draft }
          - { id: DP-12-014, title: "Spectral mismatch correction", levelCeiling: 5, status: draft }
          - { id: DP-12-015, title: "Detector linearity, spatial uniformity and temperature dependence", levelCeiling: 4, status: draft }
          - { id: DP-12-016, title: "Standard lamps and source standards", levelCeiling: 4, status: draft }
          - { id: DP-12-017, title: "Lamp ageing, seasoning and operating conditions", levelCeiling: 4, status: draft }
          - { id: DP-12-018, title: "Integrating spheres and their characterisation", levelCeiling: 4, status: draft }
          - { id: DP-12-019, title: "Stray light and its control", levelCeiling: 4, status: draft }

