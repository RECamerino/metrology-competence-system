schemaVersion: 1
domains:
  - id: DP-13
    title: Spectroscopy, Lasers and Fibre Optics
    kind: discipline
    status: draft
    summary: >-
      Wavelength-resolved measurement, coherent optical sources, and guided
      optical transmission. Distinguished from DP-12 by its concern with
      spectral structure rather than integrated optical power, and from DP-16 by
      treating spectroscopy as a physical measurement technique rather than as
      an analytical chemistry method.

    competencyAreas:

      - id: DP-13-A01
        title: Spectroscopic Fundamentals
        status: draft
        elements:
          - { id: DP-13-001, title: "Wavelength, wavenumber, frequency and energy relationships", levelCeiling: 3, status: draft }
          - { id: DP-13-002, title: "Absorption, emission and scattering processes", levelCeiling: 4, status: draft }
          - { id: DP-13-003, title: "Spectral resolution, bandpass and slit function", levelCeiling: 5, status: draft }
          - { id: DP-13-004, title: "Line shapes and broadening mechanisms", levelCeiling: 4, status: draft }
          - { id: DP-13-005, title: "Beer-Lambert law and its limits of validity", levelCeiling: 4, status: draft }
          - { id: DP-13-006, title: "Signal to noise and detection limits in spectroscopy", levelCeiling: 4, status: draft }

      - id: DP-13-A02
        title: Spectrometers and Their Calibration
        status: draft
        elements:
          - { id: DP-13-007, title: "Dispersive spectrometer architectures", levelCeiling: 4, status: draft }
          - { id: DP-13-008, title: "Fourier transform spectrometers", levelCeiling: 4, status: draft }
          - { id: DP-13-009, title: "Array detectors and their characterisation", levelCeiling: 4, status: draft }
          - { id: DP-13-010, title: "Wavelength calibration and reference standards", levelCeiling: 5, status: draft }
          - { id: DP-13-011, title: "Photometric and absorbance scale calibration", levelCeiling: 4, status: draft }
          - { id: DP-13-012, title: "Stray light characterisation and correction", levelCeiling: 4, status: draft }
          - { id: DP-13-013, title: "Bandwidth effects on measured absorbance", levelCeiling: 4, status: draft }
          - { id: DP-13-014, title: "Spectrometer verification standards and filters", levelCeiling: 4, status: draft }
          - { id: DP-13-015, title: "Uncertainty evaluation in spectrophotometry", levelCeiling: 5, status: draft }

      - id: DP-13-A03
        title: Spectroscopic Techniques
        status: draft
        elements:
          - { id: DP-13-016, title: "UV-visible absorption spectroscopy", levelCeiling: 4, status: draft }
          - { id: DP-13-017, title: "Infrared and FTIR spectroscopy", levelCeiling: 4, status: draft }
          - { id: DP-13-018, title: "Raman spectroscopy", levelCeiling: 4, status: draft }
          - { id: DP-13-019, title: "Fluorescence and luminescence spectroscopy", levelCeiling: 4, status: draft }
          - { id: DP-13-020, title: "Atomic absorption and emission spectroscopy", levelCeiling: 4, status: draft }
          - { id: DP-13-021, title: "Laser-based absorption and cavity enhanced techniques", levelCeiling: 4, status: draft }
          - { id: DP-13-022, title: "Frequency comb spectroscopy", levelCeiling: 4, status: draft }
          - { id: DP-13-023, title: "Hyperspectral imaging", levelCeiling: 4, status: draft }
          - { id: DP-13-024, title: "Chemometrics and multivariate spectral calibration", levelCeiling: 5, status: draft }

      - id: DP-13-A04
        title: Lasers and Coherent Sources
        status: draft
        elements:
          - { id: DP-13-025, title: "Laser principles and beam characteristics", levelCeiling: 4, status: draft }
          - { id: DP-13-026, title: "Beam quality, M-squared and beam profiling", levelCeiling: 4, status: draft }
          - { id: DP-13-027, title: "Laser power and energy measurement", levelCeiling: 4, status: draft }
          - { id: DP-13-028, title: "Wavelength and frequency stabilisation", levelCeiling: 4, status: draft }
          - { id: DP-13-029, title: "Stabilised lasers as length and frequency standards", levelCeiling: 5, status: draft }
          - { id: DP-13-030, title: "Optical frequency combs", levelCeiling: 4, status: draft }
          - { id: DP-13-031, title: "Linewidth and coherence measurement", levelCeiling: 4, status: draft }
          - { id: DP-13-032, title: "Pulsed laser characterisation", levelCeiling: 4, status: draft }
          - { id: DP-13-033, title: "Laser safety classification and control measures", levelCeiling: 4, status: draft }

      - id: DP-13-A05
        title: Interferometry
        status: draft
        elements:
