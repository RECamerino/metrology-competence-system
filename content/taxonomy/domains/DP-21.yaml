schemaVersion: 1
domains:
  - id: DP-21
    title: Geodetic and Gravitational Metrology
    kind: discipline
    status: draft
    summary: >-
      Measurement of position, height and the Earth's gravity field, treated as
      metrology rather than as surveying. In scope because optical clocks now
      resolve elevation change at the centimetre level, which makes the gravity
      potential a quantity a time and frequency laboratory measures — the
      boundary between geodesy and metrology has moved. Boundary: gravimetry
      serving mass and force realisation is DP-02-A06; GNSS timing is DP-14;
      large-volume dimensional work is DP-01-A05.

    competencyAreas:

      - id: DP-21-A01
        title: Reference Frames and Coordinate Systems
        status: draft
        summary: >-
          A coordinate is meaningless without the frame it is expressed in, and
          frames move. The most common failure in applied geodetic work is
          combining coordinates from different realisations or epochs.
        elements:
          - { id: DP-21-001, title: "Terrestrial reference systems and their realisations", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-21-002, title: "ITRF and its successive realisations", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-003, title: "Datums, epochs and why a coordinate needs both", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-004, title: "Plate motion and time-dependent coordinates", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-21-005, title: "Regional and national reference frames", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-21-006, title: "Transformations between frames and their uncertainty", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-007, title: "Celestial reference frames and Earth orientation parameters", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-008, title: "Map projections and the distortion they introduce", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-21-009, title: "Errors caused by mixing frames, realisations or epochs", kind: judgment, levelCeiling: 4, status: draft }

      - id: DP-21-A02
        title: Positioning and Geodetic Networks
        status: draft
        elements:
          - { id: DP-21-010, title: "GNSS positioning principles and error sources", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-21-011, title: "Differential and real-time kinematic positioning", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-012, title: "Precise point positioning", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-013, title: "Carrier phase ambiguity resolution", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-014, title: "Atmospheric delay: ionospheric and tropospheric modelling", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-015, title: "Multipath, antenna phase centre and site effects", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-016, title: "Very long baseline interferometry", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-017, title: "Satellite and lunar laser ranging", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-018, title: "Geodetic network design and adjustment", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-019, title: "Least squares adjustment and reliability of a network", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-020, title: "Uncertainty evaluation for geodetic positions", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-021, title: "Terrestrial surveying instruments and their calibration", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-022, title: "EDM calibration baselines", kind: skill, levelCeiling: 4, status: draft }

      - id: DP-21-A03
        title: Height Systems and Vertical Datums
        status: draft
        summary: >-
          Height is the quantity where geodesy and metrology disagree most
          quietly: three different heights over the same point are all correct
          and all different, and the difference is the gravity field.
        elements:
          - { id: DP-21-023, title: "Ellipsoidal, orthometric and normal heights distinguished", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-024, title: "Geoid, quasigeoid and reference surfaces", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-025, title: "Vertical datums and their realisation", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-21-026, title: "Spirit levelling and its error accumulation", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-027, title: "Geopotential numbers and dynamic heights", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-028, title: "Tide gauges and mean sea level determination", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-21-029, title: "International height reference systems", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-21-030, title: "Converting between height types and the uncertainty incurred", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-21-A04
        title: The Gravity Field and the Geoid
        status: draft
        summary: >-
          Boundary: absolute and relative gravimeter operation for laboratory
          use is DP-02-A06. This area is the field itself — its modelling,
          its spatial structure and its variation in time.
        elements:
          - { id: DP-21-031, title: "The Earth's gravity field and its representation", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-032, title: "Spherical harmonic models and global gravity fields", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-033, title: "Satellite gravimetry missions and their products", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-21-034, title: "Terrestrial gravity surveys and network densification", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-035, title: "Geoid determination and computation", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-036, title: "Gravity anomalies, disturbances and reductions", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-037, title: "Temporal gravity variation: hydrology, ice mass and tectonics", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-038, title: "Absolute gravity reference networks and international comparisons", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-039, title: "Gravity gradiometry", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-21-A05
        title: Relativistic Geodesy and Chronometric Levelling
        status: draft
        summary: >-
          The reason this pack is in scope. A clock's rate depends on the
          gravity potential at its location, so comparing two optical clocks
          measures the potential difference between them — height determined by
          frequency rather than by levelling. Metrology and geodesy are becoming
          the same measurement here, and this area is deliberately weighted
          toward expert level because the field is still being built.
        elements:
          - { id: DP-21-040, title: "Gravitational redshift and clock rate as a function of potential", kind: knowledge, levelCeiling: 5, status: draft }
          - { id: DP-21-041, title: "Chronometric levelling: height from frequency comparison", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-042, title: "Optical clock comparison over fibre links for geodesy", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-043, title: "Relativistic corrections in time transfer and positioning", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-044, title: "Uncertainty budget for a chronometric height determination", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-045, title: "Comparing chronometric and conventional height results", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-21-046, title: "Relativistic definition of a reference surface and its consequences", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-21-047, title: "Transportable clocks for field geodesy", kind: skill, levelCeiling: 5, status: draft }

      - id: DP-21-A06
        title: Deformation, Monitoring and Applied Geodetic Measurement
        status: draft
        elements:
          - { id: DP-21-048, title: "Deformation monitoring and change detection", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-049, title: "Structural and infrastructure monitoring", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-050, title: "Subsidence, uplift and groundwater-driven motion", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-051, title: "InSAR and satellite deformation measurement", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-052, title: "Distinguishing real motion from measurement artefact", kind: judgment, levelCeiling: 5, status: draft }
          - { id: DP-21-053, title: "Engineering geodesy for large facilities and accelerators", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-21-054, title: "Geodetic input to sea level and climate records", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-21-055, title: "Legal and cadastral measurement", kind: knowledge, levelCeiling: 3, status: draft }
