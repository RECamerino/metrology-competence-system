          - { id: CM-05-025, title: "Sample size determination", levelCeiling: 4, status: draft }
          - { id: CM-05-026, title: "Interval estimation for proportions and rates", levelCeiling: 4, status: draft }

      - id: CM-05-A04
        title: Hypothesis Testing and Inference
        status: draft
