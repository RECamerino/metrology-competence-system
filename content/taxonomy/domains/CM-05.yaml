          - { id: CM-05-021, title: "Method of moments and least squares as estimators", levelCeiling: 4, status: draft }
          - { id: CM-05-022, title: "Confidence intervals and what they actually claim", levelCeiling: 5, status: draft }
          - { id: CM-05-023, title: "Prediction intervals and tolerance intervals distinguished", levelCeiling: 5, status: draft }
