schemaVersion: 1
domains:
  - id: CM-05
    title: Statistics and Data Analysis for Metrology
    kind: core
    status: draft
    summary: >-
      The statistical competence a metrologist actually needs, taught for
      measurement rather than in general. Deliberately deep: statistical
      weakness is one of the most common limiting factors in a metrologist's
      career, and it is rarely diagnosed as such. Boundary: applying these
      methods to uncertainty evaluation is CM-03; to gauge studies is CM-07; to
      interval analysis is CM-09.

    competencyAreas:

      - id: CM-05-A01
        title: Descriptive Statistics and Data Summaries
        status: draft
        elements:
          - { id: CM-05-001, title: "Measures of location and their behaviour under contamination", levelCeiling: 3, status: draft }
          - { id: CM-05-002, title: "Measures of dispersion", levelCeiling: 3, status: draft }
          - { id: CM-05-003, title: "Sample versus population statistics", levelCeiling: 4, status: draft }
          - { id: CM-05-004, title: "Skewness, kurtosis and shape", levelCeiling: 3, status: draft }
          - { id: CM-05-005, title: "Quantiles, order statistics and empirical distributions", levelCeiling: 3, status: draft }
          - { id: CM-05-006, title: "Summarising data without misleading the reader", levelCeiling: 4, status: draft }

      - id: CM-05-A02
        title: Probability and Distributions
        status: draft
        elements:
          - { id: CM-05-007, title: "Probability axioms and interpretation", levelCeiling: 3, status: draft }
          - { id: CM-05-008, title: "Random variables, PDFs and CDFs", levelCeiling: 3, status: draft }
          - { id: CM-05-009, title: "The normal distribution and why it is assumed so often", levelCeiling: 3, status: draft }
          - { id: CM-05-010, title: "Rectangular, triangular and trapezoidal distributions", levelCeiling: 4, status: draft }
          - { id: CM-05-011, title: "Student t distribution and its role in metrology", levelCeiling: 4, status: draft }
          - { id: CM-05-012, title: "Chi-squared and F distributions", levelCeiling: 4, status: draft }
          - { id: CM-05-013, title: "Poisson and binomial distributions for counting", levelCeiling: 4, status: draft }
          - { id: CM-05-014, title: "Lognormal, Weibull and extreme value distributions", levelCeiling: 4, status: draft }
          - { id: CM-05-015, title: "The central limit theorem and its practical limits", levelCeiling: 5, status: draft }
          - { id: CM-05-016, title: "Joint, marginal and conditional distributions", levelCeiling: 5, status: draft }
          - { id: CM-05-017, title: "Covariance, correlation and independence", levelCeiling: 5, status: draft }
          - { id: CM-05-018, title: "Transformations of random variables", levelCeiling: 4, status: draft }

      - id: CM-05-A03
        title: Estimation and Interval Construction
        status: draft
        elements:
