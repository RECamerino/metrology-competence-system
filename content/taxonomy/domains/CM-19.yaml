          - { id: CM-19-042, title: "Standards copyright and lawful use of normative documents", levelCeiling: 4, status: draft }
          - { id: CM-19-043, title: "Anti-bribery and integrity in accreditation and certification", levelCeiling: 3, status: draft }

      - id: CM-19-A06
        title: Measurement, Society and Sustainability
        status: draft
        elements:
