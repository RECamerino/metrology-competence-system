schemaVersion: 1
domains:
  - id: CM-19
    title: Ethics, Legal and Regulatory Metrology
    kind: core
    status: draft
    summary: >-
      Where measurement carries legal force, and where a metrologist's
      professional obligations may conflict with commercial pressure. Legal
      metrology (OIML and national frameworks) and professional ethics are
      combined here because both concern the enforceable consequences of a
      measurement result. Boundary: accreditation requirements are CM-10;
      signatory responsibility is CM-11.

    competencyAreas:

      - id: CM-19-A01
        title: Professional Ethics
        status: draft
        elements:
          - { id: CM-19-001, title: "Professional obligations of a metrologist", levelCeiling: 3, status: draft }
          - { id: CM-19-002, title: "Honesty in reporting and the duty not to mislead", levelCeiling: 5, status: draft }
          - { id: CM-19-003, title: "Data selection, exclusion and the boundary with fabrication", levelCeiling: 5, status: draft }
          - { id: CM-19-004, title: "Pressure to report a favourable result", levelCeiling: 4, status: draft }
          - { id: CM-19-005, title: "Conflicts of interest and impartiality in practice", levelCeiling: 4, status: draft }
          - { id: CM-19-006, title: "Competence limits and declining work you cannot do", levelCeiling: 4, status: draft }
          - { id: CM-19-007, title: "Confidentiality and its limits", levelCeiling: 3, status: draft }
          - { id: CM-19-008, title: "Raising concerns and whistleblowing", levelCeiling: 4, status: draft }
          - { id: CM-19-009, title: "Research integrity and authorship", levelCeiling: 3, status: draft }
          - { id: CM-19-010, title: "Case studies in measurement-related failure and misconduct", levelCeiling: 4, status: draft }

      - id: CM-19-A02
        title: Legal Metrology Frameworks
        status: draft
        elements:
          - { id: CM-19-011, title: "What legal metrology is and where it applies", levelCeiling: 3, status: draft }
          - { id: CM-19-012, title: "OIML structure, recommendations and documents", levelCeiling: 3, status: draft }
          - { id: CM-19-013, title: "The OIML certification system", levelCeiling: 3, status: draft }
          - { id: CM-19-014, title: "National legal metrology authorities and their powers", levelCeiling: 3, status: draft }
          - { id: CM-19-015, title: "Regional frameworks and the European measuring instruments directives", levelCeiling: 3, status: draft }
          - { id: CM-19-016, title: "Type approval and pattern evaluation", levelCeiling: 4, status: draft }
          - { id: CM-19-017, title: "Initial and subsequent verification of regulated instruments", levelCeiling: 4, status: draft }
          - { id: CM-19-018, title: "Sealing, security and prevention of unauthorised adjustment", levelCeiling: 4, status: draft }
          - { id: CM-19-019, title: "Market surveillance and enforcement", levelCeiling: 3, status: draft }

      - id: CM-19-A03
        title: Regulated Measurement Sectors
        status: draft
        elements:
          - { id: CM-19-020, title: "Trade measurement and weights and measures enforcement", levelCeiling: 3, status: draft }
          - { id: CM-19-021, title: "Prepackaged goods and average quantity systems", levelCeiling: 4, status: draft }
          - { id: CM-19-022, title: "Utility metering: electricity, gas, water and heat", levelCeiling: 4, status: draft }
          - { id: CM-19-023, title: "Fuel dispensing and custody transfer", levelCeiling: 3, status: draft }
          - { id: CM-19-024, title: "Medical and clinical measurement regulation", levelCeiling: 4, status: draft }
          - { id: CM-19-025, title: "Pharmaceutical GMP and measurement obligations", levelCeiling: 4, status: draft }
          - { id: CM-19-026, title: "Environmental and emissions monitoring requirements", levelCeiling: 4, status: draft }
          - { id: CM-19-027, title: "Road safety, speed and breath alcohol measurement", levelCeiling: 3, status: draft }
          - { id: CM-19-028, title: "Nuclear, radiation and safety-critical measurement regimes", levelCeiling: 4, status: draft }
          - { id: CM-19-029, title: "Aviation, defence and space measurement requirements", levelCeiling: 4, status: draft }

