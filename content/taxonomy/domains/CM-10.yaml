schemaVersion: 1
domains:
  - id: CM-10
    title: Quality Management Systems and Accreditation
    kind: core
    status: draft
    summary: >-
      The management-system framework a laboratory operates within, and what
      accreditation actually requires. Centred on ISO/IEC 17025:2017, with the
      surrounding standards a metrologist encounters. Boundary: performing an
      assessment is CM-11; laboratory facilities and operations are CM-12; legal
      metrology obligations are CM-19.

    competencyAreas:

      - id: CM-10-A01
        title: Management System Fundamentals
        status: draft
        elements:
          - { id: CM-10-001, title: "What a management system is and what it is for", levelCeiling: 3, status: draft }
          - { id: CM-10-002, title: "Process approach and the plan-do-check-act cycle", levelCeiling: 3, status: draft }
          - { id: CM-10-003, title: "Documented information: what must be controlled and why", levelCeiling: 4, status: draft }
          - { id: CM-10-004, title: "Document control and version integrity", levelCeiling: 4, status: draft }
          - { id: CM-10-005, title: "Records, retention and retrievability", levelCeiling: 4, status: draft }
          - { id: CM-10-006, title: "Risk-based thinking in a laboratory context", levelCeiling: 4, status: draft }
          - { id: CM-10-007, title: "Writing a procedure people will actually follow", levelCeiling: 5, status: draft }
          - { id: CM-10-008, title: "Management system architecture and the cost of over-documentation", levelCeiling: 5, status: draft }

      - id: CM-10-A02
        title: ISO/IEC 17025 Structural and Resource Requirements
        status: draft
        elements:
