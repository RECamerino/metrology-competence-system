schemaVersion: 1
domains:
  - id: DP-09
    title: AC, Power, Energy and Impedance
    kind: discipline
    status: draft
    summary: >-
      Alternating quantities, electrical power and energy, and the impedance
      standards that underpin them. Distinguished from DC work by the fact that
      almost every quantity becomes frequency dependent and phase becomes a
      first-class measurand. Boundary: DC is DP-08; above roughly 1 GHz is
      DP-10; utility metering regulation is CM-19-A03.

    competencyAreas:

      - id: DP-09-A01
        title: AC Voltage and Current
        status: draft
        elements:
          - { id: DP-09-001, title: "RMS, average and peak values and their relationships", kind: knowledge, levelCeiling: 3, status: draft }
          - { id: DP-09-002, title: "Thermal converters and AC-DC transfer difference", kind: skill, levelCeiling: 5, status: draft }
          - { id: DP-09-003, title: "Multijunction thermal converters", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-004, title: "AC-DC transfer standards and their use", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-005, title: "Sampling and digital AC measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-006, title: "Josephson AC voltage synthesis", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-007, title: "AC voltage calibration procedures", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-008, title: "Frequency response and flatness of AC instruments", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-009, title: "AC current measurement and shunts", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-010, title: "Waveform distortion and non-sinusoidal measurement", kind: skill, levelCeiling: 4, status: draft }
          - { id: DP-09-011, title: "Crest factor and instrument limitations", kind: knowledge, levelCeiling: 4, status: draft }
          - { id: DP-09-012, title: "Uncertainty budget for AC voltage calibration", kind: skill, levelCeiling: 5, status: draft }

